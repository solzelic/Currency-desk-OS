  <style>
    body { margin: 0; background: #e7e4dd; }
    * { box-sizing: border-box; }
    input::placeholder { color: var(--faint); opacity: 1; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary-deep); }
    @keyframes cdPop { 0% { transform: scale(0.5); opacity: 0; } 62% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes cdGlow { 0%, 100% { opacity: 0.45; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.09); } }
    @keyframes cdScreenFwd { from { opacity: 0; transform: translateX(34px); } to { opacity: 1; transform: none; } }
    @keyframes cdScreenBack { from { opacity: 0; transform: translateX(-34px); } to { opacity: 1; transform: none; } }
    @keyframes cdIntroIn { from { opacity: 0; transform: translateY(18px) scale(0.985); } to { opacity: 1; transform: none; } }
    @keyframes cdScreenIn { from { opacity: 0; transform: translateY(12px) scale(0.99); } to { opacity: 1; transform: none; } }
    @keyframes cdSheen { 0% { transform: translateX(-170%) rotate(8deg); } 55%, 100% { transform: translateX(190%) rotate(8deg); } }
    @keyframes cdDrift1 { 0% { transform: translate(0,0); } 100% { transform: translate(64px,46px); } }
    @keyframes cdDrift2 { 0% { transform: translate(0,0); } 100% { transform: translate(-56px,-42px); } }
    @keyframes cdRise { 0% { transform: translateY(24px); opacity: 0; } 14% { opacity: 0.06; } 80% { opacity: 0.06; } 100% { transform: translateY(-130px); opacity: 0; } }
    @keyframes cdLive { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.85); } 70% { box-shadow: 0 0 0 5px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
    @keyframes cdTicker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes cdBloom { 0% { opacity: 0; } 24% { opacity: 1; } 64% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes cdLift { 0%, 60% { opacity: 1; transform: translateY(0); filter: blur(0); } 100% { opacity: 0; transform: translateY(-42px); filter: blur(3px); pointer-events: none; } }
    @keyframes cdRiseHero { 0% { opacity: 0; transform: translateY(26px); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes cdScIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes cdScPop { 0% { opacity: 0; transform: scale(0.92); } 60% { opacity: 1; transform: scale(1.02); } 100% { opacity: 1; transform: none; } }
    @keyframes cdScFill { from { width: 0; } to { width: 100%; } }
    @keyframes cdScDot { from { background: transparent; } to { background: #17140F; } }
    @keyframes cdScOut { to { opacity: 0; transform: scale(0.97); visibility: hidden; } }
    @keyframes cdScHi { 0%, 100% { box-shadow: 0 0 0 0 rgba(46,163,107,0); } 50% { box-shadow: 0 0 0 6px rgba(46,163,107,0.22); } }
    @keyframes cdScType { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes cdFadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cdSpin { to { transform: rotate(360deg); } }
    @keyframes cdRing { from { stroke-dashoffset: 126; } to { stroke-dashoffset: 0; } }
    @keyframes cdRing2 { from { stroke-dashoffset: 151; } to { stroke-dashoffset: 0; } }
    @keyframes cdRing5 { from { stroke-dashoffset: 183; } to { stroke-dashoffset: 0; } }
    @keyframes cdRing6 { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }
    @keyframes cdRing4 { from { stroke-dashoffset: 164; } to { stroke-dashoffset: 0; } }
    @keyframes cdTick { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
    @keyframes cdDlgIn { from { opacity: 0; transform: translateY(-18px) scale(0.98); } to { opacity: 1; transform: none; } }
    @keyframes cdSheetUp { from { transform: translateY(105%); } to { transform: none; } }
    @keyframes cdSheetDown { from { transform: none; opacity: 1; } to { transform: translateY(105%); opacity: 0.6; } }
    @keyframes cdDlgOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-10px) scale(0.98); } }
    @keyframes cdScanPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.92); opacity: 0.75; } }
    @keyframes cdScrimIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cdRing3 { from { stroke-dashoffset: 107; } to { stroke-dashoffset: 0; } }
    @keyframes cdDigitIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @keyframes cdCheckIn { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.22) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes cdCheckRing { 0% { box-shadow: 0 0 0 0 rgba(46,163,107,0.55); } 100% { box-shadow: 0 0 0 14px rgba(46,163,107,0); } }
    @keyframes cdDraw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
    @keyframes cdSubIn { from { opacity: 0; transform: translateY(-4px); max-height: 0; } to { opacity: 1; transform: none; max-height: 22px; } }
    @keyframes cdOpen { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @keyframes cdTickPop2 { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
    @keyframes cdChevPulse { 0% { box-shadow: 0 0 0 0 rgba(46,163,107,0.55); } 70%, 100% { box-shadow: 0 0 0 10px rgba(46,163,107,0); } }
    @keyframes cdChevNudge { 0%, 64%, 100% { transform: translateY(0) rotate(0); box-shadow: 0 0 0 0 rgba(46,163,107,0.5); } 70% { transform: translateY(3px) rotate(-10deg); } 76% { transform: translateY(-1px) rotate(9deg); } 82% { transform: translateY(2px) rotate(-6deg); box-shadow: 0 0 0 9px rgba(46,163,107,0); } 88% { transform: translateY(0) rotate(3deg); } }
    @keyframes cdConf { 0% { opacity: 0; transform: translateY(0) rotate(0deg); } 8% { opacity: 1; } 100% { opacity: 0; transform: translateY(110vh) rotate(720deg); } }
    @keyframes cdAppPop { 0% { transform: scale(0.6); opacity: 0.2; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes cdBlink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes cdApSpin { to { transform: rotate(360deg); } }
    @keyframes cdApRing { from { stroke-dashoffset: 352; } to { stroke-dashoffset: 0; } }
    @keyframes cdApGrow { to { transform: scale(9); opacity: 0; } }
    @keyframes cdRowLand { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes cdSealRing { from { stroke-dashoffset: 377; } to { stroke-dashoffset: 0; } }
    @keyframes cdStamp { 0% { transform: translate(-50%,-50%) scale(2.2) rotate(-14deg); opacity: 0; } 55% { transform: translate(-50%,-50%) scale(0.94) rotate(-8deg); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1) rotate(-8deg); opacity: 1; } }
    @keyframes cdFlashIn { from { clip-path: circle(0% at 50% 60%); } to { clip-path: circle(140% at 50% 60%); } }
    @keyframes cdFlashOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes cdBar { 0% { background-position: 0% 0; } 100% { background-position: -200% 0; } }
    @keyframes cdReady { 0%, 100% { box-shadow: 0 16px 32px -14px rgba(23,20,15,0.55), 0 0 0 0 rgba(46,163,107,0.0); } 50% { box-shadow: 0 16px 32px -14px rgba(23,20,15,0.55), 0 0 0 6px rgba(46,163,107,0.22); } }
    @keyframes cdPinDrop { 0% { opacity: 0; transform: translate(-50%, -260%); } 70% { opacity: 1; transform: translate(-50%, -92%); } 100% { opacity: 1; transform: translate(-50%, -100%); } }
    @keyframes cdRingPop { 0% { transform: scale(0.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes cdPinDot { 0%, 8% { background: transparent; transform: none; } 14%, 72% { background: #17140F; border-color: #17140F; transform: scale(1.08); } 80%, 100% { background: transparent; transform: none; } }

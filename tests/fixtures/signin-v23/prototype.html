<title>Sign in · v2.3</title>

<style>
  :root { --f: 'Schibsted Grotesk', system-ui, sans-serif; --m: 'IBM Plex Mono', monospace; --serif: 'Instrument Serif', serif; --ink: #17140F; --mute: #6E675E; --faint: #736C62; --line: rgba(23,20,15,0.1); --green: #1D6B45; --green-deep: #17583A; --cd-green: #1D6B45; --flag: #C2452D; --amber: #B9801C; --amber-soft: rgba(185,128,28,0.1); --desk: #E7E4DD; --card: #FAF9F6; }

  .meter { display: flex; gap: 4px; margin-top: 8px; } .meter span { flex: 1; height: 4px; border-radius: 2px; background: rgba(23,20,15,0.1); } .meter span.on { background: var(--green); } .meter span.weak { background: var(--amber); }

  /* device sheets: passkey and the account chooser */

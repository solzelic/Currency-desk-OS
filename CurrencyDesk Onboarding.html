document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- VERIFY -->\n            <sc-if value=\"{{ t_verify }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top: 22px;\">\n                <input inputmode=\"numeric\" maxlength=\"6\" value=\"{{ code }}\" sc-camel-on-change=\"{{ onCode }}\" data-focus=\"true\" placeholder=\"000000\" style=\"width: 100%; text-align: center; letter-spacing: 0.42em; font-family: var(--m); font-size: 26px; font-weight: 700; padding: 16px 0; border: 1px solid var(--primary); border-radius: 12px; background: #fff; box-shadow: 0 0 0 3px rgba(29,107,69,0.12); outline: none; color: var(--ink);\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; margin-top: 12px;\"><span style=\"font-size: 12.5px; color: var(--mute);\">No text yet?<\u002Fspan><button sc-camel-on-click=\"{{ onResend }}\" style=\"background: none; border: 0; color: var(--primary); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 6px;\">Send it again<\u002Fbutton><\u002Fdiv>\n                <div style=\"display: flex; align-items: flex-start; gap: 9px; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--hair); font-size: 12px; line-height: 1.5; color: var(--mute);\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px;\"><path d=\"M12 3.2 4 6.4v5.1c0 4.6 3.3 8.5 8 9.3 4.7-.8 8-4.7 8-9.3V6.4z\"><\u002Fpath><path d=\"M9.2 12.2 11.3 14.4 15 10.4\"><\u002Fpath><\u002Fsvg>\n                  <span>Wrong number? <button sc-camel-on-click=\"{{ onFixPhone }}\" style=\"background: none; border: 0; padding: 0; color: var(--primary); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline;\">Go back and change it<\u002F form;\">{{ tickerRun }}{{ tickerRun }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- dock -->\n      <div style=\"height: 60px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 12px; background: rgba(255,255,255,0.4); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border-bottom: 1px solid var(--line); overflow: hidden;\">\n        <sc-for list=\"{{ dock }}\" as=\"app\" hint-placeholder-count=\"8\">\n          <div style=\"display: flex; align-items: center; gap: 9px; padding: 0 13px; height: 42px; border-radius: 10px; flex: none;\"><span style=\"display: grid; place-items: center; color: {{ app.color }};\">{{ app.icon }}<\u002Fspan><span style=\"font-family: var(--m); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); white-space: nowrap;\">{{ app.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <!-- desktop -->\n      <div style=\"flex: 1; position: relative; overflow: hidden; padding: 40px;\">\n        <sc-if value=\"{{ landing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div key=\"{{ landKey }}\" style=\"position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5;\">\n            <div style=\"position: absolute; top: -12%; left: 50%; width: 920px; height: 720px; transform: translateX(-50%); background: radial-gradient(circle at 50% 40%, rgba(255,247,232,0.92) 0%, rgba(250,240,220,0.34) 34%, rgba(233,229,221,0) 66%); animation: cdBloom 4.4s ease-in-out forwards;\"><\u002Fdiv>\n            <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: cdLift 4.4s cubic-bezier(0.5,0,0.2,1) forwards;\">\n              <div style=\"display: flex; align-items: center; gap: 12px; opacity: 0; animation: cdFadeUp 0.7s cubic-bezier(0.2,0.8,0.2,1) 0.1s forwards;\"><span style=\"width: 26px; height: 1px; background: var(--faint);\"><\u002Fspan><span style=\"font-family: var(--m); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--mute);\">Your desk · Day 1<\u002Fspan><span style=\"width: 26px; height: 1px; background: var(--faint);\"><\u002Fspan><\u002Fdiv>\n              <h1 style=\"font-family: var(--serif); font-size: 80px; line-height: 1; margin: 20px 0 0; font-weight: 400; letter-spacing: -0.01em; opacity: 0; animation: cdRiseHero 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;\">{{ greetHello }}<\u002Fh1>\n              <p style=\"font-size: 15.5px; line-height: 1.6; color: var(--mute); margin: 22px 0 0; opacity: 0; animation: cdFadeUp 0.75s cubic-bezier(0.2,0.8,0.2,1) 0.8s forwards;\">Two things to get you trading.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div key=\"{{ cardsKey }}\" style=\"position: relative; z-index: 6; height: 100%; display: flex; align-items: center; justify-content: center;\">\n            <div style=\"width: 100%; max-width: 720px;\">\n              <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 16px; opacity: 0; animation: cdCardIn 0.7s cubic-bezier(0.2,0.8,0.2,1) 2.2s forwards;\"><span style=\"display: inline-flex; align-items: center; gap: 7px; font-family: var(--m); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green-live);\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: var(--green-live); animation: cdLive 1.8s infinite;\"><\u002Fspan>{{ openLabel }}<\u002Fspan><span style=\"flex: 1; height: 1px; background: var(--line);\"><\u002Fspan><span style=\"font-family: var(--m); font-size: 10px; letter-spacing: 0.06em; color: var(--faint);\">{{ toDoLabel }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                <sc-for list=\"{{ startCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ c.wrap }}\">\n                    <button sc-camel-on-click=\"{{ c.onToggle }}\" style=\"width: 100%; display: flex; align-items: center; gap: 13px; padding: 15px 17px; border: 0; background: none; cursor: pointer; text-align: left;\">\n                      <span style=\"{{ c.markStyle }}\">\n                        <sc-if value=\"{{ c.done }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                        <sc-if value=\"{{ c.notDone }}\" hint-placeholder-val=\"{{ true }}\">{{ c.n }}<\u002Fsc-if>\n                      <\u002Fspan>\n                      <span style=\"flex: 1; min-width: 0;\">\n                        <span style=\"display: flex; align-items: center; gap: 8px;\"><b style=\"{{ c.titleStyle }}\">{{ c.title }}<\u002Fb><sc-if value=\"{{ c.hasTag }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ c.tagStyle }}\">{{ c.tag }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                        <span style=\"display: block; font-size: 12.5px; line-height: 1.45; color: var(--mute); margin-top: 2px;\">{{ c.sub }}<\u002Fspan>\n                      <\u002Fspan>\n                      <svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"var(--faint)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"{{ c.chevStyle }}\"><path d=\"M6 9.5l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                    <sc-if value=\"{{ c.open }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding: 0 17px 16px 55px;\">\n                        <sc-if value=\"{{ c.isImport }}\" hint-placeholder-val=\"{{ false }}\">\n                          <p style=\"font-size: 13px; line-height: 1.55; color: var(--mute); margin: 0 0 12px;\">Drop in whatever you keep rates in — a spreadsheet, last week's printout, a photo of the board. Our agent reads it and fills your board so nobody types forty numbers by hand.<\u002Fp>\n                          <sc-if value=\"{{ importIdle }}\" hint-placeholder-val=\"{{ true }}\">\n                            <button sc-camel-on-click=\"{{ onDropFile }}\" style=\"width: 100%; padding: 22px 16px; border: 1.5px dashed var(--line); border-radius: 12px; background: rgba(255,255,255,0.6); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;\" style-hover=\"border-color: var(--primary); background: rgba(29,107,69,0.05);\">\n                              <svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4\"><\u002Fpath><path d=\"M7.5 8.5 12 4l4.5 4.5\"><\u002Fpath><path d=\"M4 16.5v2A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-2\"><\u002Fpath><\u002Fsvg>\n                              <span style=\"font-size: 13.5px; font-weight: 700;\">Drop your rate file here<\u002Fspan>\n                              <span style=\"font-family: var(--m); font-size: 10.5px; color: var(--faint);\">XLSX · CSV · PDF · a photo of the board<\u002Fspan>\n                            <\u002Fbutton>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ importReading }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"padding: 17px 16px; border: 1px solid rgba(29,107,69,0.26); border-radius: 12px; background: rgba(29,107,69,0.05); overflow: hidden;\">\n                              <div style=\"display: flex; align-items: center; gap: 10px;\">\n                                <span style=\"flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--primary); animation: cdLive 1.6s infinite;\"><svg sc-camel-view-box=\"0 0 24 24\" u002Fp>\n                <p style=\"{{ termsP }}\">You confirm you have the right to give us any client information you enter, and that you'll collect and use it lawfully in your jurisdiction. We may use aggregated and de-identified data — data that cannot identify you, your business or your clients — to operate, secure and improve the service.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">6 · Your account and your team<\u002Fdiv>\n                <p style=\"{{ termsP }}\">You're responsible for your credentials and for everything done under accounts you create for your team, including what they can see and do. Tell us promptly if you think an account has been compromised.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">7 · Acceptable use<\u002Fdiv>\n                <p style=\"{{ termsP }}\">Don't use the service to break the law, to launder money, to evade sanctions, to store someone else's data without the right to, or to attack, reverse-engineer or resell the platform. Don't misrepresent rates or records you produce with it.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">8 · Early access<\u002Fdiv>\n                <p style=\"{{ termsP }}\">If you're on an early-access or founding plan, you understand the platform is still being built. Features may change, break, or be withdrawn. In exchange for preferential pricing you agree we may contact you for feedback, and that feedback you give us can be used to improve the product without obligation or payment. Any founding rate we've confirmed in writing is held for the life of that account.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">9 · Availability and warranties<\u002Fdiv>\n                <p style=\"{{ termsP }}\">We work hard to keep the desk up, but the service is provided \"as is\" and \"as available\". To the fullest extent the law allows, we disclaim implied warranties of merchantability, fitness for a particular purpose and non-infringement. We don't warrant that the service will be uninterrupted, error-free, or that it will make you compliant.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">10 · Limitation of liability<\u002Fdiv>\n                <p style=\"{{ termsP }}\">To the fullest extent the law allows, neither party is liable for indirect, incidental, special, consequential or punitive damages, or for lost profits, lost business, lost data or regulatory penalties. Our total liability for any claim is capped at the fees you paid us in the twelve months before the claim arose. Some jurisdictions don't allow these limits; where that's so, they apply to the extent permitted.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">11 · Indemnity<\u002Fdiv>\n                <p style=\"{{ termsP }}\">You'll defend and indemnify us against claims arising from your use of the service, your records, your clients, or your breach of this agreement or of the law that applies to your business.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">12 · Third parties<\u002Fdiv>\n                <p style=\"{{ termsP }}\">The desk relies on third-party providers for things like payments, verification and rate data. Their terms govern their part, and we're not responsible for their acts or omissions.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">13 · Intellectual property<\u002Fdiv>\n                <p style=\"{{ termsP }}\">The platform, its design and everything in it stays ours. You get a limited, non-exclusive, non-transferable right to use it while your account is active.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">14 · Changes to this agreement<\u002Fdiv>\n                <p style=\"{{ termsP }}\">We may update these terms. For material changes we'll email the address on your account before they take effect. Continuing to use the service after that date means you accept the new version.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">15 · Law and disputes<\u002Fdiv>\n                <p style=\"{{ termsP }}\">This agreement is governed by the laws of the Province of Ontario and the federal laws of Canada that apply there, and both parties submit to the exclusive jurisdiction of the courts of Ontario. Claims must be brought individually, not as part of a class action. Before filing anything, talk to us — most things are resolved with an email.<\u002Fp>\n\n                <div style=\"{{ termsH }}\">16 · The rest<\u002Fdiv>\n                <p style=\"{{ termsP }}\">If a clause is unenforceable, the rest survives. Not enforcing something once doesn't waive it. You can't assign this agreement without our consent; we may assign it in a merger or sale. This agreement and the Privacy Policy are the whole understanding between us on this subject.<\u002Fp>\n\n                <div style=\"margin: 18px 0 0; padding-top: 13px; border-top: 1px solid var(--hair); text-align: center;\">\n                  <div style=\"font-family: var(--m); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--primary); font-weight: 700;\">End of agreement<\u002Fdiv>\n                  <div style=\"font-size: 11.5px; color: var(--faint); margin-top: 5px;\">Questions before you sign? <a href=\"CurrencyDesk Contact.dc.html\" target=\"_blank\" style=\"color: var(--primary); font-weight: 600;\">Ask us<\u002Fa> — we'd rather answer now.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <button type=\"button\" sc-camel-on-click=\"{{ onToggleTerms }}\" style=\"{{ termsRowStyle }}\">\n                <span style=\"{{ termsBoxIconStyle }}\"><sc-if value=\"{{ termsRead }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><\u002Fspan>\n                <span style=\"flex: 1; min-width: 0; text-align: left; font-size: 12.5px;

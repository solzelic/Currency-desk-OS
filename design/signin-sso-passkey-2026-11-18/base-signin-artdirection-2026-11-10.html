<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Archivo;src:url(Archivo.ttf);font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:'Instrument Serif';src:url(InstrumentSerif-Regular.ttf)}
@font-face{font-family:'Instrument Serif';font-style:italic;src:url(InstrumentSerif-Italic.ttf)}
@font-face{font-family:'Schibsted Grotesk';src:url(SchibstedGrotesk.ttf);font-weight:400 900}
@font-face{font-family:'IBM Plex Mono';src:url(IBMPlexMono-Regular.ttf);font-weight:400}
@font-face{font-family:'IBM Plex Mono';src:url(IBMPlexMono-Medium.ttf);font-weight:500}
@font-face{font-family:'IBM Plex Mono';src:url(IBMPlexMono-SemiBold.ttf);font-weight:600}
:root{--ink:#17140F;--paper:#F7F4ED;--white:#FFFFFF;--green:#1D6B45;--graphite:#45403A;--stone:#7A736A;--hair:#D9D2C4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;background:var(--paper);color:var(--ink);font-family:Archivo,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.page{position:relative;width:1440px;height:900px;padding:0 80px}
header{height:112px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--hair)}
header .lockup{height:54px;margin-left:-6px;display:block}
.newhere{font-size:15px;color:var(--stone);letter-spacing:0}
.newhere a{color:var(--ink);font-weight:600;text-decoration:none;margin-left:6px}
.newhere a .arr{color:var(--green);margin-left:4px}
.eyebrow{font-family:'IBM Plex Mono';font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone)}
.left{position:absolute;left:80px;top:196px;width:640px}
h1{font-family:'Instrument Serif';font-weight:400;font-size:168px;line-height:.86;letter-spacing:-0.025em;margin-top:28px;color:var(--ink)}
h1 em{font-style:italic;letter-spacing:-0.02em}
h1 .dot{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--green);margin-left:10px;vertical-align:baseline}
.sub{margin-top:36px;font-size:21px;line-height:1.45;color:var(--graphite);max-width:440px}
.slot{position:absolute;height:1px;background:var(--ink)}
.right{position:absolute;left:880px;top:196px;width:480px}
.btn{height:60px;border-radius:12px;display:flex;align-items:center;padding:0 22px;font-size:17px;font-weight:550;letter-spacing:0;gap:14px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary .lbl{flex:1}
.tag{font-family:'IBM Plex Mono';font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8FD3AE;border:1px solid rgba(143,211,174,.35);border-radius:999px;padding:5px 10px 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.btn.sec{background:var(--white);border:1px solid var(--hair);color:var(--ink);justify-content:center;font-size:16px;box-shadow:0 1px 0 rgba(23,20,15,.04)}
.or{display:flex;align-items:center;gap:16px;margin:30px 0 26px}
.or i{flex:1;height:1px;background:var(--hair)}
.or span{font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.16em;color:var(--stone);text-transform:uppercase}
label{display:block;margin-bottom:10px}
.field{height:60px;border-radius:12px;background:var(--white);border:1px solid #CFC7B7;display:flex;align-items:center;padding:0 8px 0 20px}
.field .ph{flex:1;font-size:17px;color:#A39C90}
.go{width:44px;height:44px;border-radius:9px;background:var(--paper);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center}
.foot{display:flex;justify-content:space-between;margin-top:22px;font-size:15px}
.foot a{color:var(--ink);font-weight:550;text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:2px}
.foot .muted{color:var(--stone)}
footer{position:absolute;left:80px;right:80px;bottom:0;height:72px;border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between}
footer .line{font-family:'Instrument Serif';font-style:italic;font-size:19px;color:var(--graphite)}
</style></head><body><div class="page">
<header>
  <svg class="lockup" viewBox="0 0 640 140" xmlns="http://www.w3.org/2000/svg" font-family="'Schibsted Grotesk', sans-serif">
    <mask id="s"><rect width="640" height="140" fill="#fff"/><rect x="60" y="64.5" width="92" height="11" fill="#000"/></mask>
    <g mask="url(#s)"><circle cx="60" cy="70" r="48" fill="#17140F"/><path d="M116,22 H136 A48,48 0 0 1 136,118 H116 Z" fill="#17140F"/></g>
    <circle cx="112" cy="70" r="6.5" fill="#1D6B45"/>
    <text x="196" y="84" font-size="42" font-weight="800" letter-spacing="2.1" fill="#17140F">CURRENCYDESK<tspan dx="7" dy="-22" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="19" letter-spacing="1.5" fill="#1D6B45">OS</tspan></text>
  </svg>
  <div class="newhere">New here?<a href="#">Create your desk<span class="arr">→</span></a></div>
</header>

<section class="left">
  <div class="eyebrow">Sign in</div>
  <h1>Open<br><em>the</em> desk<span class="dot" id="dot"></span></h1>
  <p class="sub">Sign in the way you set it up.</p>
</section>

<section class="right">
  <div class="btn primary" id="pk">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F7F4ED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
    <span class="lbl">Continue with a passkey</span><span class="tag">Recommended</span>
  </div>
  <div class="row">
    <div class="btn sec"><svg width="19" height="19" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Google</div>
    <div class="btn sec"><svg width="17" height="17" viewBox="0 0 21 21"><rect width="10" height="10" fill="#F25022"/><rect x="11" width="10" height="10" fill="#7FBA00"/><rect y="11" width="10" height="10" fill="#00A4EF"/><rect x="11" y="11" width="10" height="10" fill="#FFB900"/></svg>Microsoft</div>
  </div>
  <div class="or"><i></i><span>or</span><i></i></div>
  <label class="eyebrow">Email or desk ID</label>
  <div class="field"><span class="ph">you@shop.ca or desk ID</span>
    <div class="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>
  <div class="foot"><span><span class="muted">Can’t get in?</span>&nbsp;&nbsp;<a href="#">Recover access</a></span></div>
</section>

<div class="slot" id="slot"></div>

<footer><span class="line">Every exchange, on the record.</span></footer>
</div>
<script>
document.fonts.ready.then(()=>{
const left=document.querySelector('.left'),right=document.querySelector('.right');
const d=document.getElementById('dot'),pk=document.getElementById('pk');
// vertically centre the stepped composition between header (112) and footer (828)
let lr=left.getBoundingClientRect(),dr=d.getBoundingClientRect();
const dotC=dr.top+dr.height/2-lr.top;           // dot centre relative to left block
const formH=right.getBoundingClientRect().height;
const topOfForm=dotC-pk.getBoundingClientRect().height/2;
const total=Math.max(lr.height,topOfForm+formH);
const T=112+(716-total)/2-8;
left.style.top=T+'px'; right.style.top=(T+topOfForm)+'px';
const r=d.getBoundingClientRect(),p=pk.getBoundingClientRect();
const s=document.getElementById('slot');
s.style.left=(r.right+20)+'px';s.style.width=(p.left-(r.right+20))+'px';s.style.top=(r.top+r.height/2-0.5)+'px';
});
</script></body></html>

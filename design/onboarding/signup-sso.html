<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back to CurrencyDesk</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F1EA;color:#17140F;font:15px/1.5 "Schibsted Grotesk",system-ui,sans-serif}p{max-width:320px;text-align:center;padding:0 16px}</style>
</head><body>
<p role="status">Taking you back to CurrencyDesk&hellip;</p>
<script>
/* Google or Microsoft send the person here (SSO_REDIRECT_URI = <origin>/onboarding/sso)
   with ?code and ?state, or ?error and ?state. Nothing is checked here: the sign-up
   page posts code and state to POST /api/onboarding/:id/sso/callback, which checks the
   state, the token and the email.
   In a popup: hand them to the page that opened it (same origin only) and close. A
   provider page with Cross-Origin-Opener-Policy cuts the popup off from its opener, so
   then the sign-up tab that started this round trip answers on a same-origin
   BroadcastChannel. On a phone, where the page itself went to the provider, nobody
   answers, so go back to the sign-up page with them. */
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get("code") || "", state = q.get("state") || "";
  var error = /^[a-z_]{1,40}$/.test(q.get("error") || "") ? q.get("error") : (code ? "" : "no_code");
  var msg = { type: "cd-sso", code: code, state: state, error: error };
  var back = function () {
    location.replace("/onboarding?sso=1&" + (code ? "code=" + encodeURIComponent(code) : "error=" + encodeURIComponent(error)) + "&state=" + encodeURIComponent(state));
  };
  var done = function () {
    window.close();
    document.querySelector("p").textContent = "You're signed in. Close this window to carry on.";
  };
  if (window.opener && window.opener !== window) {
    try { window.opener.postMessage(msg, location.origin); done(); return; } catch (e) { /* the opener went away; try the channel */ }
  }
  if (typeof BroadcastChannel !== "function" || !state) { back(); return; }
  var channel = new BroadcastChannel("cd-sso");
  var timer = setTimeout(function () { channel.close(); back(); }, 800);
  channel.onmessage = function (e) {
    if (!e.data || e.data.type !== "cd-sso-ack" || e.data.state !== state) return;
    clearTimeout(timer); channel.close(); done();
  };
  channel.postMessage(msg);
})();
</script>
</body></html>

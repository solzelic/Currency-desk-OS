# What the customer's browser actually loads.
#
# There used to be a workflow here that type-checked, unit-tested and built
# a Vite application production never builds and never serves. Every run was
# green and none of it touched the shipped code — which is how the Settings
# screen managed to be dead for days without anyone noticing.
#
# This guards the real thing: the buildless OS, the platform panel, and the
# pages compiled from the designs. Two jobs:
#
#   browser-validate — the cheap static gates: every script parses, the
#              committed generated output matches a fresh build of the sources,
#              and the built desk bundle names no sanctions list.
#   browser-seam — the full Playwright suite against the real server AND a
#              real PostgreSQL. Without a database the ledger routes never
#              register, 13 of 17 specs skip themselves, and the deployment
#              gate goes green having proved nothing — that is how every
#              serious cash defect here survived CI. The ephemeral service
#              below is the fix, and scripts/check-seam-ran.mjs fails the job
#              if a spec file silently skips anyway.
name: Browser

on: [pull_request]

jobs:
  browser-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cheapest gate there is, and it catches a whole class on its own: a
      # file the browser cannot parse is not a degraded page, it is a
      # missing one.
      - name: Every browser script parses
        run: npm run check:parse

      - name: Phone formatters and dark shell contrast
        run: npm run test:phone-format

      # Every 1280 picture is exact. 13 pixels, or a channel delta
      # of 13, fails here, and so does any other gap.
      - name: Desktop pictures are exact
        run: node --test tests/desktop-pixels.test.mjs tests/desktop-fonts.test.mjs

      # The served pages are generated from the designs and committed. If a
      # re-export landed without a rebuild, what we ship is not the design
      # that was approved — so say so here rather than letting it reach a
      # customer. web/app is the OS and the panel, compiled ahead of time so
      # a customer's browser does not have to.
      - name: Built pages are current with the designs and the sources
        run: |
          npm run build:onboarding
          npm run build:site
          npm run build:os
          npm run check:sanctions
          git diff --exit-code -- web/ || {
            echo "::error::web/ is stale. Run 'npm run build' and commit the result."
            exit 1
          }

  browser-seam:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: currencydesk_seam }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Install the server
        run: npm ci
        working-directory: server

      - name: Install Chromium
        # `install --with-deps` still installs Playwright Chromium plus Ubuntu
        # system libs. It also runs `apt-get update` against every source on
        # the runner. ubuntu-latest ships Google's Chrome repo; that CDN has
        # been serving Packages.gz that disagrees with InRelease (same hash
        # mismatch across retries). Playwright does not use that repo — the
        # browser comes from cdn.playwright.dev and the libs from Ubuntu —
        # so drop the unused source, then keep the supported install path.
        run: |
          for f in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -e "$f" ] || continue
            if grep -qiE 'dl\.google\.com' "$f"; then
              echo "Removing unused apt source $f"
              sudo rm -f "$f"
            fi
          done
          sudo rm -f /var/lib/apt/lists/*google* /var/lib/apt/lists/*chrome* || true
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium install attempt ${attempt}/3 failed"
            if [ "$attempt" -lt 3 ]; then
              sudo apt-get clean
              sleep 15
            fi
          done
          echo "::error::Chromium install failed after 3 attempts"
          exit 1

      # The 1280 pictures have to be a render of the main commit named in
      # tests/e2e/README.md, taken in this job (this runner, this Chromium,
      # this Postgres). The script checks that commit out, renders it
      # twice, and refuses the pictures when the two renders differ.
      # The suite below compares this branch to that render.
      - name: Render the desktop from the pinned main commit
        id: main_desktop
        env:
          SEAM_DATABASE_URL: postgres://postgres:postgres@localhost:5432/currencydesk_seam
        run: node scripts/capture-main-desktop-baselines.mjs --out desktop-main-render

      # One customer from the public site to a working desk, then every
      # browser↔ledger seam, then the day-long shift that is the deployment
      # gate. The database exists only for this run; the server provisions
      # it at boot (DDL + checksummed migrations), exactly as a fresh
      # deployment would. The suite deliberately leaves ledger state behind
      # — that is why the database is disposable.
      - name: Walk the seams against a real book
        id: seams
        env:
          SEAM_DATABASE_URL: postgres://postgres:postgres@localhost:5432/currencydesk_seam
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/seam-report.json
          DESKTOP_BASELINE_DIR: desktop-main-render
          # This job opens one desk per country from one address, and a
          # retry counts again. Production leaves SIGNUP_IP_MAX unset.
          SIGNUP_IP_MAX: "16"
        run: npx playwright test --reporter=list,html,json

      # Green must mean "ran", not "skipped". A spec file that executed zero
      # tests is the missing-database signature this job exists to prevent.
      - name: No seam spec silently skipped
        if: ${{ steps.seams.outcome == 'success' || steps.seams.outcome == 'failure' }}
        run: node scripts/check-seam-ran.mjs test-results/seam-report.json

      - name: Committed desktop pictures match that main render
        id: committed_desktop
        if: ${{ steps.main_desktop.outcome == 'success' }}
        run: node scripts/capture-main-desktop-baselines.mjs --compare-committed desktop-main-render

      # A 1px shift and a colour change on the ledger have to fail the
      # picture. The step restores the stylesheet either way.
      - name: Ledger breaks still fail the desktop picture
        if: ${{ steps.seams.outcome == 'success' && steps.committed_desktop.outcome == 'success' }}
        env:
          SEAM_DATABASE_URL: postgres://postgres:postgres@localhost:5432/currencydesk_seam
          DESKTOP_BASELINE_DIR: desktop-main-render
        run: node scripts/prove-desktop-baseline-breaks.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # The fresh render of the pinned main commit. Commit these PNGs.
      # Do not commit a render of the pull request, and do not replace
      # them from a laptop.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-unchanged-baselines
          path: |
            desktop-main-render/
            test-results/desktop-pixel-report.json
            test-results/desktop-break-proof.json
          retention-days: 14
          if-no-files-found: ignore

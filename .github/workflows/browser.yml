# What the customer's browser actually loads.
#
# There used to be a workflow here that type-checked, unit-tested and built
# a Vite application production never builds and never serves. Every run was
# green and none of it touched the shipped code — which is how the Settings
# screen managed to be dead for days without anyone noticing.
#
# This guards the real thing: the buildless OS, the platform panel, and the
# pages compiled from the designs.
name: Browser

on: [pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cheapest gate there is, and it catches a whole class on its own: a
      # file the browser cannot parse is not a degraded page, it is a
      # missing one.
      - name: Every browser script parses
        run: npm run check:parse

      # The served pages are generated from the designs and committed. If a
      # re-export landed without a rebuild, what we ship is not the design
      # that was approved — so say so here rather than letting it reach a
      # customer.
      # web/app is the OS and the panel, compiled ahead of time so a
      # customer's browser does not have to. If it is stale, what ships is
      # not what the sources say.
      - name: Built pages are current with the designs and the sources
        run: |
          npm run build:onboarding
          npm run build:site
          npm run build:os
          git diff --exit-code -- web/ || {
            echo "::error::web/ is stale. Run 'npm run build' and commit the result."
            exit 1
          }

      - name: Install the server
        run: npm ci
        working-directory: server

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # One customer, from the public site to a working desk. Every bug this
      # exists for lived at a handover between two pieces that each had
      # tests of their own.
      - name: Walk the customer journey
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

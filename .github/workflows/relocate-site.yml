name: Put the site files at the repository root

on: push

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move currencydesklive/ up one level, then remove this workflow
        run: |
          set -e
          if [ ! -d currencydesklive ]; then
            echo "Nothing to move - already done."
            exit 0
          fi
          cp -a currencydesklive/. .
          rm -rf currencydesklive
          rm -f .github/workflows/relocate-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Put the site files at the repository root"
          git push

# Documentation freshness, enforced at the change-set level.
#
# A PR that changes application code must either update
# docs/PROJECT_STATE.md or carry the checked "PROJECT_STATE reviewed —
# no change required" box from the PR template; a PR that changes
# architecture-sensitive surfaces must do the same for the
# architecture/repository docs. The check itself lives in
# scripts/check-repository-governance.mjs so it can also run locally.
# CI calls scripts/run-governance-check.mjs. That runs the diff on
# pull_request and passes on push.
name: Governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance-docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Prove a push exits 0 before the real diff. The push has no base ref.
      - name: Push event passes
        run: node --test tests/governance-push.test.mjs
      # PR body and base ref go through env, never string interpolation into
      # the shell. The body is author-controlled text. The diff runs on
      # pull_request only. A push has no base ref and no review body.
      - name: Living documentation was reviewed or updated
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/run-governance-check.mjs

name: Server
on: [pull_request]
jobs:
  server-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: currencydesk_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 5
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/currencydesk_test npm test
      # The full suite above already exercises these files and leaves real
      # ledger history behind. Re-running the focused gate against that same
      # book tests fixed fixture IDs, not a fresh deployment. Keep the extra
      # release gate, but give it the independent database its invariants
      # require.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE currencydesk_ledger_test'
      - run: TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/currencydesk_ledger_test npm run test:ledger:postgres
      # Compiled boot (`npm run build`, then node dist/index.js). The live
      # dashboard does not use this until its build and start commands
      # change together. The database is fresh. The step fails while
      # dist/ is absent.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE currencydesk_dist_boot'
      - name: Compiled server answers /api/health
        run: npm run build && TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/currencydesk_dist_boot node scripts/check-dist-boot.mjs
      # The live Render dashboard still installs with `npm ci` under
      # NODE_ENV=production (no tsc, no dist/) and starts with `npm start`.
      # That path has to keep booting. The copy is a fresh install so the
      # workspace node_modules, which includes devDependencies, is not
      # what this step proves.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE currencydesk_npm_start'
      - name: Dashboard npm start still answers /api/health
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          dash="$(mktemp -d)"
          tar -C server -cf - --exclude node_modules --exclude dist --exclude .pgdata . | tar -C "$dash" -xf -
          cd "$dash"
          NODE_ENV=production npm ci
          test ! -e dist/index.js
          test -x node_modules/.bin/tsx
          TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/currencydesk_npm_start node scripts/check-npm-start-boot.mjs

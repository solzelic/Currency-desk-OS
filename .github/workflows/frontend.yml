name: Frontend

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      # The served onboarding page is generated from the design bundle and
      # committed. If a re-export landed without a rebuild, the page we ship
      # is not the design that was approved — so say so here rather than
      # letting it reach a customer.
      - name: Onboarding page is current with the design
        run: |
          git diff --exit-code -- web/onboarding.html || {
            echo "::error::web/onboarding.html is stale. Run 'npm run build:onboarding' and commit the result."
            exit 1
          }

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CurrencyDesk — Control</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0a0a0b; --panel:#141416; --card:#161618; --sidebar:#0c0c0d; --hover:rgba(255,255,255,0.045);
    --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.055);
    --text:#ececee; --mute:#8b8b93; --faint:#5c5c64;
    --green:#34d399; --amber:#f5b544; --red:#f87171; --purple:#a78bfa; --blue:#60a5fa; --accent:#f5c542;
    --f:'Archivo',system-ui,sans-serif; --m:'Space Mono',monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:var(--f); color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.09); border-radius:8px; border:2px solid var(--bg); }
  button { font-family:inherit; }
  input, select { font-family:inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
const MONO = "var(--m)";

// ---- helpers ----
const api = async (path, opts) => {
  const r = await fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'content-type': 'application/json' } }, opts || {}));
  const body = await r.json().catch(() => null);
  if (!r.ok) throw { status: r.status, body };
  return body;
};
const initialsOf = (n) => (n || '?').split(/[ .@]+/).filter(Boolean).map(x => x[0]).join('').slice(0, 2).toUpperCase();
const hueOf = (s) => { let h = 0; for (let i = 0; i < (s || '').length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; };
const fmtDay = (s) => { try { return new Date(s).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return s; } };
const fmtWhen = (s) => { try { return new Date(s).toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }); } catch (e) { return s; } };
const PLAN_TONE = { trial: 'amber', basic: 'mute', pro: 'green', premium: 'purple' };
const STATUS_TONE = { active: 'green', trial: 'amber', suspended: 'red' };
const toneColor = (t) => ({ green: 'var(--green)', amber: 'var(--amber)', red: 'var(--red)', purple: 'var(--purple)', blue: 'var(--blue)', mute: 'var(--mute)' }[t] || 'var(--mute)');

function Mark({ w = 26 }) {
  const h = w * 0.7;
  return (<svg viewBox="0 0 200 140" width={w} height={h} style={{ display: 'block' }}>
    <mask id="cdm"><rect width="200" height="140" fill="#fff" /><rect x="60" y="64.5" width="92" height="11" fill="#000" /></mask>
    <g mask="url(#cdm)"><circle cx="60" cy="70" r="48" fill="#fff" /><path d="M116,22 H136 A48,48 0 0 1 136,118 H116 Z" fill="#fff" /></g>
    <circle cx="112" cy="70" r="6.5" fill="var(--green)" />
  </svg>);
}
function Avatar({ name, size = 26 }) {
  const hue = hueOf(name);
  return <span style={{ width: size, height: size, borderRadius: '50%', flex: 'none', display: 'grid', placeItems: 'center',
    fontSize: size * 0.4, fontWeight: 700, color: '#fff', background: 'hsl(' + hue + ',42%,42%)' }}>{initialsOf(name)}</span>;
}
function Pill({ tone, dot, children }) {
  const c = toneColor(tone);
  return (<span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11.5, fontWeight: 600, color: c,
    background: 'color-mix(in srgb,' + c + ' 15%, transparent)', border: '1px solid color-mix(in srgb,' + c + ' 30%, transparent)', borderRadius: 7, padding: '3px 9px', whiteSpace: 'nowrap', textTransform: 'capitalize' }}>
    {dot && <span style={{ width: 6, height: 6, borderRadius: '50%', background: c }} />}{children}</span>);
}
const dot = (c) => <span style={{ width: 8, height: 8, borderRadius: '50%', background: c, flex: 'none' }} />;

// ===================== LOGIN =====================
function Login({ onIn }) {
  const [step, setStep] = useState('pw');   // pw | code
  const [email, setEmail] = useState(''); const [pw, setPw] = useState(''); const [code, setCode] = useState('');
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false); const [masked, setMasked] = useState('');
  const submitPw = async (e) => {
    e.preventDefault(); setErr(''); setBusy(true);
    try {
      const d = await api('/api/auth/login/start', { method: 'POST', body: JSON.stringify({ staffId: email.trim().toLowerCase(), password: pw }) });
      if (d.needsCode) { setMasked(d.maskedEmail || ''); setStep('code'); setBusy(false); }
      else { await afterAuth(); }
    } catch (x) { setBusy(false); setErr(x.status === 401 ? 'Wrong email or password.' : x.status === 403 ? 'That desk is suspended.' : 'Sign-in error — try again.'); }
  };
  const submitCode = async (e) => {
    e.preventDefault(); setErr(''); setBusy(true);
    try { await api('/api/auth/login/verify', { method: 'POST', body: JSON.stringify({ staffId: email.trim().toLowerCase(), code: code.trim() }) }); await afterAuth(); }
    catch (x) { setBusy(false); setErr(x.status === 401 ? 'That code isn’t right.' : 'Verification error — try again.'); }
  };
  const afterAuth = async () => {
    try { const me = await api('/api/admin/me'); if (me.isAdmin) { onIn(); return; } setBusy(false); setErr('This account isn’t a platform admin.'); }
    catch (x) { setBusy(false); setErr('Signed in, but not authorized here.'); }
  };
  const inSty = { width: '100%', padding: '11px 13px', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 10, color: 'var(--text)', fontSize: 14, outline: 'none' };
  const btn = { width: '100%', padding: '11px', background: 'var(--text)', color: '#111', border: 'none', borderRadius: 10, fontWeight: 700, fontSize: 13.5, cursor: 'pointer', marginTop: 4 };
  return (<div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24 }}>
    <div style={{ width: 380, maxWidth: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, justifyContent: 'center', marginBottom: 22 }}>
        <Mark w={30} /><span style={{ fontWeight: 800, fontSize: 20 }}>CurrencyDesk</span>
        <span style={{ fontFamily: MONO, fontSize: 9, letterSpacing: '0.16em', color: 'var(--faint)', border: '1px solid var(--line)', borderRadius: 6, padding: '3px 7px' }}>CONTROL</span>
      </div>
      <div style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 16, padding: '26px 26px' }}>
        <h1 style={{ fontSize: 18, fontWeight: 800, margin: '0 0 4px' }}>{step === 'pw' ? 'Sign in' : 'Check your email'}</h1>
        <p style={{ fontSize: 13, color: 'var(--mute)', margin: '0 0 18px' }}>{step === 'pw' ? 'Platform admin access only.' : 'We sent a 6-digit code to ' + masked + '.'}</p>
        {step === 'pw' ? (
          <form onSubmit={submitPw} style={{ display: 'grid', gap: 11 }}>
            <input style={inSty} type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@currencydeskos.com" autoFocus autoComplete="username" />
            <input style={inSty} type="password" value={pw} onChange={e => setPw(e.target.value)} placeholder="Password" autoComplete="current-password" />
            {err && <div style={{ color: 'var(--red)', fontSize: 12.5 }}>{err}</div>}
            <button style={{ ...btn, opacity: busy ? 0.6 : 1 }} disabled={busy}>{busy ? 'Checking…' : 'Continue'}</button>
          </form>
        ) : (
          <form onSubmit={submitCode} style={{ display: 'grid', gap: 11 }}>
            <input style={{ ...inSty, textAlign: 'center', fontFamily: MONO, fontSize: 20, letterSpacing: '0.3em' }} value={code} onChange={e => setCode(e.target.value.replace(/[^0-9]/g, '').slice(0, 6))} placeholder="000000" inputMode="numeric" autoFocus />
            {err && <div style={{ color: 'var(--red)', fontSize: 12.5 }}>{err}</div>}
            <button style={{ ...btn, opacity: busy ? 0.6 : 1 }} disabled={busy}>{busy ? 'Verifying…' : 'Verify & enter'}</button>
            <button type="button" onClick={() => { setStep('pw'); setCode(''); setErr(''); }} style={{ background: 'none', border: 'none', color: 'var(--mute)', fontSize: 12.5, cursor: 'pointer' }}>← Back</button>
          </form>
        )}
      </div>
    </div>
  </div>);
}

// ===================== SIDEBAR =====================
function Cog({ s = 15 }) {
  return (<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flex: 'none' }}>
    <circle cx="12" cy="12" r="3" />
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
  </svg>);
}

/* The nav is the PAGES table and nothing else. Counts are the numbers that
   should make you click — things sitting on somebody — not totals for
   their own sake, so a page with nothing waiting shows no badge at all.

   The desk filters used to live down here, which meant Billing and
   Settings both had a "Status: Active / Trial / Suspended" list attached
   to them that did nothing. Filters belong to the list they filter. */
function Sidebar({ counts, tab, health, onSettings }) {
  const navItem = (p) => {
    const n = p.count ? counts[p.count] : null;
    const on = tab === p.id;
    return (<button key={p.id} onClick={() => goto('#/' + p.id)} title={p.blurb}
      style={{ display: 'flex', alignItems: 'center', gap: 11, width: '100%', textAlign: 'left', padding: '9px 11px', borderRadius: 9,
        border: 'none', cursor: 'pointer', background: on ? 'var(--hover)' : 'transparent', color: on ? 'var(--text)' : 'var(--mute)', fontSize: 14, fontWeight: on ? 600 : 500 }}>
      <span style={{ flex: 1 }}>{p.label}</span>
      {/* Amber means somebody is waiting on you. A total — how many desks
          exist — is just a number, and dressing it as an alert is how a
          panel teaches you to stop reading its alerts. */}
      {n ? (p.quiet
        ? <span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)' }}>{n}</span>
        : <span style={{ fontFamily: MONO, fontSize: 11, fontWeight: 700, color: '#111', background: 'var(--amber)', borderRadius: 20, padding: '1px 7px' }}>{n}</span>) : null}
    </button>);
  };
  const tone = health && health.state !== 'ok' ? (health.state === 'down' ? 'var(--red)' : 'var(--amber)') : 'var(--green)';
  return (<div style={{ width: 232, flex: 'none', background: 'var(--sidebar)', borderRight: '1px solid var(--line)', height: '100vh', overflow: 'auto', padding: '18px 12px', display: 'flex', flexDirection: 'column' }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '4px 8px 18px' }}>
      <span style={{ width: 34, height: 34, borderRadius: 9, background: '#1c1c20', display: 'grid', placeItems: 'center', flex: 'none' }}><Mark w={20} /></span>
      <span><span style={{ display: 'block', fontWeight: 700, fontSize: 14.5 }}>CurrencyDesk</span><span style={{ display: 'block', fontSize: 12, color: 'var(--mute)' }}>Platform control</span></span>
    </div>
    {PAGES.map(navItem)}
    <div style={{ flex: 1, minHeight: 20 }} />
    {/* Whether anything is broken, always in the corner of your eye, and
        one click from the page that says what. */}
    <button onClick={() => goto('#/overview')} style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', textAlign: 'left', padding: '8px 11px', borderRadius: 9, border: 'none', background: 'transparent', color: 'var(--mute)', fontSize: 12.5, cursor: 'pointer' }}>
      {dot(tone)}<span>{!health ? 'Checking…' : health.state === 'ok' ? 'All systems fine' : health.state === 'down' ? 'Something is down' : 'Needs a look'}</span>
    </button>
    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4, borderTop: '1px solid var(--line2)', paddingTop: 8 }}>
      <button onClick={onSettings} title="Platform settings"
        style={{ display: 'flex', alignItems: 'center', gap: 9, flex: 1, textAlign: 'left', padding: '8px 11px', borderRadius: 9, border: 'none', cursor: 'pointer',
          background: tab === 'settings' ? 'var(--hover)' : 'transparent', color: tab === 'settings' ? 'var(--text)' : 'var(--mute)', fontSize: 13 }}>
        <Cog /> Settings
      </button>
      <a href="/" title="Back to the OS" style={{ padding: '8px 10px', color: 'var(--faint)', fontSize: 12.5, textDecoration: 'none' }}>↩</a>
    </div>
  </div>);
}

// ===================== STAT ROW =====================
function StatRow({ ov }) {
  if (!ov) return null;
  const tiles = [
    { k: 'Desks', v: ov.totals.desks, c: 'var(--text)' },
    { k: 'Active', v: ov.byStatus.active, c: 'var(--green)' },
    { k: 'On trial', v: ov.byStatus.trial, c: 'var(--amber)' },
    { k: 'Suspended', v: ov.byStatus.suspended, c: 'var(--red)' },
    { k: 'New · 7 days', v: ov.totals.recent7, c: 'var(--blue)' },
    { k: 'People', v: ov.totals.people, c: 'var(--purple)' },
  ];
  return (<div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(120px,1fr))', gap: 10, marginBottom: 18 }}>
    {tiles.map(t => (<div key={t.k} style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 12, padding: '13px 15px' }}>
      <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: '0.08em', color: 'var(--mute)', textTransform: 'uppercase', marginBottom: 5 }}>{t.k}</div>
      <div style={{ fontSize: 25, fontWeight: 800, color: t.c, lineHeight: 1 }}>{t.v}</div>
    </div>))}
  </div>);
}

// ===================== OVERVIEW =====================
/* The page you open first, and the page you open when somebody says "it's
   not working".

   Ordered by what it is for: what is sitting on you, then whether anything
   is broken, then how the business is doing. Numbers last on purpose — a
   dashboard that leads with a revenue tile is a dashboard nobody opens on
   a Tuesday, because there is nothing to DO with it. */
const HEALTH_TONE = { ok: 'green', warn: 'amber', down: 'red', off: 'mute' };
const HEALTH_WORD = { ok: 'Fine', warn: 'Look', down: 'Down', off: 'Not set up' };

function OverviewPage({ ov, health, counts }) {
  const f = (ov && ov.funnel) || {};
  const [bill, setBill] = useState(null);
  useEffect(() => { api('/api/admin/billing').then(setBill).catch(() => setBill(null)); }, []);

  /* Only things a person can act on, and only when there are any. An
     empty "needs you" list is the good outcome and should look like it,
     not like a card that failed to load. */
  const todo = [];
  if (f.waiting) todo.push({ what: `${f.waiting} application${f.waiting === 1 ? '' : 's'} in review`, go: '#/applications', cta: 'Work the queue' });
  if (f.unread) todo.push({ what: `${f.unread} unanswered message${f.unread === 1 ? '' : 's'}`, go: '#/inbox', cta: 'Read them' });
  if (bill && bill.failedCount) todo.push({ what: `${bill.failedCount} failed payment${bill.failedCount === 1 ? '' : 's'}`, go: '#/billing', cta: 'Chase them' });
  for (const c of (health ? health.checks : [])) {
    if (c.state === 'down') todo.push({ what: c.detail, go: c.href || '#/overview', cta: 'Fix' });
  }

  return (<div style={{ display: 'grid', gap: 16 }}>
    <div style={{ background: todo.length ? 'var(--card)' : 'transparent', border: '1px solid ' + (todo.length ? 'var(--line)' : 'var(--line2)'), borderRadius: 14, padding: todo.length ? 6 : 18 }}>
      {todo.length === 0 && <div style={{ color: 'var(--mute)', fontSize: 13.5 }}>Nothing is waiting on you. Applications are answered, messages are read, and every check is green.</div>}
      {todo.map((t, i) => (<div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 12px', borderTop: i ? '1px solid var(--line2)' : 'none' }}>
        <span style={{ flex: 1, fontSize: 13.5 }}>{t.what}</span>
        <button onClick={() => goto(t.go)} style={{ padding: '6px 12px', borderRadius: 8, border: '1px solid var(--line)', background: 'transparent', color: 'var(--text)', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>{t.cta}</button>
      </div>))}
    </div>

    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.3fr) minmax(280px,1fr)', gap: 16, alignItems: 'start' }}>
      <Card title="Is anything broken">
        {!health && <div style={{ color: 'var(--mute)', fontFamily: MONO, fontSize: 12 }}>Checking…</div>}
        {health && health.checks.map(c => (<div key={c.id} style={{ display: 'flex', gap: 12, alignItems: 'flex-start', padding: '10px 0', borderBottom: '1px solid var(--line2)' }}>
          <span style={{ width: 92, flex: 'none' }}><Pill tone={HEALTH_TONE[c.state]} dot>{HEALTH_WORD[c.state]}</Pill></span>
          <span style={{ flex: 1, minWidth: 0 }}>
            <span style={{ display: 'block', fontWeight: 600, fontSize: 13 }}>{c.title}</span>
            <span style={{ display: 'block', fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.5, marginTop: 2 }}>{c.detail}</span>
            {c.fix && <span style={{ display: 'block', fontSize: 12, color: 'var(--faint)', marginTop: 3 }}>{c.fix}</span>}
          </span>
          {c.href && c.state !== 'ok' && <button onClick={() => goto(c.href)} style={{ padding: '4px 9px', borderRadius: 7, border: '1px solid var(--line)', background: 'transparent', color: 'var(--mute)', fontSize: 11.5, cursor: 'pointer', flex: 'none' }}>Open</button>}
        </div>))}
      </Card>

      <div style={{ display: 'grid', gap: 16 }}>
        <Card title="The business">
          {kv('Desks', counts.desks)}
          {kv('Paying', counts.active)}
          {kv('On trial', counts.trial)}
          {kv('Suspended', counts.suspended || '0')}
          {kv('MRR', bill ? (bill.connected ? '$' + K((bill.mrrCents || 0) / 100) : 'Stripe not connected') : '…')}
        </Card>
        <Card title="The funnel">
          {kv('Applications', f.applications)}
          {kv('In review', f.byStatus ? f.byStatus.reviewing : null)}
          {kv('On hold', f.byStatus ? f.byStatus.hold : null)}
          {kv('Invited', f.byStatus ? f.byStatus.invited : null)}
          {kv('Open desks', f.byStatus ? f.byStatus.accepted : null)}
        </Card>
      </div>
    </div>
  </div>);
}

// ===================== EMAILS =====================
/* What CurrencyDesk says to people, and whether it is actually saying it.

   This page exists because the emails were written, worked, and were
   invisible: no way to see what goes out, what fires it, or that sending
   had quietly fallen back to writing to a log file. That last one is the
   dangerous one at forty invitations. */
function CommsPage() {
  const [d, setD] = useState(null);
  const [open, setOpen] = useState(null);
  useEffect(() => { api('/api/admin/comms').then(setD).catch(() => setD({ error: true })); }, []);
  if (!d) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;
  if (d.error) return <div style={{ padding: 20, color: 'var(--red)' }}>Could not load this.</div>;

  const AUD = { applicant: 'Applicant', operator: 'Desk owner', staff: 'Their staff', platform: 'Us' };
  return (<div style={{ display: 'grid', gap: 16 }}>
    <div style={{ padding: '13px 16px', borderRadius: 12, fontSize: 13, lineHeight: 1.6,
      background: 'color-mix(in srgb,' + toneColor(d.delivery.live ? 'green' : 'amber') + ' 12%,transparent)',
      border: '1px solid color-mix(in srgb,' + toneColor(d.delivery.live ? 'green' : 'amber') + ' 30%,transparent)' }}>
      <b>{d.delivery.live ? 'Sending' : 'Not sending'}</b> — {d.delivery.detail}
      {d.delivery.fix && <div style={{ color: 'var(--mute)', marginTop: 4 }}>{d.delivery.fix}</div>}
    </div>

    <Card title="What goes out" pad={0}>
      {d.dispatches.map(x => (<div key={x.id} style={{ borderBottom: '1px solid var(--line2)' }}>
        <button onClick={() => setOpen(open === x.id ? null : x.id)} style={{ display: 'flex', gap: 12, alignItems: 'center', width: '100%', textAlign: 'left', padding: '13px 16px', background: 'none', border: 'none', color: 'var(--text)', cursor: 'pointer' }}>
          <span style={{ flex: 1, minWidth: 0 }}>
            <span style={{ display: 'block', fontWeight: 700, fontSize: 13.5 }}>{x.title}</span>
            <span style={{ display: 'block', fontSize: 12.5, color: 'var(--mute)', marginTop: 2 }}>{x.when}</span>
          </span>
          <Pill tone="blue">{AUD[x.audience]}</Pill>
          <Pill tone={x.automatic ? 'purple' : 'mute'}>{x.automatic ? 'automatic' : 'you send it'}</Pill>
          <span style={{ color: 'var(--faint)', fontSize: 11 }}>{open === x.id ? '▲' : '▼'}</span>
        </button>
        {open === x.id && (<div style={{ padding: '0 16px 16px' }}>
          <div style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)', marginBottom: 6 }}>SUBJECT</div>
          <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 12 }}>{x.sample.subject}</div>
          <div style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)', marginBottom: 6 }}>BODY (sample)</div>
          <pre style={{ whiteSpace: 'pre-wrap', fontFamily: MONO, fontSize: 12, lineHeight: 1.6, color: 'var(--mute)', margin: 0, background: 'var(--sidebar)', padding: 13, borderRadius: 10 }}>{x.sample.text}</pre>
        </div>)}
      </div>))}
    </Card>

    {/* Silence is a decision here, so it is written down rather than left
        to somebody wondering whether a send failed. */}
    <Card title="Where we say nothing, on purpose">
      {d.silent.map(s => (<div key={s.stage} style={{ display: 'flex', gap: 12, padding: '9px 0', borderBottom: '1px solid var(--line2)', fontSize: 13 }}>
        <span style={{ width: 90, flex: 'none', textTransform: 'capitalize', fontWeight: 600 }}>{s.stage}</span>
        <span style={{ color: 'var(--mute)', lineHeight: 1.55 }}>{s.why}</span>
      </div>))}
    </Card>
  </div>);
}

// ===================== START A DESK =====================
/* Adding a desk does not create a desk. It sends somebody the link to set
   one up. We fill in the handful of things we already know — the same ones
   the early-access form asks — and everything else is theirs to answer on
   their own screens. The desk exists at the end of that, not the start of
   this. */
function CreateModal({ onClose, onCreated }) {
  const [f, setF] = useState({ businessName: '', ownerName: '', ownerEmail: '', slug: '', country: 'CA', website: '' });
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null); const [copied, setCopied] = useState(false);
  const set = (k, v) => setF(s => Object.assign({}, s, { [k]: k === 'slug' ? v.toLowerCase().replace(/[^a-z0-9-]/g, '') : v }));
  // Escape closes it. Clicking the backdrop already did, and a dialog where
  // one of the two ways out works is a dialog people feel stuck in.
  useEffect(() => {
    const on = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', on);
    return () => window.removeEventListener('keydown', on);
  }, []);
  const submit = async (e) => {
    e.preventDefault(); setBusy(true); setErr('');
    try { const r = await api('/api/admin/onboarding/invite', { method: 'POST', body: JSON.stringify(f) }); setBusy(false); setDone(r); onCreated(); }
    catch (x) { setBusy(false); setErr((x.body && x.body.detail) || 'Could not send that invitation'); }
  };
  const copy = () => { try { navigator.clipboard.writeText(done.link); } catch (e) {} setCopied(true); setTimeout(() => setCopied(false), 1600); };
  const inSty = { width: '100%', padding: '10px 12px', background: 'var(--bg)', border: '1px solid var(--line)', borderRadius: 9, color: 'var(--text)', fontSize: 13.5, outline: 'none' };
  const lbl = { fontSize: 11.5, color: 'var(--mute)', marginBottom: 5, display: 'block' };
  return (<div style={{ position: 'fixed', inset: 0, zIndex: 60, display: 'grid', placeItems: 'center', padding: 20, background: 'rgba(0,0,0,0.55)' }} onClick={onClose}>
    <form onClick={e => e.stopPropagation()} onSubmit={submit} style={{ width: 440, maxWidth: '100%', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 16, padding: '22px 24px', display: 'grid', gap: 12 }}>
      {done ? (<>
        <div style={{ fontSize: 17, fontWeight: 800 }}>{done.resent ? 'They already had one' : 'Their setup link is ready'}</div>
        <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.5 }}>
          {done.resent
            ? done.detail
            : (done.invite === 'sent'
                ? 'Emailed to ' + f.ownerEmail + '. They open it, answer the questions, and the desk opens at the end.'
                : 'No mail provider is configured, so nothing was sent — pass this link on yourself.')}
        </div>
        <div><span style={lbl}>Reference</span>
          <div style={{ ...inSty, fontFamily: MONO, letterSpacing: '0.1em', fontWeight: 700 }}>{done.reference}</div></div>
        <div><span style={lbl}>Link</span>
          <div style={{ ...inSty, fontFamily: MONO, fontSize: 12, wordBreak: 'break-all', lineHeight: 1.5 }}>{done.link}</div></div>
        <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
          <button type="button" onClick={copy} style={{ flex: 1, padding: '10px', borderRadius: 9, border: '1px solid var(--line)', background: 'transparent', color: 'var(--text)', cursor: 'pointer', fontWeight: 600 }}>{copied ? 'Copied' : 'Copy link'}</button>
          <button type="button" onClick={onClose} style={{ flex: 1, padding: '10px', borderRadius: 9, border: 'none', background: 'var(--text)', color: '#111', cursor: 'pointer', fontWeight: 700 }}>Done</button>
        </div>
      </>) : (<>
      <div style={{ fontSize: 17, fontWeight: 800 }}>Start a desk</div>
      <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.5 }}>
        This sends them a link to set their desk up. Fill in what you already know —
        they answer the rest themselves, and the desk opens when they finish.
      </div>
      <div><span style={lbl}>Business name</span><input style={inSty} value={f.businessName} onChange={e => set('businessName', e.target.value)} placeholder="Maple Currency Exchange" autoFocus /></div>
      <div style={{ display: 'flex', gap: 10 }}>
        <div style={{ flex: 1 }}><span style={lbl}>Owner name</span><input style={inSty} value={f.ownerName} onChange={e => set('ownerName', e.target.value)} placeholder="Dana Kim" required /></div>
        <div style={{ flex: 1 }}><span style={lbl}>Desk address</span><input style={{ ...inSty, fontFamily: MONO }} value={f.slug} onChange={e => set('slug', e.target.value)} placeholder="maplefx" /></div>
      </div>
      <div><span style={lbl}>Owner email</span><input style={inSty} type="email" value={f.ownerEmail} onChange={e => set('ownerEmail', e.target.value)} placeholder="owner@business.com" required /></div>
      <div style={{ display: 'flex', gap: 10 }}>
        <div style={{ flex: 1 }}><span style={lbl}>Licensed in</span><select style={inSty} value={f.country} onChange={e => set('country', e.target.value)}>
          <option value="CA">Canada</option><option value="US">United States</option><option value="GB">United Kingdom</option>
          <option value="AU">Australia</option><option value="AE">United Arab Emirates</option><option value="EU">European Union</option>
          <option value="XX">Somewhere else</option></select></div>
        <div style={{ flex: 1 }}><span style={lbl}>Website (optional)</span><input style={inSty} value={f.website} onChange={e => set('website', e.target.value)} placeholder="maplefx.ca" /></div>
      </div>
      <div style={{ fontSize: 11.5, color: 'var(--faint)' }}>No password here — they set their own on their own screen.</div>
      {err && <div style={{ color: 'var(--red)', fontSize: 12.5 }}>{err}</div>}
      <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
        <button type="button" onClick={onClose} style={{ flex: 1, padding: '10px', borderRadius: 9, border: '1px solid var(--line)', background: 'transparent', color: 'var(--mute)', cursor: 'pointer', fontWeight: 600 }}>Cancel</button>
        <button style={{ flex: 2, padding: '10px', borderRadius: 9, border: 'none', background: 'var(--text)', color: '#111', cursor: 'pointer', fontWeight: 700, opacity: busy ? 0.6 : 1 }} disabled={busy}>{busy ? 'Sending…' : 'Send their setup link'}</button>
      </div>
      </>)}
    </form>
  </div>);
}

// ===================== PIPELINE =====================
// Everything the public site sends us. An application is not a message in an
// inbox — it is a thing somebody works — so this reads as a pipeline: what
// stage each one is at, what the applicant told us, and what it became.
/* ============================================================
   THE PANEL, DECLARED IN ONE PLACE

   Every page, in the order somebody works them, with the one thing that
   page is for. This table is why the nav, the headings, the routes and
   the buttons cannot disagree with each other — they are all read from
   it.

   `action` is the point. There used to be a single "Start a desk" button
   pinned to the top of every screen, which is how you end up able to
   start a desk from the billing page. An action belongs to the page it
   makes sense on: you invite people from Applications, you bill people
   from Billing, and Activity is a record so it has no action at all.
   ============================================================ */
const PAGES = [
  { id: 'overview', label: 'Overview', title: 'Overview',
    blurb: 'What needs you, what the business is doing, and whether anything is broken.' },
  { id: 'applications', label: 'Applications', title: 'Applications', count: 'waiting',
    blurb: 'Everyone who asked for a desk, and where you have got to with them. Approving sends their code and setup link.',
    action: { label: 'Invite a desk', kind: 'invite' } },
  { id: 'desks', label: 'Desks', title: 'Desks', count: 'desks', quiet: true,
    blurb: 'The customers. Open one to see their storefront, their people and their plan.',
    action: { label: 'Invite a desk', kind: 'invite' } },
  { id: 'billing', label: 'Billing', title: 'Billing',
    blurb: 'Subscriptions, invoices and what has actually been collected.',
    action: { label: 'Send an invoice', kind: 'invoice' } },
  { id: 'inbox', label: 'Inbox', title: 'Inbox', count: 'unread',
    blurb: 'Notes from the contact page. Each one was promised a straight answer, usually the same day.' },
  { id: 'comms', label: 'Emails', title: 'Emails',
    blurb: 'Everything CurrencyDesk says to anybody — what goes out, what fires it, and whether it is really sending.' },
  { id: 'activity', label: 'Activity', title: 'Activity',
    blurb: 'Every change anybody made, in order. Six years of it, because that is what the rulebook asks for.' },
];
const PAGE = (id) => PAGES.find(p => p.id === id) || PAGES[0];
/* One answer off an application, whichever shape the row is in. */
const det = (e, k) => { const v = (e && e.details || {})[k]; return v == null || v === '' ? null : String(v); };
/* The number, spaced for reading. Stored E.164 so it can be dialled; a
   fifteen-digit run with no gaps is unreadable to the person dialling it. */
const tel = (e) => {
  const raw = det(e, 'phone');
  if (!raw) return null;
  const m = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(raw);
  return m ? `+1 ${m[1]} ${m[2]} ${m[3]}` : raw;
};
/* Settings is not in the list on purpose — it is the cogwheel at the
   bottom. You visit it when something needs configuring, not while you
   are working, and putting it in the run of daily pages made it look
   like one. */
const SETTINGS = { id: 'settings', title: 'Platform settings', blurb: 'Who runs CurrencyDesk, and how it is wired up.' };
const STAGE_TONE = { new: 'mute', reviewing: 'amber', hold: 'blue', invited: 'purple', accepted: 'green', declined: 'mute' };
/* Only a fallback, for the moment before the server's own list arrives. The
   real columns — their titles, the verb on each button, and which moves are
   legal from where — all come from the server, so the panel cannot drift
   from what a transition will actually accept. */
const STAGES = ['new', 'reviewing', 'hold', 'invited', 'accepted', 'declined'];
const stageTitle = (stages, id) => ((stages || []).find(s => s.id === id) || {}).title || id;
/* Each column, in more words than fit under its heading — what it means,
   what the applicant has been told, and what moving them out of it does.
   The one-liner under the title is the summary; this is the training. */
const STAGE_HELP = {
  new: 'Applications from before arrivals were acknowledged automatically. They have heard nothing from us. Nothing new lands here, and the column disappears once it is empty — so work these out and it goes.',
  reviewing: 'Where every application starts, the moment it arrives. They have already been emailed to say somebody is looking and that we will call. Nobody has to press anything to get them here.',
  hold: 'Worth keeping, not now. They are told nothing — this is a note to ourselves, not a decision they were given. You can approve straight from here without sending them back through review.',
  invited: 'Approved. Pressing Approve emailed them their reference and the link to set the desk up, and that link works for exactly as long as they sit in this column.',
  accepted: 'They finished setup and the desk exists. You cannot put an application here by hand — it arrives when they complete it, which is what keeps this board honest about the funnel.',
  declined: 'Not for us. Their code stops opening anything immediately. We send nothing automatically: a decline deserves a person writing to them.',
};
/* What each answer on the application is called here, and — where the name
   alone is not enough — what it means. The help text is the difference
   between a new starter guessing and a new starter knowing. */
const DETAIL_LABELS = {
  workspace: 'Workspace', website: 'Website', jurisdiction: 'Jurisdiction', role: 'Their role',
  employees: 'Team size', monthlyVolume: 'Monthly volume', branches: 'Locations',
  runningOn: 'Running on today', timeline: 'Wants to be live', topic: 'About', shop: 'Shop',
  city: 'City', message: 'Message', newsletter: 'Wants updates',
  phone: 'Mobile', bestTime: 'Best time to call', phoneUnparsed: 'Number as typed',
};
const DETAIL_HELP = {
  workspace: 'The web address they asked for. Their storefront will live at currencydeskos.com/sites/<this>, and it becomes the desk’s slug when they finish setup.',
  jurisdiction: 'Where they are licensed. It decides the regulator, the home currency and the reporting threshold their desk carries — so it is the one answer everything else follows from.',
  monthlyVolume: 'What they say they exchange in a month. Self-reported on the form, never verified — treat it as a sizing hint, not a fact.',
  runningOn: 'What they use today. “Spreadsheets & manual logs” usually means a quick, happy switch; “Legacy MSB software” usually means a data migration conversation.',
  timeline: 'How soon they want to be trading on it. Worth weighing against the queue — somebody who says “as soon as possible” and waits three weeks tends not to answer the phone.',
  branches: 'One shop or several. Multi-branch desks need a legal entity and branch set up per location, so they take longer to open.',
  phone: 'The number we ring after approving them. Collected on the application so nobody has to chase it — it is also the number they can sign in with later.',
  bestTime: 'When they said to call. Their local time, not yours.',
  phoneUnparsed: 'They typed something we could not read as a phone number, so it is kept exactly as written. Check it before dialling.',
};

/* ============================================================
   THE JOURNEY, ACROSS THE TOP

   Five columns of equal weight do not say what order anything happens
   in, and they especially do not say that two of them are places an
   application STOPS rather than passes through. So the path is drawn
   once, numbered, above the board: one, somebody looks at them. Two, we
   approve them. Three, they open a desk.

   The two ways out hang off the end, unnumbered, because they are exits
   and not steps. Somebody who has never seen this should be able to
   read the whole process off this one line.
   ============================================================ */
function Journey({ stages, counts }) {
  const path = (stages || []).filter(s => s.step).sort((a, b) => a.step - b.step);
  const exits = (stages || []).filter(s => s.exit);
  if (!path.length) return null;
  const pill = (s, n) => (
    <span key={s.id} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, flex: 'none' }}>
      <span style={{ width: 22, height: 22, borderRadius: '50%', display: 'grid', placeItems: 'center', flex: 'none',
        background: counts[s.id] ? 'var(--text)' : 'transparent', color: counts[s.id] ? '#111' : 'var(--faint)',
        border: '1px solid ' + (counts[s.id] ? 'var(--text)' : 'var(--line)'),
        fontFamily: MONO, fontSize: 11, fontWeight: 800 }}>{n}</span>
      <span style={{ fontSize: 13, fontWeight: 600 }}>{s.title}</span>
      <span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)' }}>{counts[s.id] || 0}</span>
    </span>
  );
  const arrow = (k) => (
    <span key={'a' + k} aria-hidden="true" style={{ flex: '1 1 20px', minWidth: 16, height: 1, background: 'var(--line)' }} />
  );
  return (<div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', marginBottom: 18,
    padding: '13px 16px', background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 13 }}>
    {path.map((s, k) => [k ? arrow(k) : null, pill(s, s.step)]).flat().filter(Boolean)}
    {exits.length > 0 && (<>
      <span aria-hidden="true" style={{ width: 1, height: 22, background: 'var(--line)', margin: '0 4px', flex: 'none' }} />
      <span style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: '0.12em', color: 'var(--faint)', textTransform: 'uppercase', flex: 'none' }}>Or out</span>
      {exits.map(s => (<span key={s.id} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, flex: 'none' }}>
        <span style={{ fontSize: 13, color: 'var(--mute)' }}>{s.title}</span>
        <span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)' }}>{counts[s.id] || 0}</span>
      </span>))}
    </>)}
  </div>);
}

/* ============================================================
   THE INBOX

   A note from the contact page was being rendered through the
   applications board, so a message asking "do you support EUR?" sat in a
   column called In review with buttons offering to Approve & invite it,
   and a column called Open waiting for it to become a desk. None of that
   is true of a message.

   A message is answered or it is not. That is the whole model, so this is
   a list with one action, and the page shows the thing that actually
   matters: what they wrote, and how to write back.
   ============================================================ */
function Inbox({ onChanged }) {
  const [rows, setRows] = useState(null);
  const [openId, setOpenId] = useState(null);
  const [thread, setThread] = useState(null);   // { enquiry, replies } for openId
  const [draft, setDraft] = useState('');
  const [sending, setSending] = useState(false);
  const [flash, setFlash] = useState('');
  const [show, setShow] = useState('open');     // open | all
  const boxRef = useRef(null);

  const load = async () => {
    const r = await api('/api/admin/enquiries?kind=contact').catch(() => ({ enquiries: [] }));
    setRows(r.enquiries);
    // the nav badge counts unanswered messages; it moved
    if (onChanged) onChanged();
  };
  useEffect(() => { load(); }, []);

  /* Opening a message loads its thread. Drafts are per-message and kept
     while you are in the panel — losing half a written reply because you
     clicked the wrong row is the kind of thing you only forgive once. */
  const drafts = useRef({});
  const openThread = async (m) => {
    if (openId === m.id) { setOpenId(null); setThread(null); return; }
    drafts.current[openId] = draft;
    setOpenId(m.id); setThread(null); setFlash('');
    setDraft(drafts.current[m.id] || '');
    try { setThread(await api('/api/admin/enquiries/' + m.id)); } catch (e) { setThread({ error: true }); }
  };

  const send = async () => {
    const body = draft.trim();
    if (!body || sending) return;
    setSending(true); setFlash('');
    try {
      const r = await api('/api/admin/enquiries/' + openId + '/reply', { method: 'POST', body: JSON.stringify({ body }) });
      drafts.current[openId] = '';
      setDraft('');
      setFlash(r.email === 'sent' ? 'Sent.'
        : r.email === 'simulated' ? 'Written to the log — email is not switched on yet, so this did not reach them.'
        : 'That did not send. Nothing reached them; try again.');
      setThread(await api('/api/admin/enquiries/' + openId));
      await load();
      setTimeout(() => { if (boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, 40);
    } catch (e) { setFlash((e.body && e.body.detail) || 'That did not send.'); }
    setSending(false);
  };

  if (!rows) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;
  const unanswered = rows.filter(m => !m.handledAt);
  /* The conversation you are IN stays on screen. Answering moves a message
     out of "needs a reply", and without this the thread you had just
     written in disappeared the instant you sent — which reads as having
     lost it. No messaging app has ever closed the window you were typing
     in because the message became read. */
  const shown = show === 'open' ? rows.filter(m => !m.handledAt || m.id === openId) : rows;
  const tab = (id, label, n) => (
    <button key={id} onClick={() => setShow(id)} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '7px 13px', borderRadius: 9, cursor: 'pointer', fontSize: 13,
      fontWeight: show === id ? 700 : 500, border: '1px solid ' + (show === id ? 'var(--text)' : 'var(--line)'),
      background: show === id ? 'var(--hover)' : 'var(--card)', color: show === id ? 'var(--text)' : 'var(--mute)' }}>
      {label}<span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)' }}>{n}</span></button>
  );

  /* One turn in the conversation. Theirs on the left in the panel colour,
     ours on the right in ours — the oldest convention in messaging, and
     the reason you can tell at a glance who said what. */
  const bubble = (who, body, meta, mine) => (
    <div style={{ display: 'flex', justifyContent: mine ? 'flex-end' : 'flex-start' }}>
      <div style={{ maxWidth: '78%' }}>
        <div style={{ padding: '11px 14px', borderRadius: 13, fontSize: 13.5, lineHeight: 1.6, whiteSpace: 'pre-wrap',
          background: mine ? 'var(--hover)' : 'var(--sidebar)', border: '1px solid var(--line2)',
          borderBottomRightRadius: mine ? 4 : 13, borderBottomLeftRadius: mine ? 13 : 4 }}>{body}</div>
        <div style={{ fontSize: 11, color: 'var(--faint)', marginTop: 4, textAlign: mine ? 'right' : 'left' }}>{who}{meta ? ' · ' + meta : ''}</div>
      </div>
    </div>
  );

  return (<div>
    <div style={{ display: 'flex', gap: 8, marginBottom: 16, alignItems: 'center' }}>
      {tab('open', 'Needs a reply', unanswered.length)}
      {tab('all', 'Everything', rows.length)}
    </div>

    {shown.length === 0 && (<div style={{ padding: 40, textAlign: 'center', color: 'var(--faint)', fontSize: 13.5,
      background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14 }}>
      {rows.length === 0 ? 'Nothing has come in yet.' : 'Every message has been answered.'}
    </div>)}

    <div style={{ display: 'grid', gap: 10 }}>
      {shown.map(m => {
        const answered = !!m.handledAt;
        const isOpen = openId === m.id;
        const d = m.details || {};
        return (<div key={m.id} style={{ background: 'var(--card)', border: '1px solid ' + (isOpen ? 'var(--text)' : answered ? 'var(--line2)' : 'var(--line)'), borderRadius: 13, overflow: 'hidden' }}>
          <button onClick={() => openThread(m)} style={{ display: 'flex', alignItems: 'center', gap: 12, width: '100%', textAlign: 'left', padding: '13px 15px', background: 'none', border: 'none', color: 'var(--text)', cursor: 'pointer' }}>
            {!answered && <span style={{ width: 7, height: 7, borderRadius: '50%', background: 'var(--amber)', flex: 'none' }} />}
            <Avatar name={m.name || m.email} size={30} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontWeight: answered ? 600 : 800, fontSize: 14 }}>{m.name || m.email}</span>
                {d.topic && <Pill tone="blue">{String(d.topic)}</Pill>}
                {m.replyCount > 0 && <Pill tone="green">{m.replyCount === 1 ? 'replied' : m.replyCount + ' replies'}</Pill>}
              </span>
              <span style={{ display: 'block', fontSize: 12.5, color: 'var(--mute)', marginTop: 3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {d.message ? String(d.message) : <span style={{ color: 'var(--faint)' }}>No message</span>}
              </span>
            </span>
            <span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)', flex: 'none' }}>{fmtDay(m.createdAt)}</span>
          </button>

          {isOpen && (<div style={{ borderTop: '1px solid var(--line2)' }}>
            {!thread && <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO, fontSize: 12 }}>Loading…</div>}
            {thread && thread.error && <div style={{ padding: 20, color: 'var(--red)' }}>Could not load this conversation.</div>}
            {thread && !thread.error && (<div>
              {/* who they are, once, above the conversation */}
              <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', padding: '11px 15px', background: 'var(--sidebar)', fontSize: 12, color: 'var(--mute)' }}>
                <a href={'mailto:' + m.email} style={{ color: 'var(--blue)' }}>{m.email}</a>
                {d.shop && <span>{String(d.shop)}</span>}
                {d.city && <span>{String(d.city)}</span>}
                <span style={{ fontFamily: MONO, color: 'var(--faint)' }}>{m.reference}</span>
                {(d.newsletter === true || d.newsletter === 'true') && <span style={{ color: 'var(--faint)' }}>wants updates</span>}
              </div>

              <div ref={boxRef} style={{ padding: 15, display: 'grid', gap: 12, maxHeight: 420, overflowY: 'auto' }}>
                {bubble(m.name || m.email, d.message ? String(d.message) : 'They sent no message.', fmtWhen(m.createdAt), false)}
                {(thread.replies || []).map(r => bubble('You', r.body,
                  fmtWhen(r.createdAt) + (r.emailStatus === 'sent' ? '' : r.emailStatus === 'simulated' ? ' · not actually sent' : ' · failed to send'), true))}
              </div>

              {/* The composer. Always here, never behind a button — the whole
                  reason you opened this is to write back. */}
              <div style={{ borderTop: '1px solid var(--line2)', padding: 13 }}>
                {flash && <div style={{ marginBottom: 10, fontSize: 12.5, color: 'var(--mute)' }}>{flash}</div>}
                <textarea value={draft} onChange={e => setDraft(e.target.value)}
                  onKeyDown={e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); } }}
                  rows={3} placeholder={'Write back to ' + (m.name ? String(m.name).split(' ')[0] : 'them') + '…'}
                  style={{ width: '100%', boxSizing: 'border-box', padding: 11, borderRadius: 10, border: '1px solid var(--line)', background: 'var(--sidebar)', color: 'var(--text)', fontSize: 13.5, lineHeight: 1.6, resize: 'vertical', outline: 'none', fontFamily: 'inherit' }} />
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 9 }}>
                  <button disabled={sending || !draft.trim()} onClick={send}
                    style={{ padding: '9px 17px', borderRadius: 9, border: 'none', fontWeight: 700, fontSize: 13,
                      background: draft.trim() ? 'var(--text)' : 'var(--line)', color: draft.trim() ? '#111' : 'var(--faint)',
                      cursor: sending || !draft.trim() ? 'default' : 'pointer' }}>
                    {sending ? 'Sending…' : 'Send reply'}</button>
                  <span style={{ fontSize: 11.5, color: 'var(--faint)' }}>⌘↵ to send</span>
                  <span style={{ flex: 1 }} />
                  {/* Honest about what this is: we can write to them, we
                      cannot receive here. Their answer goes to a real inbox. */}
                  <Info title="Where their answer goes">Sending emails them and marks this answered. When they write back it goes to the reply-to inbox — a person reads it there, it does not appear in this thread. Nothing here receives email yet.</Info>
                </div>
              </div>
            </div>)}
          </div>)}
        </div>);
      })}
    </div>
  </div>);
}

function Pipeline({ kind, onCounts }) {
  const [rows, setRows] = useState(null);
  const [stage, setStage] = useState('all');
  /* Board or list. The board is for working the queue; the list is for
     finding one person. Remembered, because an operator has a preference
     and being asked again every morning is its own small insult. */
  const [view, setView] = useState(() => { try { return localStorage.getItem('cdos_pipe_view') || 'board'; } catch (e) { return 'board'; } });
  const [stages, setStages] = useState(null);
  const [busy, setBusy] = useState(null);
  const [note, setNote] = useState('');
  /* What is in the hand, and which column it is over.

     Two copies of the same thing on purpose. A drop only happens if a column
     called preventDefault() on a PRECEDING dragover — that is the browser's
     rule, not ours — so the answer to "can I take this?" has to be available
     synchronously, on the very first dragover, before React has re-rendered
     with the new state. The ref is what dragover reads; the state is what
     the columns are drawn from. Reading state in dragover looks fine when
     you move slowly and silently drops the card when you flick. */
  const dragRef = useRef(null);
  const [drag, setDrag] = useState(null);
  const [over, setOver] = useState(null);
  const accepts = (id) => { const d = dragRef.current; return !!d && d.next.includes(id); };

  const load = async () => {
    const r = await api('/api/admin/enquiries?kind=' + kind).catch(() => ({ enquiries: [] }));
    setRows(r.enquiries);
    if (r.stages) setStages(r.stages);
    if (onCounts) onCounts(r.enquiries);
  };
  useEffect(() => { load(); }, [kind]);
  const pick = (v) => { setView(v); try { localStorage.setItem('cdos_pipe_view', v); } catch (e) {} };

  /* Moving a card is the same call the API makes from anywhere else, so the
     email that belongs to a stage follows without the board knowing which
     stages send anything. */
  const move = async (r, to) => {
    setBusy(r.id); setNote('');
    try {
      const res = await api('/api/admin/enquiries/' + r.id, { method: 'PATCH', body: JSON.stringify({ status: to }) });
      const sent = res.email;
      setNote((r.name || r.email) + ' → ' + stageTitle(stages, to) + (sent ? ' · email ' + sent : ''));
      await load();
    } catch (e) {
      setNote((e.body && e.body.detail) || 'Could not move that one.');
    }
    setBusy(null);
    setTimeout(() => setNote(''), 6000);
  };

  if (!rows) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;
  const BOARD = stages || STAGES.map(id => ({ id, title: id, blurb: '', next: [] }));

  const counts = BOARD.reduce((a, s) => (a[s.id] = rows.filter(r => r.status === s.id).length, a), {});
  /* A stage nothing lands in any more is not a column — it is clutter. It
     stays visible only while somebody is still sitting in it, so the eight
     applications that arrived before review was automatic can be worked out
     of it rather than silently disappearing from the board. */
  const columns = BOARD.filter(s => !s.legacy || counts[s.id] > 0);
  /* The three numbered stages are the path; the two exits are where an
     application stops. Drawn as two runs with a gap, so the eye reads the
     journey as a journey instead of five equal boxes. */
  const path = columns.filter(s => !s.exit);
  const exits = columns.filter(s => s.exit);
  const ordered = [...path, ...exits];

  /* OPEN KEEPS THE LAST FIVE.

     A desk that opens has left this board — it is a customer now, and it
     lives under Desks. But a column that is permanently empty teaches you
     to stop looking at it, and the most recent handful is the most
     encouraging thing on the page: proof the funnel came out the other
     end. So Open shows the five newest and says where the rest went. */
  const OPEN_KEEP = 5;
  const inColumn = (id) => {
    const all = rows.filter(r => r.status === id);
    if (id !== 'accepted') return all;
    return all.slice().sort((a, b) =>
      new Date(b.decidedAt || b.createdAt) - new Date(a.decidedAt || a.createdAt)).slice(0, OPEN_KEEP);
  };
  const shown = stage === 'all' ? rows : rows.filter(r => r.status === stage);
  const th = { textAlign: 'left', fontSize: 11, color: 'var(--faint)', textTransform: 'uppercase', letterSpacing: '0.04em', padding: '0 16px 10px', fontWeight: 600 };
  const td = { padding: '13px 16px', borderTop: '1px solid var(--line2)', fontSize: 14, verticalAlign: 'middle' };
  const chip = (id, label, n) => (
    <button key={id} onClick={() => setStage(id)} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '7px 13px', borderRadius: 9, cursor: 'pointer', fontSize: 13, fontWeight: stage === id ? 700 : 500,
      border: '1px solid ' + (stage === id ? 'var(--text)' : 'var(--line)'), background: stage === id ? 'var(--hover)' : 'var(--card)', color: stage === id ? 'var(--text)' : 'var(--mute)', textTransform: 'capitalize' }}>
      {label}<span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)' }}>{n}</span>
    </button>
  );

  /* A card. The same one on the board and, one day, anywhere else a single
     application needs to be shown small. */
  const card = (r) => {
    /* Exactly the moves the server will accept from here, named by what
       pressing them DOES. The approving one comes first and is the only one
       that looks like a decision, because approving is one click and the
       rest of it — the code, the email, the link — happens on its own. */
    const from = BOARD.find(s => s.id === r.status) || {};
    const onward = (from.next || []).map(id => BOARD.find(s => s.id === id)).filter(Boolean)
      .sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0));
    /* Draggable only where there is somewhere to go. Picking up a card that
       cannot be put down anywhere is a promise the board cannot keep.

       The buttons stay. Drag is the fast way when you know where it goes;
       the buttons are the way that works on a phone, with a keyboard, and
       when you want to read what pressing the thing will actually do. */
    const canDrag = onward.length > 0;
    const lifted = drag && drag.row.id === r.id;
    /* minWidth:0 the whole way down, or one long address makes the card wider
       than its column and the board stops lining up. */
    return (<div key={r.id} draggable={canDrag}
      onDragStart={ev => {
        ev.dataTransfer.effectAllowed = 'move';
        // some browsers refuse to start a drag with nothing on the transfer
        ev.dataTransfer.setData('text/plain', r.reference);
        dragRef.current = { row: r, next: onward.map(s => s.id) };
        setDrag(dragRef.current);
      }}
      onDragEnd={() => { dragRef.current = null; setDrag(null); setOver(null); }}
      style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 12, padding: 12, minWidth: 0, overflow: 'hidden',
        cursor: canDrag ? 'grab' : 'default', opacity: busy === r.id ? 0.5 : lifted ? 0.35 : 1 }}>
      <div onClick={() => goto('#/applications/' + r.id)} style={{ cursor: 'pointer', minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, minWidth: 0 }}>
          <Avatar name={r.name || r.email} size={26} />
          <span style={{ minWidth: 0, flex: 1 }}>
            <span style={{ display: 'block', fontWeight: 700, fontSize: 13.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.name || '—'}</span>
            <span style={{ display: 'block', fontFamily: MONO, fontSize: 10.5, color: 'var(--faint)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.email}</span>
          </span>
        </div>
        <div style={{ fontFamily: MONO, fontSize: 10.5, color: 'var(--mute)', marginTop: 8 }}>
          {r.reference}{r.charterNo ? ' · Nº ' + String(r.charterNo).padStart(4, '0') : ''}
        </div>
        {/* The number, on the card. Approving promises a call within minutes,
            so whether we can actually make it belongs where the decision is
            taken, not one click further in. */}
        {tel(r) && <div style={{ fontFamily: MONO, fontSize: 10.5, color: 'var(--mute)', marginTop: 3 }}>
          ☏ {tel(r)}{det(r, 'bestTime') && det(r, 'bestTime') !== 'Any time' ? ' · ' + det(r, 'bestTime').toLowerCase() : ''}
        </div>}
        {/* The rehearsal sits in the same board as everyone else so it can be
            found, and has to be unmistakable so nobody works it as a lead. */}
        {r.isDemo && <div style={{ marginTop: 6 }}><Pill tone="purple">walkthrough</Pill></div>}
        {(r.labels || []).length > 0 && (<div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', marginTop: 8 }}>
          {(r.labels || []).map(l => <Pill key={l} tone="blue">{l}</Pill>)}
        </div>)}
        {r.tenantName && <div style={{ marginTop: 8 }}><Pill tone="green">{r.tenantName}</Pill></div>}
      </div>
      {/* Where they can go from here. 'Open' never appears because a desk
          opening is something they do, not something we assert. */}
      {onward.length > 0 && (<div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--line2)' }}>
        {onward.map(s => (<button key={s.id} disabled={busy === r.id} onClick={() => move(r, s.id)}
          style={{ padding: '4px 9px', borderRadius: 7, border: '1px solid ' + (s.primary ? 'transparent' : 'var(--line)'),
            background: s.primary ? 'var(--text)' : 'transparent', color: s.primary ? '#111' : 'var(--mute)',
            fontSize: 11, fontWeight: s.primary ? 800 : 600, cursor: 'pointer' }}>
          {s.action || s.title}</button>))}
      </div>)}
    </div>);
  };

  const toggle = (v, label) => (
    <button key={v} onClick={() => pick(v)} style={{ padding: '6px 12px', borderRadius: 8, cursor: 'pointer', fontSize: 12.5, fontWeight: view === v ? 700 : 500,
      border: '1px solid ' + (view === v ? 'var(--text)' : 'var(--line)'), background: view === v ? 'var(--hover)' : 'transparent', color: view === v ? 'var(--text)' : 'var(--mute)' }}>{label}</button>
  );

  return (<div>
    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 16, alignItems: 'center' }}>
      {view === 'list' && chip('all', 'Everything', rows.length)}
      {view === 'list' && columns.map(s => chip(s.id, s.title, counts[s.id]))}
      {view === 'board' && <span style={{ fontSize: 12, color: 'var(--faint)' }}>Drag a card to move it, or use the buttons on it.</span>}
      <span style={{ flex: 1 }} />
      <div style={{ display: 'flex', gap: 6 }}>{toggle('board', 'Board')}{toggle('list', 'List')}</div>
    </div>
    {note && <div style={{ marginBottom: 12, padding: '9px 13px', borderRadius: 9, background: 'var(--hover)', border: '1px solid var(--line)', fontSize: 13 }}>{note}</div>}

    {view === 'board' && <Journey stages={BOARD} counts={counts} />}

    {view === 'board' && (<div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', overflowX: 'auto', paddingBottom: 8 }}>
      {ordered.map((s, ci) => {
        const inCol = inColumn(s.id);
        const hidden = s.id === 'accepted' ? counts[s.id] - inCol.length : 0;
        // the gap that separates the path from the ways out of it
        const gap = s.exit && ci === path.length ? 26 : 0;
        /* A column takes a card only if the server would accept the move.
           While something is in the hand the board says so plainly: the
           columns that can have it light up, the ones that cannot fade —
           so you find out before you let go rather than after. */
        const canDrop = !!drag && drag.next.includes(s.id);
        const refusing = !!drag && !canDrop;
        const hot = canDrop && over === s.id;
        return (<div key={s.id}
          /* dragenter AND dragover. Cancelling only dragover is the classic
             half-fix: it works when you drift in slowly and enough dragover
             events fire, and drops the card on the floor when you move fast
             enough that the first event over the column is the only one. */
          onDragEnter={ev => { if (!accepts(s.id)) return; ev.preventDefault(); if (over !== s.id) setOver(s.id); }}
          onDragOver={ev => { if (!accepts(s.id)) return; ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; if (over !== s.id) setOver(s.id); }}
          onDragLeave={ev => { if (!ev.currentTarget.contains(ev.relatedTarget)) setOver(o => (o === s.id ? null : o)); }}
          onDrop={ev => {
            ev.preventDefault();
            const d = dragRef.current;
            dragRef.current = null; setOver(null); setDrag(null);
            if (d && d.next.includes(s.id)) move(d.row, s.id);
          }}
          style={{ flex: '1 0 232px', minWidth: 232, maxWidth: 320, marginLeft: gap, opacity: refusing ? 0.4 : 1, transition: 'opacity .12s' }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, padding: '0 2px 8px' }}>
            {s.step && <span style={{ width: 17, height: 17, borderRadius: '50%', flex: 'none', display: 'grid', placeItems: 'center',
              background: 'var(--hover)', border: '1px solid var(--line)', fontFamily: MONO, fontSize: 10, fontWeight: 700, color: 'var(--mute)' }}>{s.step}</span>}
            <span style={{ fontSize: 13, fontWeight: 800 }}>{s.title}</span>
            <span style={{ fontFamily: MONO, fontSize: 11, color: 'var(--faint)' }}>{counts[s.id]}</span>
            {STAGE_HELP[s.id] && <Info title={s.title}>{STAGE_HELP[s.id]}</Info>}
          </div>
          <div style={{ fontSize: 11, color: 'var(--faint)', lineHeight: 1.45, padding: '0 2px 10px', minHeight: 30 }}>{s.blurb}</div>
          <div data-stage={s.id} style={{ display: 'grid', gap: 8, borderRadius: 13, padding: 8, minHeight: 90, transition: 'background .12s, box-shadow .12s',
            background: hot ? 'color-mix(in srgb,var(--text) 10%,var(--line2))' : 'var(--line2)',
            boxShadow: hot ? 'inset 0 0 0 2px var(--text)' : canDrop ? 'inset 0 0 0 1px var(--line)' : 'none' }}>
            {inCol.map(card)}
            {hidden > 0 && (<button onClick={() => goto('#/desks')} style={{ padding: '9px 8px', textAlign: 'center', fontSize: 11.5, color: 'var(--mute)',
              background: 'none', border: '1px dashed var(--line)', borderRadius: 10, cursor: 'pointer' }}>
              {hidden} more {hidden === 1 ? 'desk' : 'desks'} — see them all under Desks →
            </button>)}
            {/* what the drop will do, said before you let go */}
            {hot && (<div style={{ padding: '10px 8px', textAlign: 'center', fontSize: 11.5, fontWeight: 700 }}>
              {s.action ? s.action : 'Move here'}
            </div>)}
            {/* A column that just fades when you drag at it leaves you
                wondering whether the board is broken. Say which it is:
                Open is not somewhere you can put an application, and the
                rest are simply not legal from where this card is. */}
            {refusing && (<div style={{ padding: '12px 10px', textAlign: 'center', fontSize: 11.5, lineHeight: 1.5, color: 'var(--mute)' }}>
              {s.id === 'accepted'
                ? 'A desk opens when they finish setup — you cannot put one here.'
                : 'Not a move you can make from where that card is.'}
            </div>)}
            {inCol.length === 0 && !hot && !refusing && (<div style={{ padding: '18px 10px', textAlign: 'center', color: 'var(--faint)', fontSize: 12, lineHeight: 1.5 }}>
              {s.id === 'accepted' ? 'Nobody has finished setting up yet. Desks arrive here on their own.' : 'Empty'}
            </div>)}
          </div>
        </div>);
      })}
    </div>)}

    {view === 'list' && (<div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
      <div style={{ flex: 1, minWidth: 0, background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14, overflow: 'hidden' }}>
        <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 640 }}>
          <thead><tr>
            <th style={{ ...th, paddingTop: 14 }}>{kind === 'early_access' ? 'Applicant' : 'From'}</th>
            <th style={th}>Stage</th><th style={th}>{kind === 'early_access' ? 'Wants' : 'About'}</th><th style={th}>Became</th><th style={th}>Received</th>
          </tr></thead>
          <tbody>
            {shown.map(r => (<tr key={r.id} onClick={() => goto('#/' + (kind === 'early_access' ? 'applications' : 'messages') + '/' + r.id)} style={{ cursor: 'pointer' }}>
              <td style={td}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Avatar name={r.name || r.email} />
                  <span><span style={{ display: 'block', fontWeight: 600 }}>{r.name || '—'}</span>
                  <span style={{ display: 'block', fontFamily: MONO, fontSize: 11, color: 'var(--faint)' }}>{r.email}</span></span></span>
              </td>
              <td style={td}><Pill tone={STAGE_TONE[r.status]} dot>{stageTitle(BOARD, r.status)}</Pill></td>
              <td style={{ ...td, color: 'var(--mute)', fontSize: 13 }}>{(r.details && (r.details.workspace || r.details.topic)) || '—'}</td>
              <td style={td}>{r.tenantName ? <Pill tone="green">{r.tenantName}</Pill> : <span style={{ color: 'var(--faint)' }}>—</span>}</td>
              <td style={{ ...td, fontFamily: MONO, fontSize: 12.5, color: 'var(--mute)' }}>{fmtDay(r.createdAt)}</td>
            </tr>))}
            {shown.length === 0 && <tr><td colSpan={5} style={{ ...td, textAlign: 'center', color: 'var(--faint)', padding: 40 }}>
              {rows.length === 0 ? 'Nothing has come in yet.' : 'Nothing at this stage.'}</td></tr>}
          </tbody>
        </table>
        </div>
      </div>

    </div>)}
  </div>);
}

/* ===================== PLATFORM SETTINGS =====================
   Built for a team that does not exist yet, on purpose. The permission
   system has to be there before anybody is added to it — retro-fitting
   roles onto a panel where everyone had everything is how you end up
   auditing what your support contractor could reach. */
function SettingsPage() {
  const [d, setD] = useState(null); const [flash, setFlash] = useState(''); const [busy, setBusy] = useState(false);
  const [f, setF] = useState({ email: '', name: '', role: 'support' });
  const load = () => api('/api/admin/team').then(setD).catch(() => setFlash('Could not load the team.'));
  useEffect(() => { load(); }, []);
  if (!d) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;

  const act = async (fn, ok) => {
    setBusy(true); setFlash('');
    try { await fn(); setFlash(ok); await load(); }
    catch (e) { setFlash((e.body && e.body.detail) || 'That did not work.'); }
    setBusy(false);
  };
  const inSty = { padding: '9px 11px', borderRadius: 9, border: '1px solid var(--line)', background: 'var(--sidebar)', color: 'var(--text)', fontSize: 13, outline: 'none' };
  const roleOf = (id) => d.roles.find(r => r.id === id) || { title: id, blurb: '' };

  return (<div>
    {/* No PageHead: the tab header above already says "Platform settings",
        and printing it twice reads as a bug rather than as emphasis. */}
    <p style={{ color: 'var(--mute)', fontSize: 13.5, margin: '0 0 16px', maxWidth: 640 }}>Who runs CurrencyDesk, and what each of them can reach.</p>
    {flash && <div style={{ marginBottom: 14, padding: '10px 14px', borderRadius: 10, fontSize: 13, background: 'var(--hover)', border: '1px solid var(--line)' }}>{flash}</div>}

    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.5fr) minmax(300px,1fr)', gap: 16, alignItems: 'start' }}>
      <div style={{ display: 'grid', gap: 16 }}>
        <Card title="Team">
          {d.members.map(m => (<div key={m.email} style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '11px 0', borderBottom: '1px solid var(--line2)' }}>
            <Avatar name={m.name || m.email} size={32} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span style={{ display: 'block', fontWeight: 700, fontSize: 13.5 }}>{m.name || m.email}</span>
              <span style={{ display: 'block', fontFamily: MONO, fontSize: 11, color: 'var(--faint)' }}>{m.email}</span>
            </span>
            {m.status === 'suspended' && <Pill tone="amber">suspended</Pill>}
            {m.role === 'owner'
              ? <Pill tone="purple">Platform Owner</Pill>
              : d.canManage
                ? (<select disabled={busy} value={m.role} onChange={e => act(() => api('/api/admin/team/' + encodeURIComponent(m.email), { method: 'PATCH', body: JSON.stringify({ role: e.target.value }) }), m.email + ' is now ' + e.target.value + '.')}
                    style={{ ...inSty, fontSize: 12 }}>
                    {d.roles.filter(r => r.id !== 'owner').map(r => <option key={r.id} value={r.id}>{r.title}</option>)}
                  </select>)
                : <Pill tone="mute">{roleOf(m.role).title}</Pill>}
            {d.canManage && m.role !== 'owner' && (<>
              <button disabled={busy} onClick={() => act(() => api('/api/admin/team/' + encodeURIComponent(m.email), { method: 'PATCH', body: JSON.stringify({ status: m.status === 'active' ? 'suspended' : 'active' }) }), m.email + ' ' + (m.status === 'active' ? 'suspended' : 'restored') + '.')}
                style={{ ...inSty, cursor: 'pointer', fontSize: 12 }}>{m.status === 'active' ? 'Suspend' : 'Restore'}</button>
              <button disabled={busy} onClick={() => act(() => api('/api/admin/team/' + encodeURIComponent(m.email), { method: 'DELETE' }), m.email + ' removed, and their sessions with them.')}

// ===================== SHARED PAGE FURNITURE =====================
const money = (n, ccy) => {
  const v = Number(n) || 0;
  const s = v.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return ccy ? s + ' ' + ccy : s;
};
const K = (n) => { const v = Number(n) || 0; return v >= 1000000 ? (v / 1000000).toFixed(1) + 'M' : v >= 1000 ? Math.round(v / 1000) + 'k' : String(v); };
const goto = (h) => { window.location.hash = h; };
/* Records get their own URL. #/desks/tnt-x and #/applications/<id> are pages
   you can bookmark, reload and paste to someone — which a drawer never was. */
function parseHash(h) {
  const parts = String(h || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  let tab = parts[0] || 'overview';
  let id = parts[1] ? decodeURIComponent(parts[1]) : null;
  /* Old links keep working. `messages` is now `inbox`. `onboarding` was a
     staff-side copy of the customer's setup flow and is gone entirely, so
     those land on the applications list — its second part was a CD
     reference, which is not an application id, and carrying it through
     would only produce a not-found. */
  const MOVED = { messages: 'inbox', 'early-access': 'applications' };
  if (tab === 'onboarding') { tab = 'applications'; id = null; }
  else if (MOVED[tab]) tab = MOVED[tab];
  const known = PAGES.map(p => p.id).concat(['settings', 'people']);
  return { tab: known.indexOf(tab) >= 0 ? tab : 'overview', id };
}

function PageHead({ back, backTo, title, sub, pills, actions }) {
  return (<div style={{ marginBottom: 22 }}>
    <button onClick={() => goto(backTo)} style={{ background: 'none', border: 'none', color: 'var(--mute)', cursor: 'pointer', fontSize: 13, padding: 0, marginBottom: 12 }}>← {back}</button>
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
      <h1 style={{ fontSize: 26, fontWeight: 800, margin: 0 }}>{title}</h1>
      {pills}
      <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>{actions}</div>
    </div>
    {sub && <div style={{ fontFamily: MONO, fontSize: 12, color: 'var(--faint)', marginTop: 6 }}>{sub}</div>}
  </div>);
}
/* ============================================================
   THE LITTLE ⓘ

   The bar this panel is held to: somebody who has never seen the system
   should be able to work it within a day. That means nothing on screen
   is allowed to be a word you have to already know — every label that
   could be read two ways carries the explanation next to it, one click
   away.

   Deliberately click rather than hover. Hover help does not exist on a
   phone, disappears the moment you move to read it, and cannot be left
   open next to the thing it describes while you decide.
   ============================================================ */
function Info({ children, title }) {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    if (!open) return;
    const shut = (e) => { if (!e.target.closest || !e.target.closest('[data-info]')) setOpen(false); };
    const esc = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('click', shut);
    window.addEventListener('keydown', esc);
    return () => { window.removeEventListener('click', shut); window.removeEventListener('keydown', esc); };
  }, [open]);
  return (<span data-info style={{ position: 'relative', display: 'inline-flex', verticalAlign: 'middle' }}>
    <button type="button" aria-label={'What is ' + (title || 'this') + '?'} aria-expanded={open}
      onClick={e => { e.stopPropagation(); setOpen(o => !o); }}
      style={{ width: 15, height: 15, marginLeft: 6, borderRadius: '50%', border: '1px solid ' + (open ? 'var(--text)' : 'var(--line)'),
        background: open ? 'var(--text)' : 'transparent', color: open ? '#111' : 'var(--faint)',
        fontSize: 10, fontWeight: 800, lineHeight: 1, display: 'grid', placeItems: 'center', cursor: 'pointer', padding: 0, flex: 'none' }}>i</button>
    {open && (<span onClick={e => e.stopPropagation()} style={{ position: 'absolute', zIndex: 80, top: 22, left: -8, width: 290,
      background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 11, padding: '11px 13px',
      boxShadow: '0 18px 40px -12px rgba(0,0,0,0.6)', fontSize: 12.5, lineHeight: 1.6, color: 'var(--mute)',
      fontWeight: 400, letterSpacing: 0, textTransform: 'none', fontFamily: 'inherit', whiteSpace: 'normal', textAlign: 'left' }}>
      {title && <span style={{ display: 'block', fontWeight: 700, color: 'var(--text)', marginBottom: 4 }}>{title}</span>}
      {children}
    </span>)}
  </span>);
}

function Card({ title, help, children, pad = 16 }) {
  return (<div style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14, overflow: 'hidden' }}>
    {title && <div style={{ padding: '13px 16px', borderBottom: '1px solid var(--line2)', fontFamily: MONO, fontSize: 10, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--faint)' }}>
      {title}{help && <Info title={title}>{help}</Info>}
    </div>}
    <div style={{ padding: pad }}>{children}</div>
  </div>);
}
function Tiles({ items }) {
  return (<div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(140px,1fr))', gap: 10, marginBottom: 18 }}>
    {items.map(t => (<div key={t.k} style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 12, padding: '13px 15px' }}>
      <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--faint)' }}>{t.k}</div>
      <div style={{ fontSize: 22, fontWeight: 800, marginTop: 5, color: t.c || 'var(--text)' }}>{t.v}</div>
      {t.sub && <div style={{ fontSize: 11.5, color: 'var(--mute)', marginTop: 2 }}>{t.sub}</div>}
    </div>))}
  </div>);
}
const kv = (k, v, help) => v == null || v === '' ? null : (
  <div key={k} style={{ display: 'flex', justifyContent: 'space-between', gap: 14, padding: '8px 0', borderBottom: '1px solid var(--line2)', fontSize: 13 }}>

    <span style={{ fontWeight: 600, textAlign: 'right', wordBreak: 'break-word' }}>{v}</span></div>);

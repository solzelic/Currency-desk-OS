          <div style={{ padding: '4px 16px', maxHeight: 320, overflow: 'auto' }}>
            {d.audit.slice(0, 20).map(e => (<div key={e.id} style={{ display: 'flex', gap: 12, alignItems: 'baseline', padding: '9px 0', borderBottom: '1px solid var(--line2)' }}>
              <span style={{ fontFamily: MONO, fontSize: 11, color: 'var(--faint)', width: 120, flex: 'none' }}>{fmtWhen(e.at)}</span>
              <span style={{ fontFamily: MONO, fontSize: 12, fontWeight: 700, flex: 1 }}>{e.action}</span>
              <span style={{ fontSize: 12, color: 'var(--mute)' }}>{e.actorId}</span>
            </div>))}
            {d.audit.length === 0 && <div style={{ padding: 20, color: 'var(--faint)' }}>Nothing yet.</div>}
          </div>
        </Card>
      </div>

      <div style={{ display: 'grid', gap: 16 }}>
        {/* Is their rate board actually on their website?

            Three things have to be true and each can fail alone, which is why
            this was so hard to answer by looking: there has to be a storefront
            at their address, they have to have published a board, and a
            visitor has to be able to reach it. Say it in one line, then show
            the working. */}
        {d.publicSite && (() => {
          const p = d.publicSite;
          const live = p.hosted && p.published;
          const tone = live ? 'green' : p.hosted ? 'amber' : 'mute';
          return (<Card title="Public rate board">
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 9, marginBottom: 12 }}>
              <span style={{ flex: 'none', width: 8, height: 8, borderRadius: 999, marginTop: 6,
                background: live ? 'var(--green)' : p.hosted ? 'var(--amber)' : 'var(--line)' }} />
              <span style={{ fontSize: 13, lineHeight: 1.5 }}>{p.status}</span>
            </div>
            {kv('Address', p.path
              ? <a href={p.path} target="_blank" rel="noopener" style={{ fontFamily: MONO, fontSize: 12, color: 'var(--blue)' }}>{p.path}</a>
              : '—')}
            {p.domain && kv('Their domain', p.domain)}
            {kv('Currencies shown', p.published ? String(p.currencies) : '—')}
            {kv('Last published', p.publishedAt ? fmtWhen(p.publishedAt) : 'never')}
            {p.publishedBy && kv('By', p.publishedBy)}
            {/* The exact request a visitor's browser makes. When somebody
                says "the site is wrong", this is the thing to open. */}
            {p.ratesEndpoint && (<div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--line2)' }}>
              <div style={{ fontSize: 11.5, color: 'var(--mute)', marginBottom: 6 }}>What a visitor's browser asks for</div>
              <a href={p.ratesEndpoint} target="_blank" rel="noopener"
                style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--blue)', wordBreak: 'break-all' }}>{p.ratesEndpoint}</a>
            </div>)}
            <div style={{ fontSize: 11.5, color: 'var(--faint)', marginTop: 10, lineHeight: 1.5 }}>
              {tone === 'green'
                ? 'Their site reads this board directly, so what a customer sees is what the desk is trading at.'
                : tone === 'amber'
                  ? 'Nothing will show on their site until somebody presses Publish on the rate board.'
                  : 'A storefront has to be deployed for this address before rates can appear.'}
            </div>
          </Card>);
        })()}

        {owner && (<Card title="Owner">
          <div style={{ display: 'flex', alignItems: 'center', gap: 11, marginBottom: 12 }}>
            <Avatar name={owner.name} size={38} />
            <span><span style={{ display: 'block', fontWeight: 700 }}>{owner.name}</span>
              <a href={'mailto:' + owner.staffId} style={{ display: 'block', fontFamily: MONO, fontSize: 11.5, color: 'var(--blue)' }}>{owner.staffId}</a></span>
          </div>
          {kv('Signed up', fmtDay(owner.createdAt))}
        </Card>)}

        {d.application && (<Card title="Came from">
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, justifyContent: 'space-between' }}>
            <span><span style={{ display: 'block', fontFamily: MONO, fontSize: 12.5, fontWeight: 700 }}>{d.application.reference}</span>
              <span style={{ display: 'block', fontSize: 12, color: 'var(--mute)', marginTop: 2 }}>applied {fmtDay(d.application.createdAt)}</span></span>
            <button onClick={() => goto('#/applications/' + d.application.id)} style={btn('transparent', 'var(--text)', { fontSize: 12 })}>Open</button>
          </div>
        </Card>)}

        <Card title="Business">
          {kv('Desk address', t.slug)}
          {kv('Public site', t.siteDomain)}
          {kv('Country', setup.country)}
          {kv('Regulator', setup.regulator || le.jurisdiction)}
          {kv('MSB number', setup.msbNumber || le.msbNumber)}
          {kv('Legal entity', le.name)}
          {kv('Branches', ds.branches || null)}
          {kv('Currencies priced', ds.currencies || null)}
        </Card>

        <Card title={'People (' + d.staff.length + ')'}>
          {d.staff.map(s => (<button key={s.id} onClick={() => goto('#/people/' + s.id)}
            style={{ display: 'flex', width: '100%', alignItems: 'center', gap: 10, padding: '7px 0', background: 'none', border: 'none', color: 'var(--text)', cursor: 'pointer', textAlign: 'left' }}>
            <Avatar name={s.name} size={28} />
            <span style={{ flex: 1, minWidth: 0 }}><span style={{ display: 'block', fontSize: 13, fontWeight: 600 }}>{s.name}{s.active === false && <span style={{ color: 'var(--red)', fontWeight: 500 }}> · blocked</span>}</span>
              <span style={{ display: 'block', fontFamily: MONO, fontSize: 11, color: 'var(--mute)', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.cdId || s.staffId}</span></span>
            <Pill tone={s.role === 'administrator' ? 'purple' : 'mute'}>{s.role.replace('_', ' ')}</Pill>
          </button>))}
        </Card>

        <Card title="Plan">
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {['basic', 'pro', 'premium'].map(p => <button key={p} onClick={() => act(() => api('/api/admin/tenants/' + id, { method: 'PATCH', body: JSON.stringify({ plan: p }) }), 'plan')} disabled={busy === 'plan'}
              style={btn(t.plan === p ? 'var(--hover)' : 'transparent', t.plan === p ? 'var(--text)' : 'var(--mute)', { textTransform: 'capitalize', fontSize: 12.5 })}>{p}</button>)}
          </div>
        </Card>

        <Card title="Retention">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55 }}>
            Desks are <b style={{ color: 'var(--text)' }}>suspended, not deleted</b> — records must be kept <b style={{ color: 'var(--text)' }}>6 years</b> (FINTRAC). Blocking takes a desk offline and keeps every record.{!suspended && ' To delete, block it first.'}
          </div>
          {suspended && (<div style={{ borderTop: '1px solid var(--line2)', marginTop: 12, paddingTop: 12 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--red)', marginBottom: 8 }}>Permanently delete — last resort</div>
            <label style={{ display: 'flex', gap: 8, fontSize: 12, color: 'var(--mute)', marginBottom: 10, cursor: 'pointer', lineHeight: 1.45 }}>
              <input type="checkbox" checked={ack} onChange={e => setAck(e.target.checked)} style={{ marginTop: 2, flex: 'none' }} />
              <span>I understand this destroys {t.name}'s records we are required to keep for 6 years, and cannot be undone.</span></label>
            <input value={confirmName} onChange={e => setConfirmName(e.target.value)} placeholder={'type ' + t.slug + ' to confirm'}
              style={{ width: '100%', padding: '9px 11px', background: 'var(--bg)', border: '1px solid var(--line)', borderRadius: 8, color: 'var(--text)', fontSize: 13, fontFamily: MONO, marginBottom: 9, outline: 'none', boxSizing: 'border-box' }} />
            <button onClick={() => act(async () => { await api('/api/admin/tenants/' + id, { method: 'DELETE' }); goto('#/desks'); }, 'delete')}
              disabled={!ack || confirmName !== t.slug || busy === 'delete'}
              style={{ width: '100%', padding: 10, borderRadius: 9, border: 'none', cursor: (ack && confirmName === t.slug) ? 'pointer' : 'not-allowed', background: (ack && confirmName === t.slug) ? 'var(--red)' : 'rgba(248,113,113,0.18)', color: (ack && confirmName === t.slug) ? '#fff' : 'rgba(255,255,255,0.4)', fontWeight: 700, fontSize: 13 }}>
              {busy === 'delete' ? 'Deleting…' : 'Delete permanently'}</button>
          </div>)}
        </Card>
      </div>
    </div>
  </div>);
}

// ===================== PERSON PAGE =====================
// Support acts on people. Someone leaves, someone's laptop goes missing,
// someone can't get in — all of that is done from here.
function PersonPage({ id, onChanged }) {
  const [d, setD] = useState(null); const [err, setErr] = useState('');
  const [busy, setBusy] = useState(''); const [flash, setFlash] = useState(null);
  const load = () => api('/api/admin/staff/' + encodeURIComponent(id)).then(setD).catch(() => setErr('Could not load this person.'));
  useEffect(() => { setD(null); setErr(''); setFlash(null); load(); }, [id]);

  if (err) return <div style={{ color: 'var(--red)', padding: 20 }}>{err}</div>;
  if (!d) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;

  const p = d.person, desk = d.desk;
  const sent = (s) => s === 'sent' ? 'and emailed to them' : s === 'simulated' ? 'and the email is simulated here' : s === 'failed' ? 'but the email did not send' : 'but they have no email on file';
  const run = async (label, path, body, done) => {
    setBusy(label); setFlash(null);
    try {
      // the shared api() always sets a JSON content-type, and Fastify rejects
      // that with no body — so an action with nothing to say still says {}
      const r = await api(path, { method: body ? 'PATCH' : 'POST', body: JSON.stringify(body || {}) });
      setFlash(done(r));
      await load(); onChanged && onChanged();
    } catch (x) { setFlash({ tone: 'red', text: (x.body && x.body.detail) || 'That did not work.' }); }
    setBusy('');
  };
  const btn = (bg, col, extra) => Object.assign({ padding: '9px 14px', borderRadius: 9, border: '1px solid var(--line)', background: bg, color: col, fontSize: 13, fontWeight: 600, cursor: busy ? 'default' : 'pointer' }, extra || {});

  return (<div>
    <PageHead back={desk ? desk.name : 'Desks'} backTo={desk ? '#/desks/' + desk.id : '#/desks'}
      title={p.name} sub={p.staffId + '  ·  joined ' + fmtDay(p.createdAt)}
      pills={<><Pill tone={p.active ? 'green' : 'red'} dot>{p.active ? 'Active' : 'Blocked'}</Pill><Pill tone={p.role === 'administrator' ? 'purple' : 'mute'}>{p.role.replace('_', ' ')}</Pill>{p.mustChangePassword && <Pill tone="amber">Must change password</Pill>}</>}
      actions={<a href={'mailto:' + p.staffId} style={{ ...btn('transparent', 'var(--text)'), textDecoration: 'none' }}>Email them</a>} />

    {flash && <div style={{ marginBottom: 16, padding: '11px 14px', borderRadius: 10, fontSize: 13, lineHeight: 1.55,
      background: 'color-mix(in srgb,' + toneColor(flash.tone || 'blue') + ' 12%,transparent)', border: '1px solid color-mix(in srgb,' + toneColor(flash.tone || 'blue') + ' 30%,transparent)' }}>
      {flash.text}
      {flash.code && <div style={{ fontFamily: MONO, fontSize: 18, fontWeight: 700, letterSpacing: '0.08em', marginTop: 8 }}>{flash.code}</div>}
    </div>}

    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.5fr) minmax(300px,1fr)', gap: 16, alignItems: 'start' }}>
      <div style={{ display: 'grid', gap: 16 }}>
        <Card title="CurrencyDesk ID">
          {p.cdId
            ? <div style={{ fontFamily: MONO, fontSize: 26, fontWeight: 700, letterSpacing: '0.1em' }}>{p.cdId}</div>
            : <div style={{ fontSize: 13.5, color: 'var(--mute)', lineHeight: 1.55 }}>None yet — they sign in as <b style={{ color: 'var(--text)' }}>{p.staffId}</b>.</div>}
          <div style={{ fontSize: 12.5, color: 'var(--faint)', marginTop: 10, lineHeight: 1.55 }}>
            What they read out when they ring, and what they can sign in with. {p.cdId ? 'Issuing a new one retires this one immediately.' : 'Issuing one does not take away their current sign-in.'}
          </div>
          <button disabled={!!busy} onClick={() => run('cdid', '/api/admin/staff/' + p.id + '/cd-id', null,
            (r) => ({ tone: 'green', text: (r.previous ? 'New ID issued — the old one no longer works, ' : 'ID issued, ') + sent(r.delivered) + '.', code: r.cdId }))}
            style={{ ...btn(p.cdId ? 'transparent' : 'var(--text)', p.cdId ? 'var(--text)' : '#111'), marginTop: 12 }}>
            {busy === 'cdid' ? 'Issuing…' : p.cdId ? 'Issue a new ID' : 'Issue an ID'}</button>
        </Card>

        <Card title={'Their activity (' + d.events.length + ')'} pad={0}>
          <div style={{ padding: '4px 16px', maxHeight: 300, overflow: 'auto' }}>
            {d.events.map(e => (<div key={e.id} style={{ display: 'flex', gap: 12, alignItems: 'baseline', padding: '9px 0', borderBottom: '1px solid var(--line2)' }}>
              <span style={{ fontFamily: MONO, fontSize: 11, color: 'var(--faint)', width: 120, flex: 'none' }}>{fmtWhen(e.at)}</span>
              <span style={{ fontFamily: MONO, fontSize: 12, fontWeight: 700 }}>{e.action}</span>
            </div>))}
            {d.events.length === 0 && <div style={{ padding: 20, color: 'var(--faint)' }}>Nothing recorded yet.</div>}
          </div>
        </Card>
      </div>

      <div style={{ display: 'grid', gap: 16 }}>
        <Card title="Account">
          {kv('Signs in as', p.staffId)}
          {kv('Desk', desk ? <button onClick={() => goto('#/desks/' + desk.id)} style={{ background: 'none', border: 'none', color: 'var(--blue)', cursor: 'pointer', padding: 0, fontSize: 13, fontWeight: 600 }}>{desk.name}</button> : null)}
          {kv('Role', p.role.replace('_', ' '))}
          {kv('Signed in now', d.sessions.live > 0 ? d.sessions.live + ' device' + (d.sessions.live === 1 ? '' : 's') : 'no')}
          {kv('Last sign-in', d.sessions.lastSignInAt ? fmtWhen(d.sessions.lastSignInAt) : 'never')}
          {kv('Password set', p.passwordUpdatedAt ? fmtWhen(p.passwordUpdatedAt) : 'at signup')}
        </Card>

        <Card title="Can't get in">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
            Issues a temporary password, signs every device out, and makes them pick their own before the desk opens.
          </div>
          <button disabled={!!busy} onClick={() => run('reset', '/api/admin/staff/' + p.id + '/reset-password', null,
            (r) => r.tempPassword
              ? { tone: 'amber', text: 'Password reset. They have no email on file, so read this to them — it is shown once.', code: r.tempPassword }
              : { tone: 'green', text: 'Password reset ' + sent(r.delivered) + '. Every device has been signed out.' })}
            style={{ ...btn('transparent', 'var(--text)'), width: '100%' }}>
            {busy === 'reset' ? 'Resetting…' : 'Reset their password'}</button>
        </Card>

        <Card title="Till PIN">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
            {p.pinLockedUntil
              ? <span style={{ color: 'var(--amber)' }}><b>The keypad is shut</b> after too many wrong tries — until {fmtWhen(p.pinLockedUntil)}. Resetting the PIN opens it again straight away.</span>
              : p.pinMustChange
                ? <span style={{ color: 'var(--amber)' }}><b>Still the one we issued</b> ({fmtWhen(p.pinSetAt)}) — so whoever read it out knows it. They set their own from Settings, or reset it themselves with their password.</span>
                : p.hasPin
                  ? <>Four digits, asked for at the till, when switching accounts and when voiding. They chose it {fmtWhen(p.pinSetAt)}. Nobody can read it back — not even us.</>
                  : <>No PIN set. Until there is one the desk falls back to its own check, which anyone can see. Issue one.</>}
          </div>
          <button disabled={!!busy} onClick={() => run('pin', '/api/admin/staff/' + p.id + '/reset-pin', null,
            (r) => ({ tone: 'amber', text: 'New PIN. Read it to them — it is shown once and cannot be looked up again.', code: r.pin }))}
            style={{ ...btn(p.hasPin ? 'transparent' : 'var(--text)', p.hasPin ? 'var(--text)' : '#111'), width: '100%' }}>
            {busy === 'pin' ? 'Setting…' : p.hasPin ? 'Reset their PIN' : 'Issue a PIN'}</button>
        </Card>

        <Card title="Access">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
            {p.active
              ? 'Blocking signs them out everywhere at once and refuses any new sign-in. Their records stay exactly as they are.'
              : 'They are blocked: signed out everywhere and unable to sign in.'}
          </div>
          <button disabled={!!busy} onClick={() => run('block', '/api/admin/staff/' + p.id, { active: !p.active },
            () => ({ tone: p.active ? 'amber' : 'green', text: p.active ? p.name + ' is blocked and signed out everywhere.' : p.name + ' can sign in again.' }))}
            style={{ ...btn(p.active ? 'color-mix(in srgb,var(--red) 14%,transparent)' : 'color-mix(in srgb,var(--green) 14%,transparent)', p.active ? 'var(--red)' : 'var(--green)'), width: '100%' }}>
            {busy === 'block' ? '…' : p.active ? 'Block this person' : 'Unblock this person'}</button>
        </Card>
      </div>
    </div>
  </div>);
}

// ===================== APPLICATION PAGE =====================

/* Free-form on purpose. The moment you make an operator pick from a fixed
   list you have to guess the list, and they will want one you did not think
   of on their second day. What everyone has already used is offered back, so
   the vocabulary converges without being imposed. */
function LabelBox({ enquiry, onSaved }) {
  const [labels, setLabels] = useState(enquiry.labels || []);
  const [all, setAll] = useState([]);
  const [draft, setDraft] = useState('');
  const [busy, setBusy] = useState(false);
  useEffect(() => { setLabels(enquiry.labels || []); }, [enquiry.id, (enquiry.labels || []).join(',')]);
  useEffect(() => { api('/api/admin/labels').then(r => setAll(r.labels || [])).catch(() => {}); }, []);

  const put = async (next) => {
    setBusy(true);
    try { const r = await api('/api/admin/enquiries/' + enquiry.id + '/labels', { method: 'PUT', body: JSON.stringify({ labels: next }) });
      setLabels(r.labels); onSaved && onSaved(); } catch (e) {}
    setBusy(false);
  };
  const add = (l) => { const v = String(l || '').trim().toLowerCase(); if (!v || labels.includes(v)) return; setDraft(''); put([...labels, v]); };
  const drop = (l) => put(labels.filter(x => x !== l));
  const unused = all.filter(a => !labels.includes(a.label)).slice(0, 8);

  return (<Card title="Labels"
    help="What an application is LIKE — 'high volume', 'referred by jordan', 'toronto'. Free-form and unlimited, and they drive nothing on their own: they are for finding and sorting. Where an application IS in the process is its stage, and that is the column it sits in.">
    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: labels.length ? 11 : 0 }}>
      {labels.map(l => (<button key={l} disabled={busy} onClick={() => drop(l)} title="Remove"
        style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '4px 9px', borderRadius: 999, fontSize: 12, fontWeight: 600, cursor: 'pointer',
          border: '1px solid color-mix(in srgb,var(--blue) 34%,transparent)', background: 'color-mix(in srgb,var(--blue) 13%,transparent)', color: 'var(--text)' }}>
        {l}<span style={{ color: 'var(--faint)' }}>×</span></button>))}
    </div>
    <form onSubmit={ev => { ev.preventDefault(); add(draft); }} style={{ display: 'flex', gap: 8 }}>
      <input value={draft} onChange={ev => setDraft(ev.target.value)} placeholder="high volume, toronto, referred…" maxLength={32}
        style={{ flex: 1, padding: '8px 11px', borderRadius: 9, border: '1px solid var(--line)', background: 'var(--sidebar)', color: 'var(--text)', fontSize: 13, outline: 'none' }} />
      <button disabled={busy || !draft.trim()} style={{ padding: '8px 14px', borderRadius: 9, border: '1px solid var(--line)', background: 'transparent', color: 'var(--text)', fontSize: 13, fontWeight: 600, cursor: draft.trim() ? 'pointer' : 'default' }}>Add</button>
    </form>
    {unused.length > 0 && (<div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', marginTop: 10 }}>
      <span style={{ fontSize: 11, color: 'var(--faint)', alignSelf: 'center' }}>Used before:</span>
      {unused.map(a => (<button key={a.label} disabled={busy} onClick={() => add(a.label)}
        style={{ padding: '3px 8px', borderRadius: 999, fontSize: 11.5, cursor: 'pointer', border: '1px solid var(--line)', background: 'transparent', color: 'var(--mute)' }}>{a.label}</button>))}
    </div>)}
  </Card>);
}

function ApplicationPage({ id, onChanged }) {
  const [d, setD] = useState(null); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(''); const [flash, setFlash] = useState('');
  const load = () => api('/api/admin/enquiries/' + encodeURIComponent(id)).then(r => { setD(r); setNote(r.enquiry.notes || ''); }).catch(() => setErr('Could not load this application.'));
  useEffect(() => { setD(null); setErr(''); load(); }, [id]);

  if (err) return <div style={{ color: 'var(--red)', padding: 20 }}>{err}</div>;
  if (!d) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;

  const e = d.enquiry;
  const isApp = e.kind === 'early_access';
  /* The same stage list the board draws its columns from, so this page can
     never offer a move the board would not, or one the server would refuse. */
  const stages = d.stages || [];
  const onward = ((stages.find(s => s.id === e.status) || {}).next || [])
    .map(id => stages.find(s => s.id === id)).filter(Boolean)
    .sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0));
  const save = async (body, label) => {
    setBusy(true); setFlash('');
    try {
      const r = await api('/api/admin/enquiries/' + e.id, { method: 'PATCH', body: JSON.stringify(body) });
      if (r && r.invite) setFlash(r.invite === 'failed' ? 'Stage saved, but the invitation email did not send.' : r.invite === 'simulated' ? 'Invited. Email is simulated here — it will send for real once Resend is configured.' : 'Invited, and the invitation is on its way.');
      else if (label) setFlash(label);
      await load(); onChanged && onChanged();
    } catch (x) { setFlash((x.body && x.body.detail) || 'Could not save.'); }
    setBusy(false);
  };
  const btn = (bg, col, extra) => Object.assign({ padding: '9px 14px', borderRadius: 9, border: '1px solid var(--line)', background: bg, color: col, fontSize: 13, fontWeight: 600, cursor: busy ? 'default' : 'pointer' }, extra || {});

  return (<div>
    <PageHead back={isApp ? 'Applications' : 'Inbox'} backTo={isApp ? '#/applications' : '#/inbox'}
      title={e.name || e.email} sub={e.reference + '  ·  received ' + fmtWhen(e.createdAt)}
      pills={<Pill tone={STAGE_TONE[e.status]} dot>{stageTitle(stages, e.status)}</Pill>}
      actions={<a href={'mailto:' + e.email} style={{ ...btn('transparent', 'var(--text)'), textDecoration: 'none' }}>Reply by email</a>} />

    {flash && <div style={{ marginBottom: 14, padding: '10px 14px', borderRadius: 10, fontSize: 13, background: 'color-mix(in srgb,var(--blue) 12%,transparent)', border: '1px solid color-mix(in srgb,var(--blue) 30%,transparent)' }}>{flash}</div>}

    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.6fr) minmax(280px,1fr)', gap: 16, alignItems: 'start' }}>
      <div style={{ display: 'grid', gap: 16 }}>
        {/* How to reach them, first and on its own.

            Everything else on this page is something you read; this is the
            thing you DO. The application form promises a call within minutes
            of approval, so the number, the hour they said to ring, and a
            button that dials it should not be four rows down a list of
            answers about monthly volume. */}
        {isApp && (<Card title="How to reach them"
          help="Collected on the application so nobody has to chase it. The call is the promise the form makes — within a few minutes of approving, at the time they picked.">
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            <span style={{ minWidth: 0 }}>
              <span style={{ display: 'block', fontFamily: MONO, fontSize: 19, fontWeight: 700, letterSpacing: '0.03em' }}>
                {tel(e) || <span style={{ color: 'var(--faint)', fontSize: 14, fontWeight: 400, letterSpacing: 0 }}>No number — they applied before we asked for one</span>}
              </span>
              {det(e, 'bestTime') && <span style={{ display: 'block', fontSize: 12.5, color: 'var(--mute)', marginTop: 3 }}>Best time: {det(e, 'bestTime')}</span>}
            </span>
            <span style={{ flex: 1 }} />
            {tel(e) && <a href={'tel:' + tel(e).replace(/\s+/g, '')} style={{ ...btn('var(--text)', '#111'), textDecoration: 'none', fontWeight: 700, border: 'none' }}>Call them</a>}
            <a href={'mailto:' + e.email} style={{ ...btn('transparent', 'var(--mute)', { fontSize: 12.5 }), textDecoration: 'none' }}>Email instead</a>
          </div>
          {det(e, 'phoneUnparsed') && (<div style={{ marginTop: 11, padding: '9px 12px', borderRadius: 9, fontSize: 12.5, lineHeight: 1.55,
            background: 'color-mix(in srgb,var(--amber) 12%,transparent)', border: '1px solid color-mix(in srgb,var(--amber) 30%,transparent)' }}>
            We could not read this as a phone number. They typed <b style={{ fontFamily: MONO }}>{det(e, 'phoneUnparsed')}</b> — check it before dialling.
          </div>)}
          <div style={{ fontSize: 12, color: 'var(--faint)', marginTop: 10, lineHeight: 1.5 }}>{e.email}</div>
        </Card>)}

        <Card title={isApp ? 'What they told us' : 'Their message'}
          help={isApp ? 'Their own answers from the early-access form, exactly as given. Nothing here is verified — it is what they said about themselves.' : 'Sent from the contact page. They were promised a reply within a business day.'}>
          {kv('Email', <a href={'mailto:' + e.email} style={{ color: 'var(--blue)' }}>{e.email}</a>, 'The address they applied with. Everything we send goes here, and it is the address their desk is opened against.')}
          {Object.entries(e.details || {}).filter(([, v]) => v !== null && v !== '')
            /* the number has its own card above; repeating it here is noise */
            .filter(([k]) => !(isApp && (k === 'phone' || k === 'bestTime' || k === 'phoneUnparsed')))
            .map(([k, v]) => kv(DETAIL_LABELS[k] || k, String(v), DETAIL_HELP[k]))}
        </Card>

        {/* Labels: what this application is LIKE. Kept apart from the stage,
            which is where it IS — mixing the two is how you end up with a
            stage called "high-volume-reviewing" and can automate neither. */}
        {isApp && <LabelBox enquiry={e} onSaved={load} />}

        {/* Setup used to be its own section in the nav, which made it look
            like a place you go rather than a thing you do with one person.
            It belongs here, on them, and only once they can actually use
            it — an invitation is what makes the link work. */}
        {isApp && e.status === 'invited' && (<Card title="Their setup"
          help="Their sixteen-screen setup, on the link we emailed. There is no staff copy of it — this opens exactly what they are looking at, which is the thing to have in front of you when somebody rings up stuck.">
          <div style={{ fontSize: 13, color: 'var(--mute)', lineHeight: 1.6, marginBottom: 12 }}>
            Theirs to do, on the link we emailed them. This is the same page they are looking at, so
            it is the thing to open when somebody rings up stuck on a screen.
          </div>
          <a href={'/onboarding/' + encodeURIComponent(e.reference)} target="_blank" rel="noopener"
            style={{ ...btn('transparent', 'var(--text)', { fontSize: 12.5 }), textDecoration: 'none', display: 'inline-block' }}>Open their setup page ↗</a>
          {e.isDemo && <button onClick={async () => { await api('/api/admin/walkthrough/reset', { method: 'POST', body: '{}' }).catch(() => {}); load(); setFlash('Walkthrough reset — it starts from the beginning again.'); }}
            style={{ ...btn('transparent', 'var(--mute)', { fontSize: 12.5 }), marginLeft: 8 }}>Start the rehearsal over</button>}
        </Card>)}

        <Card title="Your notes"
          help="Anything the next person needs: what you learned on the call, what you promised, why you held them. The applicant never sees this. It stays on the record after their desk opens.">
          <textarea value={note} onChange={ev => setNote(ev.target.value)} rows={6} placeholder="What you learned on the call, what you promised, anything the next person needs…"
            style={{ width: '100%', padding: 11, borderRadius: 9, border: '1px solid var(--line)', background: 'var(--sidebar)', color: 'var(--text)', fontSize: 13.5, lineHeight: 1.55, resize: 'vertical', outline: 'none', boxSizing: 'border-box' }} />
          <button disabled={busy || note === (e.notes || '')} onClick={() => save({ notes: note }, 'Note saved.')}
            style={{ marginTop: 9, padding: '9px 16px', borderRadius: 9, border: 'none', background: note === (e.notes || '') ? 'var(--line)' : 'var(--text)', color: note === (e.notes || '') ? 'var(--faint)' : '#111', fontWeight: 700, fontSize: 13, cursor: busy || note === (e.notes || '') ? 'default' : 'pointer' }}>Save note</button>
        </Card>
      </div>

      <div style={{ display: 'grid', gap: 16 }}>
        {/* One click per decision. The buttons are the moves the server will
            accept from where this application is, named by what they do, and
            approving is a single press — the code, the email and the link all
            follow from it without a second step. */}
        <Card title="Move this along"
          help="The stages this application can go to from where it is now. The server decides which are legal, so a button here always works. Approving is one press — it moves them to Invited, mints nothing new, and emails their existing code with the setup link.">
          {e.status === 'accepted'
            ? <div style={{ fontSize: 13, color: 'var(--mute)', lineHeight: 1.55 }}>They built their desk — this one is done.</div>
            : (<div>
                <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap' }}>
                  {onward.map(s => (
                    <button key={s.id} disabled={busy} onClick={() => save({ status: s.id }, 'Moved to ' + s.title + '.')}
                      style={btn(s.primary ? 'var(--text)' : 'transparent', s.primary ? '#111' : 'var(--mute)',
                        { fontSize: 12.5, fontWeight: s.primary ? 800 : 600, border: s.primary ? '1px solid transparent' : '1px solid var(--line)' })}>
                      {s.action || s.title}</button>))}
                </div>
                {isApp && <div style={{ fontSize: 12, color: 'var(--faint)', marginTop: 10, lineHeight: 1.5 }}>
                  Approving emails them their reference and the link to set the desk up. Open happens on its own when they finish.
                  {' '}Holding tells them nothing — it is a note to us that they are worth coming back to.
                </div>}
              </div>)}
        </Card>

        {/* The code, while it is live.

            Two different things get confused here. REVOKING is just moving
            them out of Invited — the link stops opening anything the moment
            they are not invited, so it needs no button of its own and the
            one above already does it. ROTATING is the other case: the code
            went somewhere it should not have and they need a different one.
            Say which is which, because guessing wrong is either an angry
            customer or a live code in the wrong hands. */}
        {isApp && e.status === 'invited' && (<Card title="Their code"
          help="The reference they were given when they applied, printed on their charter card and in every email. Holding it is what opens their setup page — so it is a key, and it stops working the moment they are not Invited.">
          <div style={{ fontFamily: MONO, fontSize: 15, fontWeight: 700, letterSpacing: '0.08em', marginBottom: 8 }}>{e.reference}</div>
          <div style={{ fontSize: 12, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
            Live. This opens their setup. Any of the buttons above — back to review, on hold, or declined —
            stops it working straight away, and that is how you take a code back.
          </div>
          <button disabled={busy} onClick={async () => {
            setBusy(true); setFlash('');
            try {
              const r = await api('/api/admin/enquiries/' + e.id + '/rotate', { method: 'POST', body: JSON.stringify({}) });
              setFlash('New code ' + r.reference + '. The old one (' + r.was + ') is dead' + (r.email ? ', and the new one has been emailed.' : '.'));
              await load(); onChanged && onChanged();
            } catch (x) { setFlash((x.body && x.body.detail) || 'Could not issue a new code.'); }
            setBusy(false);
          }} style={btn('transparent', 'var(--text)', { fontSize: 12.5, width: '100%' })}>Issue a different code</button>
          <div style={{ fontSize: 11.5, color: 'var(--faint)', marginTop: 8, lineHeight: 1.5 }}>
            For when this one has been seen by someone it should not have. The old code stops working and they are emailed the new one.
          </div>
        </Card>)}

        <Card title="History"
          help="Received is when the form arrived. First answered is when it first left the unacknowledged stage — automatic now, so it usually matches. Last moved is the most recent stage change and who made it; 'system' means nobody pressed anything.">
          {kv('Received', fmtWhen(e.createdAt))}
          {kv('First answered', e.handledAt ? fmtWhen(e.handledAt) : null)}
          {kv('Last moved', e.decidedAt ? fmtWhen(e.decidedAt) : null)}
          {kv('By', e.decidedBy)}
        </Card>

        {e.tenantName && (<Card title="Became">
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
            <span style={{ fontWeight: 700 }}>{e.tenantName}</span>
            <button onClick={() => goto('#/desks/' + e.tenantId)} style={btn('transparent', 'var(--text)', { fontSize: 12 })}>Open desk</button>
          </div>
        </Card>)}

        {d.alsoFrom.length > 0 && (<Card title={'Also from this address (' + d.alsoFrom.length + ')'}>
          {d.alsoFrom.map(o => (<button key={o.id} onClick={() => goto('#/applications/' + o.id)} style={{ display: 'flex', width: '100%', alignItems: 'center', justifyContent: 'space-between', gap: 10, padding: '8px 0', background: 'none', border: 'none', borderBottom: '1px solid var(--line2)', color: 'var(--text)', cursor: 'pointer', textAlign: 'left' }}>
            <span><span style={{ display: 'block', fontFamily: MONO, fontSize: 12 }}>{o.reference}</span>
              <span style={{ display: 'block', fontSize: 11.5, color: 'var(--faint)' }}>{o.kind === 'early_access' ? 'application' : 'message'} · {fmtDay(o.createdAt)}</span></span>
            <Pill tone={STAGE_TONE[o.status]}>{stageTitle(stages, o.status)}</Pill>
          </button>))}
        </Card>)}
      </div>
    </div>
  </div>);
}

// ===================== APP =====================
function App() {
  const [phase, setPhase] = useState('loading'); // loading | login | ready
  const [tenants, setTenants] = useState([]);
  const [ov, setOv] = useState(null);
  const [audit, setAudit] = useState(null);
  const [route, setRoute] = useState(() => parseHash(window.location.hash));
  useEffect(() => {
    const on = () => setRoute(parseHash(window.location.hash));
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const tab = route.tab;
  const [statusFilter, setStatusFilter] = useState('all');
  const [planFilter, setPlanFilter] = useState('all');
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('joined');
  const [creating, setCreating] = useState(false);
  const [health, setHealth] = useState(null);

  const loadAll = async () => {
    const [t, o] = await Promise.all([api('/api/admin/tenants'), api('/api/admin/overview').catch(() => null)]);
    setTenants(t.tenants); setOv(o);
  };
  const boot = async () => {
    try { const me = await api('/api/admin/me'); if (!me.isAdmin) { setPhase('login'); return; } await loadAll(); setPhase('ready'); }
    catch (x) { setPhase('login'); }
  };
  useEffect(() => { boot(); }, []);
  useEffect(() => { if (tab === 'activity' && !audit) api('/api/admin/audit?limit=150').then(r => setAudit(r.events)).catch(() => setAudit([])); }, [tab]);
  /* Health is checked once on the way in and then every couple of minutes,
     because the point of the light in the corner is that you did not have
     to go and ask. Failure to check is not itself reported as an outage —
     that way lies a panel that cries wolf whenever a request is slow. */
  useEffect(() => {
    if (phase !== 'ready') return;
    let live = true;
    const beat = () => api('/api/admin/health').then(h => { if (live) setHealth(h); }).catch(() => {});
    beat();
    const t = setInterval(beat, 120000);
    return () => { live = false; clearInterval(t); };
  }, [phase]);

  if (phase === 'loading') return <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;
  if (phase === 'login') return <Login onIn={() => { setPhase('loading'); boot(); }} />;

  const counts = {
    desks: tenants.length,
    active: tenants.filter(t => t.status === 'active').length,
    trial: tenants.filter(t => t.status === 'trial').length,
    suspended: tenants.filter(t => t.status === 'suspended').length,
    // what is sitting on somebody — the number worth a badge in the nav
    waiting: ov && ov.funnel ? ov.funnel.waiting : 0,
    unread: ov && ov.funnel ? ov.funnel.unread : 0,
  };
  let rows = tenants.filter(t => (statusFilter === 'all' || t.status === statusFilter) && (planFilter === 'all' || t.plan === planFilter));
  const s = q.trim().toLowerCase();
  if (s) rows = rows.filter(t => [t.name, t.slug, t.owner && t.owner.name, t.owner && t.owner.staffId, t.country].some(v => (v || '').toLowerCase().includes(s)));
  rows = rows.slice().sort((a, b) => {
    if (sort === 'name') return (a.name || '').localeCompare(b.name || '');
    if (sort === 'plan') return (a.plan || '').localeCompare(b.plan || '');
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  const th = { textAlign: 'left', fontSize: 11, color: 'var(--faint)', textTransform: 'uppercase', letterSpacing: '0.04em', padding: '0 16px 10px', fontWeight: 600 };
  const td = { padding: '13px 16px', borderTop: '1px solid var(--line2)', fontSize: 14, verticalAlign: 'middle' };
  const ctrl = { display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 10, fontSize: 13, color: 'var(--mute)' };

  /* The head of every page: its name, what it is for, and the one action
     that belongs to it. Read from the PAGES table rather than written out
     per page, which is what stopped "Start a desk" turning up on Billing. */
  const page = tab === 'settings' ? SETTINGS : PAGE(tab);
  const act = page.action;
  const invoicing = act && act.kind === 'invoice';
  // Stripe is not wired up yet. Say so on the button rather than offering
  // an action that would quietly do nothing.
  const stripeOn = !!(health && (health.checks.find(c => c.id === 'stripe') || {}).state === 'ok');
  const doAction = () => { if (act.kind === 'invite') setCreating(true); else goto('#/billing'); };

  return (<div style={{ display: 'flex', minHeight: '100vh' }}>
    <Sidebar counts={counts} tab={tab} health={health} onSettings={() => goto('#/settings')} />
    <div style={{ flex: 1, minWidth: 0, height: '100vh', overflow: 'auto', padding: '24px 30px' }}>
      {!route.id && <div style={{ marginBottom: 20 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <h1 style={{ fontSize: 24, fontWeight: 800, margin: 0 }}>{page.title}</h1>
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 9 }}>
            {act && (<button onClick={doAction} disabled={invoicing && !stripeOn}
              title={invoicing && !stripeOn ? 'Connect Stripe first — there is nothing to invoice through yet.' : ''}
              style={{ padding: '9px 15px', border: 'none', borderRadius: 10, fontWeight: 700, fontSize: 13,
                background: invoicing && !stripeOn ? 'var(--line)' : 'var(--text)', color: invoicing && !stripeOn ? 'var(--faint)' : '#111',
                cursor: invoicing && !stripeOn ? 'not-allowed' : 'pointer' }}>{act.label}</button>)}
          </div>
        </div>
        {page.blurb && <p style={{ color: 'var(--mute)', fontSize: 13.5, margin: '8px 0 0', maxWidth: 680, lineHeight: 1.55 }}>{page.blurb}</p>}
      </div>}

      {!route.id && tab === 'overview' && <OverviewPage ov={ov} health={health} counts={counts} />}
      {!route.id && tab === 'comms' && <CommsPage />}
      {!route.id && tab === 'billing' && <BillingPage />}
      {!route.id && tab === 'settings' && <SettingsPage />}

      {route.id && (tab === 'desks'
        ? <DeskPage id={route.id} onChanged={loadAll} />
        : tab === 'people'
        ? <PersonPage id={route.id} onChanged={loadAll} />
        : <ApplicationPage id={route.id} onChanged={loadAll} />)}

      {!route.id && tab === 'desks' && (<div>
        <StatRow ov={ov} />
        {/* The filters live with the list they filter. They used to be in
            the sidebar, which put a desk status filter on the billing page
            and on settings, where it did nothing at all. */}
        <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search desks, owners, email…" style={{ flex: 1, minWidth: 220, padding: '9px 14px', background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 10, color: 'var(--text)', fontSize: 13.5, outline: 'none' }} />
          <label style={ctrl}>Status <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{ background: 'transparent', border: 'none', color: 'var(--text)', fontSize: 13, outline: 'none', cursor: 'pointer' }}>
            <option value="all">All ({counts.desks})</option><option value="active">Active ({counts.active})</option><option value="trial">Trial ({counts.trial})</option><option value="suspended">Suspended ({counts.suspended})</option></select></label>
          <label style={ctrl}>Plan <select value={planFilter} onChange={e => setPlanFilter(e.target.value)} style={{ background: 'transparent', border: 'none', color: 'var(--text)', fontSize: 13, outline: 'none', cursor: 'pointer' }}>
            <option value="all">All plans</option><option value="basic">Basic</option><option value="pro">Pro</option><option value="premium">Premium</option></select></label>
          <label style={ctrl}>Sort <select value={sort} onChange={e => setSort(e.target.value)} style={{ background: 'transparent', border: 'none', color: 'var(--text)', fontSize: 13, outline: 'none', cursor: 'pointer' }}><option value="joined">Newest</option><option value="name">Name</option><option value="plan">Plan</option></select></label>
        </div>
        <div style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14, overflow: 'hidden' }}>
          <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 720 }}>
            <thead><tr>
              <th style={{ ...th, paddingTop: 14 }}>Desk</th><th style={th}>Status</th><th style={th}>Plan</th><th style={th}>Owner</th><th style={th}>People</th><th style={th}>Country</th><th style={th}>Joined</th>
            </tr></thead>
            <tbody>
              {rows.map(t => (<tr key={t.id} onClick={() => goto('#/desks/' + t.id)} style={{ cursor: 'pointer' }} onMouseEnter={e => e.currentTarget.style.background = 'var(--hover)'} onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <td style={td}><div style={{ fontWeight: 600 }}>{t.name}</div><div style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)' }}>{t.slug}</div></td>
                <td style={td}><Pill tone={STATUS_TONE[t.status]} dot>{t.status}</Pill></td>
                <td style={td}><Pill tone={PLAN_TONE[t.plan]}>{t.plan}</Pill></td>
                <td style={td}>{t.owner ? <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Avatar name={t.owner.name} /><span><span style={{ display: 'block' }}>{t.owner.name}</span><span style={{ display: 'block', fontFamily: MONO, fontSize: 11, color: 'var(--faint)' }}>{t.owner.staffId}</span></span></span> : <span style={{ color: 'var(--faint)' }}>—</span>}</td>
                <td style={{ ...td, fontFamily: MONO, color: 'var(--mute)' }}>{t.staffCount}</td>
                <td style={{ ...td, color: 'var(--mute)' }}>{t.country || '—'}</td>
                <td style={{ ...td, fontFamily: MONO, fontSize: 12.5, color: 'var(--mute)' }}>{fmtDay(t.createdAt)}</td>
              </tr>))}
              {rows.length === 0 && <tr><td colSpan={7} style={{ ...td, textAlign: 'center', color: 'var(--faint)', padding: 40 }}>No desks match.</td></tr>}
            </tbody>
          </table>
          </div>
        </div>
      </div>)}

      {!route.id && tab === 'applications' && <Pipeline kind="early_access" onCounts={() => loadAll()} />}

      {!route.id && tab === 'inbox' && <Inbox onChanged={loadAll} />}

      {!route.id && tab === 'activity' && (<div style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14, padding: '4px 16px' }}>
        {!audit && <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>}
        {audit && audit.map(e => (<div key={e.id} style={{ display: 'flex', gap: 14, alignItems: 'baseline', padding: '11px 0', borderBottom: '1px solid var(--line2)' }}>
          <span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)', width: 130, flex: 'none' }}>{fmtWhen(e.at)}</span>
          <span style={{ fontFamily: MONO, fontSize: 12.5, fontWeight: 700, width: 190, flex: 'none', color: e.action.indexOf('deleted') >= 0 || e.action.indexOf('suspend') >= 0 ? 'var(--amber)' : 'var(--text)' }}>{e.action}</span>
          <span style={{ fontSize: 13, flex: 1 }}>{e.tenantName}{e.actorId && <span style={{ color: 'var(--faint)' }}> · {e.actorId}</span>}</span>
        </div>))}
        {audit && audit.length === 0 && <div style={{ padding: 20, color: 'var(--faint)' }}>No activity yet.</div>}
      </div>)}
    </div>
    {creating && <CreateModal onClose={() => setCreating(false)} onCreated={loadAll} />}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

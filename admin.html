<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CurrencyDesk — Control</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0a0a0b; --panel:#141416; --card:#161618; --sidebar:#0c0c0d; --hover:rgba(255,255,255,0.045);
    --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.055);
    --text:#ececee; --mute:#8b8b93; --faint:#5c5c64;
    --green:#34d399; --amber:#f5b544; --red:#f87171; --purple:#a78bfa; --blue:#60a5fa; --accent:#f5c542;
    --f:'Archivo',system-ui,sans-serif; --m:'Space Mono',monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:var(--f); color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; }
  #root { height:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.09); border-radius:8px; border:2px solid var(--bg); }
  button { font-family:inherit; }
  input, select { font-family:inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const MONO = "var(--m)";

// ---- helpers ----
const api = async (path, opts) => {
  const r = await fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'content-type': 'application/json' } }, opts || {}));
  const body = await r.json().catch(() => null);
  if (!r.ok) throw { status: r.status, body };
  return body;
};
const initialsOf = (n) => (n || '?').split(/[ .@]+/).filter(Boolean).map(x => x[0]).join('').slice(0, 2).toUpperCase();
const hueOf = (s) => { let h = 0; for (let i = 0; i < (s || '').length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; };
const fmtDay = (s) => { try { return new Date(s).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return s; } };
const fmtWhen = (s) => { try { return new Date(s).toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }); } catch (e) { return s; } };
const PLAN_TONE = { trial: 'amber', basic: 'mute', pro: 'green', premium: 'purple' };
const STATUS_TONE = { active: 'green', trial: 'amber', suspended: 'red' };
const toneColor = (t) => ({ green: 'var(--green)', amber: 'var(--amber)', red: 'var(--red)', purple: 'var(--purple)', blue: 'var(--blue)', mute: 'var(--mute)' }[t] || 'var(--mute)');

function Mark({ w = 26 }) {
  const h = w * 0.7;
  return (<svg viewBox="0 0 200 140" width={w} height={h} style={{ display: 'block' }}>
    <mask id="cdm"><rect width="200" height="140" fill="#fff" /><rect x="60" y="64.5" width="92" height="11" fill="#000" /></mask>
    <g mask="url(#cdm)"><circle cx="60" cy="70" r="48" fill="#fff" /><path d="M116,22 H136 A48,48 0 0 1 136,118 H116 Z" fill="#fff" /></g>
    <circle cx="112" cy="70" r="6.5" fill="var(--green)" />
  </svg>);
}
function Avatar({ name, size = 26 }) {
  const hue = hueOf(name);
  return <span style={{ width: size, height: size, borderRadius: '50%', flex: 'none', display: 'grid', placeItems: 'center',
    fontSize: size * 0.4, fontWeight: 700, color: '#fff', background: 'hsl(' + hue + ',42%,42%)' }}>{initialsOf(name)}</span>;
}
function Pill({ tone, dot, children }) {
  const c = toneColor(tone);
  return (<span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11.5, fontWeight: 600, color: c,
    background: 'color-mix(in srgb,' + c + ' 15%, transparent)', border: '1px solid color-mix(in srgb,' + c + ' 30%, transparent)', borderRadius: 7, padding: '3px 9px', whiteSpace: 'nowrap', textTransform: 'capitalize' }}>
    {dot && <span style={{ width: 6, height: 6, borderRadius: '50%', background: c }} />}{children}</span>);
}
const dot = (c) => <span style={{ width: 8, height: 8, borderRadius: '50%', background: c, flex: 'none' }} />;

// ===================== LOGIN =====================
function Login({ onIn }) {
  const [step, setStep] = useState('pw');   // pw | code
  const [email, setEmail] = useState(''); const [pw, setPw] = useState(''); const [code, setCode] = useState('');
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false); const [masked, setMasked] = useState('');
  const submitPw = async (e) => {
    e.preventDefault(); setErr(''); setBusy(true);
    try {
      const d = await api('/api/auth/login/start', { method: 'POST', body: JSON.stringify({ staffId: email.trim().toLowerCase(), password: pw }) });
      if (d.needsCode) { setMasked(d.maskedEmail || ''); setStep('code'); setBusy(false); }
      else { await afterAuth(); }
    } catch (x) { setBusy(false); setErr(x.status === 401 ? 'Wrong email or password.' : x.status === 403 ? 'That desk is suspended.' : 'Sign-in error — try again.'); }
  };
  const submitCode = async (e) => {
    e.preventDefault(); setErr(''); setBusy(true);
    try { await api('/api/auth/login/verify', { method: 'POST', body: JSON.stringify({ staffId: email.trim().toLowerCase(), code: code.trim() }) }); await afterAuth(); }
    catch (x) { setBusy(false); setErr(x.status === 401 ? 'That code isn’t right.' : 'Verification error — try again.'); }
  };
  const afterAuth = async () => {
    try { const me = await api('/api/admin/me'); if (me.isAdmin) { onIn(); return; } setBusy(false); setErr('This account isn’t a platform admin.'); }
    catch (x) { setBusy(false); setErr('Signed in, but not authorized here.'); }
  };
  const inSty = { width: '100%', padding: '11px 13px', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 10, color: 'var(--text)', fontSize: 14, outline: 'none' };
  const btn = { width: '100%', padding: '11px', background: 'var(--text)', color: '#111', border: 'none', borderRadius: 10, fontWeight: 700, fontSize: 13.5, cursor: 'pointer', marginTop: 4 };
  return (<div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24 }}>
    <div style={{ width: 380, maxWidth: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, justifyContent: 'center', marginBottom: 22 }}>
        <Mark w={30} /><span style={{ fontWeight: 800, fontSize: 20 }}>CurrencyDesk</span>
        <span style={{ fontFamily: MONO, fontSize: 9, letterSpacing: '0.16em', color: 'var(--faint)', border: '1px solid var(--line)', borderRadius: 6, padding: '3px 7px' }}>CONTROL</span>
      </div>
      <div style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 16, padding: '26px 26px' }}>
        <h1 style={{ fontSize: 18, fontWeight: 800, margin: '0 0 4px' }}>{step === 'pw' ? 'Sign in' : 'Check your email'}</h1>
        <p style={{ fontSize: 13, color: 'var(--mute)', margin: '0 0 18px' }}>{step === 'pw' ? 'Platform admin access only.' : 'We sent a 6-digit code to ' + masked + '.'}</p>
        {step === 'pw' ? (
          <form onSubmit={submitPw} style={{ display: 'grid', gap: 11 }}>
            <input style={inSty} type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@currencydeskos.com" autoFocus autoComplete="username" />
            <input style={inSty} type="password" value={pw} onChange={e => setPw(e.target.value)} placeholder="Password" autoComplete="current-password" />
            {err && <div style={{ color: 'var(--red)', fontSize: 12.5 }}>{err}</div>}
            <button style={{ ...btn, opacity: busy ? 0.6 : 1 }} disabled={busy}>{busy ? 'Checking…' : 'Continue'}</button>
          </form>
        ) : (
          <form onSubmit={submitCode} style={{ display: 'grid', gap: 11 }}>
            <input style={{ ...inSty, textAlign: 'center', fontFamily: MONO, fontSize: 20, letterSpacing: '0.3em' }} value={code} onChange={e => setCode(e.target.value.replace(/[^0-9]/g, '').slice(0, 6))} placeholder="000000" inputMode="numeric" autoFocus />
            {err && <div style={{ color: 'var(--red)', fontSize: 12.5 }}>{err}</div>}
            <button style={{ ...btn, opacity: busy ? 0.6 : 1 }} disabled={busy}>{busy ? 'Verifying…' : 'Verify & enter'}</button>
            <button type="button" onClick={() => { setStep('pw'); setCode(''); setErr(''); }} style={{ background: 'none', border: 'none', color: 'var(--mute)', fontSize: 12.5, cursor: 'pointer' }}>← Back</button>
          </form>
        )}
      </div>
    </div>
  </div>);
}

// ===================== SIDEBAR =====================
function Sidebar({ counts, statusFilter, setStatusFilter, planFilter, setPlanFilter, tab, setTab, onCreate }) {
  const navItem = (id, label, count) => (
    <button onClick={() => setTab(id)} style={{ display: 'flex', alignItems: 'center', gap: 11, width: '100%', textAlign: 'left', padding: '9px 11px', borderRadius: 9,
      border: 'none', cursor: 'pointer', background: tab === id ? 'var(--hover)' : 'transparent', color: tab === id ? 'var(--text)' : 'var(--mute)', fontSize: 14, fontWeight: tab === id ? 600 : 500 }}>
      <span style={{ flex: 1 }}>{label}</span>{count != null && <span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)' }}>{count}</span>}
    </button>
  );
  const section = (t) => <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: '0.14em', color: 'var(--faint)', margin: '20px 11px 8px', textTransform: 'uppercase' }}>{t}</div>;
  const filterRow = (label, c, active, onClick, n) => (
    <button onClick={onClick} style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', textAlign: 'left', padding: '7px 11px', borderRadius: 8, border: 'none', cursor: 'pointer', background: active ? 'var(--hover)' : 'transparent', color: active ? 'var(--text)' : 'var(--mute)', fontSize: 13 }}>
      {dot(c)}<span style={{ flex: 1, textTransform: 'capitalize' }}>{label}</span>{n != null && <span style={{ fontFamily: MONO, fontSize: 11, color: 'var(--faint)' }}>{n}</span>}
    </button>
  );
  return (<div style={{ width: 248, flex: 'none', background: 'var(--sidebar)', borderRight: '1px solid var(--line)', height: '100vh', overflow: 'auto', padding: '18px 12px', display: 'flex', flexDirection: 'column' }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '4px 8px 16px' }}>
      <span style={{ width: 34, height: 34, borderRadius: 9, background: '#1c1c20', display: 'grid', placeItems: 'center', flex: 'none' }}><Mark w={20} /></span>
      <span><span style={{ display: 'block', fontWeight: 700, fontSize: 14.5 }}>CurrencyDesk</span><span style={{ display: 'block', fontSize: 12, color: 'var(--mute)' }}>Platform control</span></span>
    </div>
    {navItem('desks', 'Desks', counts.desks)}
    {navItem('applications', 'Early access', counts.waiting || null)}
    {navItem('onboarding', 'Onboarding', null)}
    {navItem('messages', 'Messages', counts.unread || null)}
    {navItem('activity', 'Activity', null)}
    <button onClick={onCreate} style={{ display: 'flex', alignItems: 'center', gap: 9, width: '100%', textAlign: 'left', padding: '9px 11px', borderRadius: 9, border: '1px solid var(--line)', cursor: 'pointer', background: 'transparent', color: 'var(--mute)', fontSize: 13.5, marginTop: 6 }}>
      <span style={{ fontSize: 15, lineHeight: 1 }}>＋</span> New desk
    </button>
    {section('Status')}
    {filterRow('All', 'var(--mute)', statusFilter === 'all', () => setStatusFilter('all'), counts.desks)}
    {filterRow('Active', 'var(--green)', statusFilter === 'active', () => setStatusFilter('active'), counts.active)}
    {filterRow('Trial', 'var(--amber)', statusFilter === 'trial', () => setStatusFilter('trial'), counts.trial)}
    {filterRow('Suspended', 'var(--red)', statusFilter === 'suspended', () => setStatusFilter('suspended'), counts.suspended)}
    {section('Plans')}
    {filterRow('All plans', 'var(--mute)', planFilter === 'all', () => setPlanFilter('all'))}
    {filterRow('Basic', 'var(--mute)', planFilter === 'basic', () => setPlanFilter('basic'))}
    {filterRow('Pro', 'var(--green)', planFilter === 'pro', () => setPlanFilter('pro'))}
    {filterRow('Premium', 'var(--purple)', planFilter === 'premium', () => setPlanFilter('premium'))}
    <div style={{ flex: 1 }} />
    <a href="/" style={{ display: 'block', padding: '9px 11px', color: 'var(--faint)', fontSize: 12.5, textDecoration: 'none' }}>← Back to the OS</a>
  </div>);
}

// ===================== STAT ROW =====================
function StatRow({ ov }) {
  if (!ov) return null;
  const tiles = [
    { k: 'Desks', v: ov.totals.desks, c: 'var(--text)' },
    { k: 'Active', v: ov.byStatus.active, c: 'var(--green)' },
    { k: 'On trial', v: ov.byStatus.trial, c: 'var(--amber)' },
    { k: 'Suspended', v: ov.byStatus.suspended, c: 'var(--red)' },
    { k: 'New · 7 days', v: ov.totals.recent7, c: 'var(--blue)' },
    { k: 'People', v: ov.totals.people, c: 'var(--purple)' },
  ];
  return (<div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(120px,1fr))', gap: 10, marginBottom: 18 }}>
    {tiles.map(t => (<div key={t.k} style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 12, padding: '13px 15px' }}>
      <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: '0.08em', color: 'var(--mute)', textTransform: 'uppercase', marginBottom: 5 }}>{t.k}</div>
      <div style={{ fontSize: 25, fontWeight: 800, color: t.c, lineHeight: 1 }}>{t.v}</div>
    </div>))}
  </div>);
}

// ===================== CREATE MODAL =====================
function CreateModal({ onClose, onCreated }) {
  const [f, setF] = useState({ businessName: '', ownerName: '', ownerEmail: '', slug: '', plan: 'trial', password: '' });
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const set = (k, v) => setF(s => Object.assign({}, s, { [k]: k === 'slug' ? v.toLowerCase().replace(/[^a-z0-9-]/g, '') : v }));
  const submit = async (e) => {
    e.preventDefault(); setBusy(true); setErr('');
    try { await api('/api/admin/tenants', { method: 'POST', body: JSON.stringify(f) }); onCreated(); onClose(); }
    catch (x) { setBusy(false); setErr((x.body && x.body.detail) || 'Could not create'); }
  };
  const inSty = { width: '100%', padding: '10px 12px', background: 'var(--bg)', border: '1px solid var(--line)', borderRadius: 9, color: 'var(--text)', fontSize: 13.5, outline: 'none' };
  const lbl = { fontSize: 11.5, color: 'var(--mute)', marginBottom: 5, display: 'block' };
  return (<div style={{ position: 'fixed', inset: 0, zIndex: 60, display: 'grid', placeItems: 'center', padding: 20, background: 'rgba(0,0,0,0.55)' }} onClick={onClose}>
    <form onClick={e => e.stopPropagation()} onSubmit={submit} style={{ width: 440, maxWidth: '100%', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 16, padding: '22px 24px', display: 'grid', gap: 12 }}>
      <div style={{ fontSize: 17, fontWeight: 800 }}>Create a desk directly</div>
      {/* There are two ways to open a desk and they are not interchangeable.
          This one is the shortcut: it skips onboarding entirely, so none of
          the things the flow asks — spreads, float, compliance officer, team,
          plan — are ever collected. Say so, rather than letting somebody pick
          it by accident because it was the button on the screen. */}
      <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.5 }}>
        This skips onboarding. The desk opens with a temporary password and none of
        the setup — no spreads, float, compliance officer or team. For a real
        customer, invite them from <b style={{ color: 'var(--text)' }}>Early access</b> and
        use <b style={{ color: 'var(--text)' }}>Onboarding</b> instead.
      </div>
      <div><span style={lbl}>Business name</span><input style={inSty} value={f.businessName} onChange={e => set('businessName', e.target.value)} placeholder="Maple Currency Exchange" autoFocus /></div>
      <div style={{ display: 'flex', gap: 10 }}>
        <div style={{ flex: 1 }}><span style={lbl}>Owner name</span><input style={inSty} value={f.ownerName} onChange={e => set('ownerName', e.target.value)} placeholder="Dana Kim" /></div>
        <div style={{ flex: 1 }}><span style={lbl}>Desk address</span><input style={{ ...inSty, fontFamily: MONO }} value={f.slug} onChange={e => set('slug', e.target.value)} placeholder="maplefx" /></div>
      </div>
      <div><span style={lbl}>Owner email</span><input style={inSty} type="email" value={f.ownerEmail} onChange={e => set('ownerEmail', e.target.value)} placeholder="owner@business.com" /></div>
      <div style={{ display: 'flex', gap: 10 }}>
        <div style={{ flex: 1 }}><span style={lbl}>Plan</span><select style={inSty} value={f.plan} onChange={e => set('plan', e.target.value)}><option value="trial">Trial</option><option value="basic">Basic</option><option value="pro">Pro</option><option value="premium">Premium</option></select></div>
        <div style={{ flex: 1 }}><span style={lbl}>Temp password</span><input style={inSty} value={f.password} onChange={e => set('password', e.target.value)} placeholder="8+ characters" /></div>
      </div>
      <div style={{ fontSize: 11.5, color: 'var(--faint)' }}>The owner must change this password on first sign-in.</div>
      {err && <div style={{ color: 'var(--red)', fontSize: 12.5 }}>{err}</div>}
      <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
        <button type="button" onClick={onClose} style={{ flex: 1, padding: '10px', borderRadius: 9, border: '1px solid var(--line)', background: 'transparent', color: 'var(--mute)', cursor: 'pointer', fontWeight: 600 }}>Cancel</button>
        <button style={{ flex: 2, padding: '10px', borderRadius: 9, border: 'none', background: 'var(--text)', color: '#111', cursor: 'pointer', fontWeight: 700, opacity: busy ? 0.6 : 1 }} disabled={busy}>{busy ? 'Creating…' : 'Create desk'}</button>
      </div>
    </form>
  </div>);
}

// ===================== PIPELINE =====================
// Everything the public site sends us. An application is not a message in an
// inbox — it is a thing somebody works — so this reads as a pipeline: what
// stage each one is at, what the applicant told us, and what it became.
const TAB_TITLE = { desks: 'Desks', applications: 'Early access', onboarding: 'Onboarding', messages: 'Messages', activity: 'Activity' };
const STAGE_TONE = { new: 'blue', reviewing: 'amber', invited: 'purple', accepted: 'green', declined: 'mute' };
const STAGES = ['new', 'reviewing', 'invited', 'accepted', 'declined'];
// stages an operator can set; "accepted" is what a created desk means
const SETTABLE = ['new', 'reviewing', 'invited', 'declined'];
const DETAIL_LABELS = {
  workspace: 'Workspace', website: 'Website', jurisdiction: 'Jurisdiction', role: 'Their role',
  employees: 'Team size', monthlyVolume: 'Monthly volume', branches: 'Locations',
  runningOn: 'Running on today', timeline: 'Wants to be live', topic: 'About', shop: 'Shop',
  city: 'City', message: 'Message', newsletter: 'Wants updates',
};

function Pipeline({ kind, title, blurb, onCounts }) {
  const [rows, setRows] = useState(null);
  const [stage, setStage] = useState('all');

  const load = async () => {
    const r = await api('/api/admin/enquiries?kind=' + kind).catch(() => ({ enquiries: [] }));
    setRows(r.enquiries);
    if (onCounts) onCounts(r.enquiries);
  };
  useEffect(() => { load(); }, [kind]);

  if (!rows) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;

  const counts = STAGES.reduce((a, s) => (a[s] = rows.filter(r => r.status === s).length, a), {});
  const shown = stage === 'all' ? rows : rows.filter(r => r.status === stage);
  const th = { textAlign: 'left', fontSize: 11, color: 'var(--faint)', textTransform: 'uppercase', letterSpacing: '0.04em', padding: '0 16px 10px', fontWeight: 600 };
  const td = { padding: '13px 16px', borderTop: '1px solid var(--line2)', fontSize: 14, verticalAlign: 'middle' };
  const chip = (id, label, n) => (
    <button key={id} onClick={() => setStage(id)} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '7px 13px', borderRadius: 9, cursor: 'pointer', fontSize: 13, fontWeight: stage === id ? 700 : 500,
      border: '1px solid ' + (stage === id ? 'var(--text)' : 'var(--line)'), background: stage === id ? 'var(--hover)' : 'var(--card)', color: stage === id ? 'var(--text)' : 'var(--mute)', textTransform: 'capitalize' }}>
      {label}<span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)' }}>{n}</span>
    </button>
  );

  return (<div>
    <p style={{ color: 'var(--mute)', fontSize: 13.5, margin: '0 0 16px', maxWidth: 640 }}>{blurb}</p>
    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 16 }}>
      {chip('all', 'Everything', rows.length)}
      {STAGES.map(s => chip(s, s, counts[s]))}
    </div>

    <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
      <div style={{ flex: 1, minWidth: 0, background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14, overflow: 'hidden' }}>
        <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 640 }}>
          <thead><tr>
            <th style={{ ...th, paddingTop: 14 }}>{kind === 'early_access' ? 'Applicant' : 'From'}</th>
            <th style={th}>Stage</th><th style={th}>{kind === 'early_access' ? 'Wants' : 'About'}</th><th style={th}>Became</th><th style={th}>Received</th>
          </tr></thead>
          <tbody>
            {shown.map(r => (<tr key={r.id} onClick={() => goto('#/' + (kind === 'early_access' ? 'applications' : 'messages') + '/' + r.id)} style={{ cursor: 'pointer' }}>
              <td style={td}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Avatar name={r.name || r.email} />
                  <span><span style={{ display: 'block', fontWeight: 600 }}>{r.name || '—'}</span>
                  <span style={{ display: 'block', fontFamily: MONO, fontSize: 11, color: 'var(--faint)' }}>{r.email}</span></span></span>
              </td>
              <td style={td}><Pill tone={STAGE_TONE[r.status]} dot>{r.status}</Pill></td>
              <td style={{ ...td, color: 'var(--mute)', fontSize: 13 }}>{(r.details && (r.details.workspace || r.details.topic)) || '—'}</td>
              <td style={td}>{r.tenantName ? <Pill tone="green">{r.tenantName}</Pill> : <span style={{ color: 'var(--faint)' }}>—</span>}</td>
              <td style={{ ...td, fontFamily: MONO, fontSize: 12.5, color: 'var(--mute)' }}>{fmtDay(r.createdAt)}</td>
            </tr>))}
            {shown.length === 0 && <tr><td colSpan={5} style={{ ...td, textAlign: 'center', color: 'var(--faint)', padding: 40 }}>
              {rows.length === 0 ? 'Nothing has come in yet.' : 'Nothing at this stage.'}</td></tr>}
          </tbody>
        </table>
        </div>
      </div>

    </div>
  </div>);
}

// ===================== SHARED PAGE FURNITURE =====================
const money = (n, ccy) => {
  const v = Number(n) || 0;
  const s = v.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return ccy ? s + ' ' + ccy : s;
};
const K = (n) => { const v = Number(n) || 0; return v >= 1000000 ? (v / 1000000).toFixed(1) + 'M' : v >= 1000 ? Math.round(v / 1000) + 'k' : String(v); };
const goto = (h) => { window.location.hash = h; };
/* Records get their own URL. #/desks/tnt-x and #/applications/<id> are pages
   you can bookmark, reload and paste to someone — which a drawer never was. */
function parseHash(h) {
  const parts = String(h || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  const tab = parts[0] || 'desks';
  const known = ['desks', 'applications', 'messages', 'activity', 'people', 'onboarding'];
  return { tab: known.indexOf(tab) >= 0 ? tab : 'desks', id: parts[1] ? decodeURIComponent(parts[1]) : null };
}

function PageHead({ back, backTo, title, sub, pills, actions }) {
  return (<div style={{ marginBottom: 22 }}>
    <button onClick={() => goto(backTo)} style={{ background: 'none', border: 'none', color: 'var(--mute)', cursor: 'pointer', fontSize: 13, padding: 0, marginBottom: 12 }}>← {back}</button>
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
      <h1 style={{ fontSize: 26, fontWeight: 800, margin: 0 }}>{title}</h1>
      {pills}
      <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>{actions}</div>
    </div>
    {sub && <div style={{ fontFamily: MONO, fontSize: 12, color: 'var(--faint)', marginTop: 6 }}>{sub}</div>}
  </div>);
}
function Card({ title, children, pad = 16 }) {
  return (<div style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14, overflow: 'hidden' }}>
    {title && <div style={{ padding: '13px 16px', borderBottom: '1px solid var(--line2)', fontFamily: MONO, fontSize: 10, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--faint)' }}>{title}</div>}
    <div style={{ padding: pad }}>{children}</div>
  </div>);
}
function Tiles({ items }) {
  return (<div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(140px,1fr))', gap: 10, marginBottom: 18 }}>
    {items.map(t => (<div key={t.k} style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 12, padding: '13px 15px' }}>
      <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--faint)' }}>{t.k}</div>
      <div style={{ fontSize: 22, fontWeight: 800, marginTop: 5, color: t.c || 'var(--text)' }}>{t.v}</div>
      {t.sub && <div style={{ fontSize: 11.5, color: 'var(--mute)', marginTop: 2 }}>{t.sub}</div>}
    </div>))}
  </div>);
}
const kv = (k, v) => v == null || v === '' ? null : (
  <div key={k} style={{ display: 'flex', justifyContent: 'space-between', gap: 14, padding: '8px 0', borderBottom: '1px solid var(--line2)', fontSize: 13 }}>
    <span style={{ color: 'var(--mute)', flex: 'none' }}>{k}</span><span style={{ fontWeight: 600, textAlign: 'right', wordBreak: 'break-word' }}>{v}</span></div>);

// ===================== DESK PAGE =====================
// The page you open when a customer rings. Who they are, how the desk is
// doing, what they last did, and the levers — on one screen.
function DeskPage({ id, onChanged }) {
  const [d, setD] = useState(null); const [err, setErr] = useState(''); const [busy, setBusy] = useState('');
  const [confirmName, setConfirmName] = useState(''); const [ack, setAck] = useState(false);
  const load = () => { api('/api/admin/tenants/' + encodeURIComponent(id)).then(setD).catch(() => setErr('Could not load this desk.')); };
  useEffect(() => { setD(null); setErr(''); load(); }, [id]);

  if (err) return <div style={{ color: 'var(--red)', padding: 20 }}>{err}</div>;
  if (!d) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;

  const t = d.tenant, setup = t.setup || {}, le = d.legalEntities[0] || {};
  const owner = d.staff.find(s => s.role === 'administrator');
  const suspended = t.suspended, book = d.book || {}, ds = d.deskSettings || {};
  const act = async (fn, label) => { setBusy(label); setErr(''); try { await fn(); onChanged && onChanged(); load(); } catch (x) { setErr((x.body && x.body.detail) || 'Action failed'); } setBusy(''); };
  const btn = (bg, col, extra) => Object.assign({ padding: '9px 14px', borderRadius: 9, border: '1px solid var(--line)', background: bg, color: col, fontSize: 13, fontWeight: 600, cursor: 'pointer' }, extra || {});
  const td = { padding: '11px 14px', borderTop: '1px solid var(--line2)', fontSize: 13, verticalAlign: 'middle' };
  const th = { textAlign: 'left', fontSize: 10, color: 'var(--faint)', textTransform: 'uppercase', letterSpacing: '0.08em', padding: '0 14px 9px', fontWeight: 600, fontFamily: MONO };

  return (<div>
    <PageHead back="All desks" backTo="#/desks" title={t.name}
      sub={t.slug + '  ·  ' + t.id + '  ·  joined ' + fmtDay(t.createdAt)}
      pills={<><Pill tone={suspended ? 'red' : (t.plan === 'trial' ? 'amber' : 'green')} dot>{suspended ? 'Suspended' : (t.plan === 'trial' ? 'Trial' : 'Active')}</Pill><Pill tone={PLAN_TONE[t.plan]}>{t.plan}</Pill></>}
      actions={<>
        {owner && <a href={'mailto:' + owner.staffId} style={{ ...btn('transparent', 'var(--text)'), textDecoration: 'none' }}>Email owner</a>}
        <button onClick={() => act(() => api('/api/admin/tenants/' + id, { method: 'PATCH', body: JSON.stringify({ suspended: !suspended }) }), 'suspend')} disabled={busy === 'suspend'}
          style={btn(suspended ? 'color-mix(in srgb,var(--green) 14%,transparent)' : 'color-mix(in srgb,var(--amber) 14%,transparent)', suspended ? 'var(--green)' : 'var(--amber)')}>
          {busy === 'suspend' ? '…' : suspended ? 'Unblock' : 'Block'}</button>
      </>} />

    <Tiles items={[
      { k: 'Transactions', v: book.transactions || 0 },
      { k: 'Volume in', v: '$' + K(book.volumeCad), sub: 'CAD, all time' },
      { k: 'Fees earned', v: '$' + K(book.feesCad), c: 'var(--green)' },
      { k: 'Clients', v: book.clients || 0 },
      { k: 'People', v: d.staff.length },
      { k: 'Last trade', v: book.lastTradeAt ? String(book.lastTradeAt).slice(0, 10) : '—', c: book.lastTradeAt ? 'var(--text)' : 'var(--faint)' },
    ]} />

    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.7fr) minmax(280px,1fr)', gap: 16, alignItems: 'start' }}>
      <div style={{ display: 'grid', gap: 16 }}>
        <div style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14, overflow: 'hidden' }}>
          <div style={{ padding: '13px 16px', borderBottom: '1px solid var(--line2)', fontFamily: MONO, fontSize: 10, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--faint)' }}>Last five transactions</div>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 560 }}>
              <thead><tr><th style={{ ...th, paddingTop: 13 }}>Ref</th><th style={th}>When</th><th style={th}>Type</th><th style={th}>In</th><th style={th}>Out</th><th style={th}>Fee</th><th style={th}>Teller</th></tr></thead>
              <tbody>
                {(d.recentTransactions || []).map((r, i) => (<tr key={r.ref || i}>
                  <td style={{ ...td, fontFamily: MONO, fontSize: 12 }}>{r.ref || '—'}</td>
                  <td style={{ ...td, color: 'var(--mute)', fontFamily: MONO, fontSize: 12 }}>{r.date} {r.time}</td>
                  <td style={{ ...td, color: 'var(--mute)' }}>{r.type || '—'}</td>
                  <td style={td}>{money(r.inAmt, r.inCcy)}</td>
                  <td style={{ ...td, color: 'var(--green)' }}>{money(r.outAmt, r.outCcy)}</td>
                  <td style={{ ...td, fontFamily: MONO, fontSize: 12 }}>{money(r.fee)}</td>
                  <td style={{ ...td, color: 'var(--mute)' }}>{r.teller || '—'}</td>
                </tr>))}
                {(!d.recentTransactions || d.recentTransactions.length === 0) &&
                  <tr><td colSpan={7} style={{ ...td, textAlign: 'center', color: 'var(--faint)', padding: 34 }}>This desk hasn't written a ticket yet.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>

        <Card title={'Recent activity'} pad={0}>
          <div style={{ padding: '4px 16px', maxHeight: 320, overflow: 'auto' }}>
            {d.audit.slice(0, 20).map(e => (<div key={e.id} style={{ display: 'flex', gap: 12, alignItems: 'baseline', padding: '9px 0', borderBottom: '1px solid var(--line2)' }}>
              <span style={{ fontFamily: MONO, fontSize: 11, color: 'var(--faint)', width: 120, flex: 'none' }}>{fmtWhen(e.at)}</span>
              <span style={{ fontFamily: MONO, fontSize: 12, fontWeight: 700, flex: 1 }}>{e.action}</span>
              <span style={{ fontSize: 12, color: 'var(--mute)' }}>{e.actorId}</span>
            </div>))}
            {d.audit.length === 0 && <div style={{ padding: 20, color: 'var(--faint)' }}>Nothing yet.</div>}
          </div>
        </Card>
      </div>

      <div style={{ display: 'grid', gap: 16 }}>
        {owner && (<Card title="Owner">
          <div style={{ display: 'flex', alignItems: 'center', gap: 11, marginBottom: 12 }}>
            <Avatar name={owner.name} size={38} />
            <span><span style={{ display: 'block', fontWeight: 700 }}>{owner.name}</span>
              <a href={'mailto:' + owner.staffId} style={{ display: 'block', fontFamily: MONO, fontSize: 11.5, color: 'var(--blue)' }}>{owner.staffId}</a></span>
          </div>
          {kv('Signed up', fmtDay(owner.createdAt))}
        </Card>)}

        {d.application && (<Card title="Came from">
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, justifyContent: 'space-between' }}>
            <span><span style={{ display: 'block', fontFamily: MONO, fontSize: 12.5, fontWeight: 700 }}>{d.application.reference}</span>
              <span style={{ display: 'block', fontSize: 12, color: 'var(--mute)', marginTop: 2 }}>applied {fmtDay(d.application.createdAt)}</span></span>
            <button onClick={() => goto('#/applications/' + d.application.id)} style={btn('transparent', 'var(--text)', { fontSize: 12 })}>Open</button>
          </div>
        </Card>)}

        <Card title="Business">
          {kv('Desk address', t.slug)}
          {kv('Public site', t.siteDomain)}
          {kv('Country', setup.country)}
          {kv('Regulator', setup.regulator || le.jurisdiction)}
          {kv('MSB number', setup.msbNumber || le.msbNumber)}
          {kv('Legal entity', le.name)}
          {kv('Branches', ds.branches || null)}
          {kv('Currencies priced', ds.currencies || null)}
        </Card>

        <Card title={'People (' + d.staff.length + ')'}>
          {d.staff.map(s => (<button key={s.id} onClick={() => goto('#/people/' + s.id)}
            style={{ display: 'flex', width: '100%', alignItems: 'center', gap: 10, padding: '7px 0', background: 'none', border: 'none', color: 'var(--text)', cursor: 'pointer', textAlign: 'left' }}>
            <Avatar name={s.name} size={28} />
            <span style={{ flex: 1, minWidth: 0 }}><span style={{ display: 'block', fontSize: 13, fontWeight: 600 }}>{s.name}{s.active === false && <span style={{ color: 'var(--red)', fontWeight: 500 }}> · blocked</span>}</span>
              <span style={{ display: 'block', fontFamily: MONO, fontSize: 11, color: 'var(--mute)', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.cdId || s.staffId}</span></span>
            <Pill tone={s.role === 'administrator' ? 'purple' : 'mute'}>{s.role.replace('_', ' ')}</Pill>
          </button>))}
        </Card>

        <Card title="Plan">
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {['basic', 'pro', 'premium'].map(p => <button key={p} onClick={() => act(() => api('/api/admin/tenants/' + id, { method: 'PATCH', body: JSON.stringify({ plan: p }) }), 'plan')} disabled={busy === 'plan'}
              style={btn(t.plan === p ? 'var(--hover)' : 'transparent', t.plan === p ? 'var(--text)' : 'var(--mute)', { textTransform: 'capitalize', fontSize: 12.5 })}>{p}</button>)}
          </div>
        </Card>

        <Card title="Retention">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55 }}>
            Desks are <b style={{ color: 'var(--text)' }}>suspended, not deleted</b> — records must be kept <b style={{ color: 'var(--text)' }}>6 years</b> (FINTRAC). Blocking takes a desk offline and keeps every record.{!suspended && ' To delete, block it first.'}
          </div>
          {suspended && (<div style={{ borderTop: '1px solid var(--line2)', marginTop: 12, paddingTop: 12 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--red)', marginBottom: 8 }}>Permanently delete — last resort</div>
            <label style={{ display: 'flex', gap: 8, fontSize: 12, color: 'var(--mute)', marginBottom: 10, cursor: 'pointer', lineHeight: 1.45 }}>
              <input type="checkbox" checked={ack} onChange={e => setAck(e.target.checked)} style={{ marginTop: 2, flex: 'none' }} />
              <span>I understand this destroys {t.name}'s records we are required to keep for 6 years, and cannot be undone.</span></label>
            <input value={confirmName} onChange={e => setConfirmName(e.target.value)} placeholder={'type ' + t.slug + ' to confirm'}
              style={{ width: '100%', padding: '9px 11px', background: 'var(--bg)', border: '1px solid var(--line)', borderRadius: 8, color: 'var(--text)', fontSize: 13, fontFamily: MONO, marginBottom: 9, outline: 'none', boxSizing: 'border-box' }} />
            <button onClick={() => act(async () => { await api('/api/admin/tenants/' + id, { method: 'DELETE' }); goto('#/desks'); }, 'delete')}
              disabled={!ack || confirmName !== t.slug || busy === 'delete'}
              style={{ width: '100%', padding: 10, borderRadius: 9, border: 'none', cursor: (ack && confirmName === t.slug) ? 'pointer' : 'not-allowed', background: (ack && confirmName === t.slug) ? 'var(--red)' : 'rgba(248,113,113,0.18)', color: (ack && confirmName === t.slug) ? '#fff' : 'rgba(255,255,255,0.4)', fontWeight: 700, fontSize: 13 }}>
              {busy === 'delete' ? 'Deleting…' : 'Delete permanently'}</button>
          </div>)}
        </Card>
      </div>
    </div>
  </div>);
}

// ===================== PERSON PAGE =====================
// Support acts on people. Someone leaves, someone's laptop goes missing,
// someone can't get in — all of that is done from here.
function PersonPage({ id, onChanged }) {
  const [d, setD] = useState(null); const [err, setErr] = useState('');
  const [busy, setBusy] = useState(''); const [flash, setFlash] = useState(null);
  const load = () => api('/api/admin/staff/' + encodeURIComponent(id)).then(setD).catch(() => setErr('Could not load this person.'));
  useEffect(() => { setD(null); setErr(''); setFlash(null); load(); }, [id]);

  if (err) return <div style={{ color: 'var(--red)', padding: 20 }}>{err}</div>;
  if (!d) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;

  const p = d.person, desk = d.desk;
  const sent = (s) => s === 'sent' ? 'and emailed to them' : s === 'simulated' ? 'and the email is simulated here' : s === 'failed' ? 'but the email did not send' : 'but they have no email on file';
  const run = async (label, path, body, done) => {
    setBusy(label); setFlash(null);
    try {
      // the shared api() always sets a JSON content-type, and Fastify rejects
      // that with no body — so an action with nothing to say still says {}
      const r = await api(path, { method: body ? 'PATCH' : 'POST', body: JSON.stringify(body || {}) });
      setFlash(done(r));
      await load(); onChanged && onChanged();
    } catch (x) { setFlash({ tone: 'red', text: (x.body && x.body.detail) || 'That did not work.' }); }
    setBusy('');
  };
  const btn = (bg, col, extra) => Object.assign({ padding: '9px 14px', borderRadius: 9, border: '1px solid var(--line)', background: bg, color: col, fontSize: 13, fontWeight: 600, cursor: busy ? 'default' : 'pointer' }, extra || {});

  return (<div>
    <PageHead back={desk ? desk.name : 'Desks'} backTo={desk ? '#/desks/' + desk.id : '#/desks'}
      title={p.name} sub={p.staffId + '  ·  joined ' + fmtDay(p.createdAt)}
      pills={<><Pill tone={p.active ? 'green' : 'red'} dot>{p.active ? 'Active' : 'Blocked'}</Pill><Pill tone={p.role === 'administrator' ? 'purple' : 'mute'}>{p.role.replace('_', ' ')}</Pill>{p.mustChangePassword && <Pill tone="amber">Must change password</Pill>}</>}
      actions={<a href={'mailto:' + p.staffId} style={{ ...btn('transparent', 'var(--text)'), textDecoration: 'none' }}>Email them</a>} />

    {flash && <div style={{ marginBottom: 16, padding: '11px 14px', borderRadius: 10, fontSize: 13, lineHeight: 1.55,
      background: 'color-mix(in srgb,' + toneColor(flash.tone || 'blue') + ' 12%,transparent)', border: '1px solid color-mix(in srgb,' + toneColor(flash.tone || 'blue') + ' 30%,transparent)' }}>
      {flash.text}
      {flash.code && <div style={{ fontFamily: MONO, fontSize: 18, fontWeight: 700, letterSpacing: '0.08em', marginTop: 8 }}>{flash.code}</div>}
    </div>}

    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.5fr) minmax(300px,1fr)', gap: 16, alignItems: 'start' }}>
      <div style={{ display: 'grid', gap: 16 }}>
        <Card title="CurrencyDesk ID">
          {p.cdId
            ? <div style={{ fontFamily: MONO, fontSize: 26, fontWeight: 700, letterSpacing: '0.1em' }}>{p.cdId}</div>
            : <div style={{ fontSize: 13.5, color: 'var(--mute)', lineHeight: 1.55 }}>None yet — they sign in as <b style={{ color: 'var(--text)' }}>{p.staffId}</b>.</div>}
          <div style={{ fontSize: 12.5, color: 'var(--faint)', marginTop: 10, lineHeight: 1.55 }}>
            What they read out when they ring, and what they can sign in with. {p.cdId ? 'Issuing a new one retires this one immediately.' : 'Issuing one does not take away their current sign-in.'}
          </div>
          <button disabled={!!busy} onClick={() => run('cdid', '/api/admin/staff/' + p.id + '/cd-id', null,
            (r) => ({ tone: 'green', text: (r.previous ? 'New ID issued — the old one no longer works, ' : 'ID issued, ') + sent(r.delivered) + '.', code: r.cdId }))}
            style={{ ...btn(p.cdId ? 'transparent' : 'var(--text)', p.cdId ? 'var(--text)' : '#111'), marginTop: 12 }}>
            {busy === 'cdid' ? 'Issuing…' : p.cdId ? 'Issue a new ID' : 'Issue an ID'}</button>
        </Card>

        <Card title={'Their activity (' + d.events.length + ')'} pad={0}>
          <div style={{ padding: '4px 16px', maxHeight: 300, overflow: 'auto' }}>
            {d.events.map(e => (<div key={e.id} style={{ display: 'flex', gap: 12, alignItems: 'baseline', padding: '9px 0', borderBottom: '1px solid var(--line2)' }}>
              <span style={{ fontFamily: MONO, fontSize: 11, color: 'var(--faint)', width: 120, flex: 'none' }}>{fmtWhen(e.at)}</span>
              <span style={{ fontFamily: MONO, fontSize: 12, fontWeight: 700 }}>{e.action}</span>
            </div>))}
            {d.events.length === 0 && <div style={{ padding: 20, color: 'var(--faint)' }}>Nothing recorded yet.</div>}
          </div>
        </Card>
      </div>

      <div style={{ display: 'grid', gap: 16 }}>
        <Card title="Account">
          {kv('Signs in as', p.staffId)}
          {kv('Desk', desk ? <button onClick={() => goto('#/desks/' + desk.id)} style={{ background: 'none', border: 'none', color: 'var(--blue)', cursor: 'pointer', padding: 0, fontSize: 13, fontWeight: 600 }}>{desk.name}</button> : null)}
          {kv('Role', p.role.replace('_', ' '))}
          {kv('Signed in now', d.sessions.live > 0 ? d.sessions.live + ' device' + (d.sessions.live === 1 ? '' : 's') : 'no')}
          {kv('Last sign-in', d.sessions.lastSignInAt ? fmtWhen(d.sessions.lastSignInAt) : 'never')}
          {kv('Password set', p.passwordUpdatedAt ? fmtWhen(p.passwordUpdatedAt) : 'at signup')}
        </Card>

        <Card title="Can't get in">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
            Issues a temporary password, signs every device out, and makes them pick their own before the desk opens.
          </div>
          <button disabled={!!busy} onClick={() => run('reset', '/api/admin/staff/' + p.id + '/reset-password', null,
            (r) => r.tempPassword
              ? { tone: 'amber', text: 'Password reset. They have no email on file, so read this to them — it is shown once.', code: r.tempPassword }
              : { tone: 'green', text: 'Password reset ' + sent(r.delivered) + '. Every device has been signed out.' })}
            style={{ ...btn('transparent', 'var(--text)'), width: '100%' }}>
            {busy === 'reset' ? 'Resetting…' : 'Reset their password'}</button>
        </Card>

        <Card title="Till PIN">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
            {p.pinLockedUntil
              ? <span style={{ color: 'var(--amber)' }}><b>The keypad is shut</b> after too many wrong tries — until {fmtWhen(p.pinLockedUntil)}. Resetting the PIN opens it again straight away.</span>
              : p.pinMustChange
                ? <span style={{ color: 'var(--amber)' }}><b>Still the one we issued</b> ({fmtWhen(p.pinSetAt)}) — so whoever read it out knows it. They set their own from Settings, or reset it themselves with their password.</span>
                : p.hasPin
                  ? <>Four digits, asked for at the till, when switching accounts and when voiding. They chose it {fmtWhen(p.pinSetAt)}. Nobody can read it back — not even us.</>
                  : <>No PIN set. Until there is one the desk falls back to its own check, which anyone can see. Issue one.</>}
          </div>
          <button disabled={!!busy} onClick={() => run('pin', '/api/admin/staff/' + p.id + '/reset-pin', null,
            (r) => ({ tone: 'amber', text: 'New PIN. Read it to them — it is shown once and cannot be looked up again.', code: r.pin }))}
            style={{ ...btn(p.hasPin ? 'transparent' : 'var(--text)', p.hasPin ? 'var(--text)' : '#111'), width: '100%' }}>
            {busy === 'pin' ? 'Setting…' : p.hasPin ? 'Reset their PIN' : 'Issue a PIN'}</button>
        </Card>

        <Card title="Access">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
            {p.active
              ? 'Blocking signs them out everywhere at once and refuses any new sign-in. Their records stay exactly as they are.'
              : 'They are blocked: signed out everywhere and unable to sign in.'}
          </div>
          <button disabled={!!busy} onClick={() => run('block', '/api/admin/staff/' + p.id, { active: !p.active },
            () => ({ tone: p.active ? 'amber' : 'green', text: p.active ? p.name + ' is blocked and signed out everywhere.' : p.name + ' can sign in again.' }))}
            style={{ ...btn(p.active ? 'color-mix(in srgb,var(--red) 14%,transparent)' : 'color-mix(in srgb,var(--green) 14%,transparent)', p.active ? 'var(--red)' : 'var(--green)'), width: '100%' }}>
            {busy === 'block' ? '…' : p.active ? 'Block this person' : 'Unblock this person'}</button>
        </Card>
      </div>
    </div>
  </div>);
}

// ===================== APPLICATION PAGE =====================
// ===================== ONBOARDING =====================
/* Type the reference they already hold and work the signup flow with them —
   on the phone, or standing at their counter. It is the SAME flow they would
   see, with everything their application already told us filled in, saving as
   you go so it can be put down and picked up from either side. */
// NB: the prop is `reference`, not `ref` — React intercepts `ref` on a
// function component and it would never arrive.
const WALKTHROUGH = 'CD-WALKTHRU';

function OnboardingPage({ reference: startRef }) {
  const [ref, setRef] = useState(startRef || '');
  const [typed, setTyped] = useState(startRef || '');
  const [d, setD] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [draft, setDraft] = useState({});      // fieldId → value being typed
  const [saved, setSaved] = useState('');

  const load = (r) => {
    if (!r) return;
    setErr(''); setD(null);
    api('/api/admin/onboarding/' + encodeURIComponent(r))
      .then(x => { setD(x); setDraft({}); })
      .catch(e => setErr((e.body && e.body.detail) || 'No application with that reference.'));
  };
  useEffect(() => { if (ref) load(ref); }, [ref]);

  const open = () => { const r = typed.trim().toUpperCase(); if (r) { setRef(r); goto('#/onboarding/' + encodeURIComponent(r)); } };

  const save = async (step) => {
    const mine = {};
    step.fields.forEach(f => { if (f.id in draft) mine[f.id] = draft[f.id]; });
    if (!Object.keys(mine).length) return;
    setBusy(true); setErr('');
    try {
      setD(await api('/api/admin/onboarding/' + encodeURIComponent(ref), { method: 'PATCH', body: JSON.stringify({ stepId: step.id, answers: mine }) }));
      setDraft(p => { const n = { ...p }; Object.keys(mine).forEach(k => delete n[k]); return n; });
      setSaved(step.id); setTimeout(() => setSaved(''), 1600);
    } catch (x) { setErr((x.body && x.body.detail) || 'That didn’t save.'); }
    setBusy(false);
  };
  const mark = async (step, done) => {
    setBusy(true); setErr('');
    try { setD(await api('/api/admin/onboarding/' + encodeURIComponent(ref), { method: 'POST', body: JSON.stringify({}) })); } catch (e) {}
    try {
      setD(await api('/api/admin/onboarding/' + encodeURIComponent(ref) + '/mark', { method: 'POST', body: JSON.stringify({ stepId: step.id, done }) }));
    } catch (x) { setErr((x.body && x.body.detail) || 'That didn’t save.'); }
    setBusy(false);
  };
  const reset = async () => {
    setBusy(true); setErr('');
    try { setD(await api('/api/admin/onboarding/' + encodeURIComponent(ref) + '/reset', { method: 'POST', body: JSON.stringify({}) })); setDraft({}); }
    catch (x) { setErr((x.body && x.body.detail) || 'Could not reset.'); }
    setBusy(false);
  };
  const finish = async () => {
    setBusy(true); setErr('');
    try { const r = await api('/api/admin/onboarding/' + encodeURIComponent(ref) + '/create', { method: 'POST', body: JSON.stringify({}) }); setD(x => ({ ...x, handoff: r.handoff })); }
    catch (x) { setErr((x.body && x.body.detail) || 'Not ready yet.'); }
    setBusy(false);
  };

  const inSty = { width: '100%', boxSizing: 'border-box', padding: '9px 11px', borderRadius: 9, border: '1px solid var(--line)', background: 'var(--card)', color: 'var(--text)', fontSize: 13.5, outline: 'none' };

  if (!ref || err || !d) return (<div>
    <PageHead back="Desks" backTo="#/desks" title="Onboarding"
      sub="Open a desk with someone — type the reference from their application." />
    <div style={{ maxWidth: 460 }}>
      <Card title="Which application">
        <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
          The reference on their charter card and in every email we’ve sent them.
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <input value={typed} onChange={e => setTyped(e.target.value)} onKeyDown={e => e.key === 'Enter' && open()}
            placeholder="CD-A3V5ZE" autoFocus
            style={{ ...inSty, fontFamily: MONO, letterSpacing: '0.12em', textTransform: 'uppercase' }} />
          <button onClick={open} style={{ padding: '9px 16px', borderRadius: 9, border: 'none', background: 'var(--text)', color: '#111', fontWeight: 700, fontSize: 13, cursor: 'pointer', flex: 'none' }}>Open</button>
        </div>
        {err && <div style={{ color: 'var(--red)', fontSize: 12.5, marginTop: 10 }}>{err}</div>}
        {ref && !err && !d && <div style={{ color: 'var(--mute)', fontFamily: MONO, fontSize: 12, marginTop: 10 }}>Loading…</div>}
      </Card>

      {/* Onboarding is a thing you do TO somebody, so it is hard to rehearse.
          This one is always here and can be reset. */}
      <div style={{ marginTop: 14 }}>
        <Card title="Just want a run-through?">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
            <b style={{ color: 'var(--text)', fontFamily: MONO }}>{WALKTHROUGH}</b> is a permanent application you can open any
            time and run start to finish. It goes through exactly the same code a real one does, counts towards nothing,
            and never leaves a desk behind.
          </div>
          <button onClick={() => { setTyped(WALKTHROUGH); setRef(WALKTHROUGH); goto('#/onboarding/' + WALKTHROUGH); }}
            style={{ padding: '9px 15px', borderRadius: 9, border: '1px solid var(--line)', background: 'transparent', color: 'var(--text)', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>
            Open the walkthrough</button>
        </Card>
      </div>
    </div>
  </div>);

  const a = d.application;
  const pct = Math.round((d.done / d.total) * 100);
  return (<div>
    <PageHead back="Onboarding" backTo="#/onboarding" title={a.name || a.email}
      sub={a.reference + (a.charterNo ? '  ·  charter Nº ' + String(a.charterNo).padStart(4, '0') : '') + '  ·  applied ' + fmtDay(a.appliedAt)}
      pills={<>{a.isWalkthrough && <Pill tone="purple">walkthrough</Pill>}
        <Pill tone={a.status === 'invited' ? 'amber' : a.status === 'accepted' ? 'green' : 'mute'}>{a.status}</Pill>
        <Pill tone={d.done === d.total ? 'green' : 'mute'}>{d.done} of {d.total} steps</Pill></>}
      actions={<>
        {/* The customer's own screens, opened on their record. Not a copy of
            the flow rendered in here — the same page they get, on the same
            answers, so doing it with them on the phone and them doing it
            alone are the same act. */}
        <a href={'/onboarding/' + encodeURIComponent(a.reference)} target="_blank" rel="noopener"
          style={{ padding: '9px 14px', borderRadius: 9, border: '1px solid var(--line)', background: 'var(--text)', color: '#111', fontSize: 13, fontWeight: 700, cursor: 'pointer', textDecoration: 'none' }}>
          Walk their setup ↗</a>
        {a.isWalkthrough &&
          <button disabled={busy} onClick={reset} style={{ padding: '9px 14px', borderRadius: 9, border: '1px solid var(--line)', background: 'transparent', color: 'var(--text)', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>{busy ? '…' : 'Start over'}</button>}
      </>} />

    <div style={{ height: 5, borderRadius: 999, background: 'var(--line2)', overflow: 'hidden', marginBottom: 20 }}>
      <div style={{ height: '100%', width: pct + '%', background: pct === 100 ? 'var(--green)' : 'var(--accent)', transition: 'width .3s ease' }} />
    </div>

    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.6fr) minmax(280px,1fr)', gap: 16, alignItems: 'start' }}>
      <div style={{ display: 'grid', gap: 14 }}>
        {d.phases.map(ph => {
          const steps = d.steps.filter(s => s.phase === ph.id);
          if (!steps.length) return null;
          return (<div key={ph.id}>
            <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--faint)', margin: '4px 0 8px' }}>{ph.title}</div>
            {steps.map(s => (<div key={s.id} style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 13, padding: 16, marginBottom: 10 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 3 }}>
                <span style={{ width: 15, height: 15, borderRadius: 4, flex: 'none', display: 'grid', placeItems: 'center', fontSize: 10, fontWeight: 700,
                  border: '1px solid ' + (s.done ? 'transparent' : 'var(--line)'), background: s.done ? 'var(--green)' : 'transparent', color: '#0b0b0b' }}>{s.done ? '✓' : ''}</span>
                <span style={{ fontSize: 14.5, fontWeight: 700 }}>{s.title}</span>
                {s.who === 'customer' && <Pill tone="purple">theirs to do</Pill>}
                {saved === s.id && <Pill tone="green">saved</Pill>}
              </div>
              <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.5, marginBottom: s.fields.length ? 12 : 10 }}>{s.blurb}</div>

              {s.fields.length > 0 && (<div style={{ display: 'grid', gap: 10 }}>
                {s.fields.map(f => {
                  const v = f.id in draft ? draft[f.id] : (f.value == null ? '' : f.value);
                  const locked = f.derived || s.who === 'customer';
                  return (<label key={f.id} style={{ display: 'block' }}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 7, marginBottom: 4 }}>
                      <span style={{ fontSize: 11.5, color: 'var(--mute)', fontWeight: 600 }}>{f.label}</span>
                      {f.source === 'application' && <Pill tone="blue">from their application</Pill>}
                      {f.source === 'derived' && <Pill tone="mute">from {String(f.id === 'regulator' ? 'the country' : 'the regulator')}</Pill>}
                      {/* Which surface this arrived through. "From their setup"
                          rather than "they typed this" on purpose: the value
                          came through their own screens, but some of those
                          screens offer a default they only had to accept, and
                          the pill should not claim more than it knows. */}
                      {f.filledBy === 'customer' && <Pill tone="green">from their setup</Pill>}
                      {f.filledBy === 'operator' && <Pill tone="mute">you entered this</Pill>}
                      {f.required && f.value == null && <span style={{ fontSize: 11, color: 'var(--amber)' }}>needed</span>}
                    </div>
                    {f.type === 'select'
                      ? <select disabled={locked} value={v} onChange={e => setDraft(p => ({ ...p, [f.id]: e.target.value }))} style={{ ...inSty, opacity: locked ? 0.6 : 1 }}>
                          <option value="">—</option>
                          {(f.options || []).map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                        </select>
                      : <input disabled={locked} value={v} type={f.type === 'password' ? 'password' : 'text'}
                          onChange={e => setDraft(p => ({ ...p, [f.id]: f.type === 'money' || f.type === 'number' ? Number(e.target.value) || '' : e.target.value }))}
                          onKeyDown={e => e.key === 'Enter' && save(s)}
                          placeholder={f.placeholder || ''} style={{ ...inSty, opacity: locked ? 0.6 : 1 }} />}
                    {f.help && <div style={{ fontSize: 11, color: 'var(--faint)', marginTop: 3 }}>{f.help}</div>}
                  </label>);
                })}
                {s.who !== 'customer' && (<div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                  <button disabled={busy || !s.fields.some(f => f.id in draft)} onClick={() => save(s)}
                    style={{ padding: '7px 14px', borderRadius: 8, border: '1px solid var(--line)', fontSize: 12.5, fontWeight: 700,
                      background: s.fields.some(f => f.id in draft) ? 'var(--text)' : 'transparent',
                      color: s.fields.some(f => f.id in draft) ? '#111' : 'var(--faint)',
                      cursor: s.fields.some(f => f.id in draft) ? 'pointer' : 'default' }}>Save</button>
                </div>)}
              </div>)}

              {s.fields.length === 0 && (<button disabled={busy} onClick={() => mark(s, !s.done)}
                style={{ padding: '7px 13px', borderRadius: 8, border: '1px solid var(--line)', background: 'transparent', color: 'var(--text)', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>
                {s.done ? 'Undo' : s.kind === 'payment' ? 'Mark paid' : 'Mark sighted'}</button>)}
            </div>))}
          </div>);
        })}
      </div>

      <div style={{ display: 'grid', gap: 14, position: 'sticky', top: 20 }}>
        <Card title="What they told us">
          {kv('Email', a.email)}
          {Object.entries(a.told || {}).map(([k, v]) => kv(k.replace(/([A-Z])/g, ' $1').toLowerCase(), String(v)))}
        </Card>
        {/* The walkthrough is a rehearsal — it walks every screen a real one
            does and deliberately creates nothing at the end. Offering to build
            a desk from it is offering something that cannot happen. */}
        {a.isWalkthrough ? (
        <Card title="This is the walkthrough">
          <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55 }}>
            Practise on it as often as you like — every screen and every save is
            the real thing. It never creates a desk, never takes a founding
            place, and never appears in the funnel. <b style={{ color: 'var(--text)' }}>Start over</b> puts it back.
          </div>
        </Card>
        ) : (
        <Card title="Build the desk">
          {/* Once the desk exists there is nothing left to build, and offering
              it again invites an operator to press a button that can only
              answer 409. Send them to the desk instead. */}
          {d.tenantId ? (<>
            <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
              This desk is open. It was created from exactly what is above.
            </div>
            <button onClick={() => goto('#/desks/' + d.tenantId)}
              style={{ width: '100%', padding: '10px 14px', borderRadius: 9, border: '1px solid var(--line)', fontSize: 13, fontWeight: 700,
                background: 'var(--green)', color: '#0b0b0b', cursor: 'pointer' }}>Open the desk</button>
          </>) : (<>
            <div style={{ fontSize: 12.5, color: 'var(--mute)', lineHeight: 1.55, marginBottom: 12 }}>
              {d.ready.ok ? 'Everything is answered. This creates the desk from exactly what is above.'
                : d.ready.missing.length === 1 && d.ready.missing[0] === 'ownerPass'
                  ? 'Everything of ours is done — the owner sets their own password from their link.'
                  : 'Still needed: ' + d.ready.missing.join(', ') + '.'}
            </div>
            {err && <div style={{ color: 'var(--red)', fontSize: 12.5, marginBottom: 10 }}>{err}</div>}
            <button disabled={busy} onClick={finish}
              style={{ width: '100%', padding: '10px 14px', borderRadius: 9, border: '1px solid var(--line)', fontSize: 13, fontWeight: 700,
                background: d.ready.ok ? 'var(--green)' : 'transparent', color: d.ready.ok ? '#0b0b0b' : 'var(--text)', cursor: 'pointer' }}>
              {busy ? 'Working…' : 'Create the desk'}</button>
          </>)}
        </Card>
        )}
      </div>
    </div>
  </div>);
}

function ApplicationPage({ id, onChanged }) {
  const [d, setD] = useState(null); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(''); const [flash, setFlash] = useState('');
  const load = () => api('/api/admin/enquiries/' + encodeURIComponent(id)).then(r => { setD(r); setNote(r.enquiry.notes || ''); }).catch(() => setErr('Could not load this application.'));
  useEffect(() => { setD(null); setErr(''); load(); }, [id]);

  if (err) return <div style={{ color: 'var(--red)', padding: 20 }}>{err}</div>;
  if (!d) return <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;

  const e = d.enquiry;
  const isApp = e.kind === 'early_access';
  const save = async (body, label) => {
    setBusy(true); setFlash('');
    try {
      const r = await api('/api/admin/enquiries/' + e.id, { method: 'PATCH', body: JSON.stringify(body) });
      if (r && r.invite) setFlash(r.invite === 'failed' ? 'Stage saved, but the invitation email did not send.' : r.invite === 'simulated' ? 'Invited. Email is simulated here — it will send for real once Resend is configured.' : 'Invited, and the invitation is on its way.');
      else if (label) setFlash(label);
      await load(); onChanged && onChanged();
    } catch (x) { setFlash((x.body && x.body.detail) || 'Could not save.'); }
    setBusy(false);
  };
  const btn = (bg, col, extra) => Object.assign({ padding: '9px 14px', borderRadius: 9, border: '1px solid var(--line)', background: bg, color: col, fontSize: 13, fontWeight: 600, cursor: busy ? 'default' : 'pointer' }, extra || {});

  return (<div>
    <PageHead back={isApp ? 'Early access' : 'Messages'} backTo={isApp ? '#/applications' : '#/messages'}
      title={e.name || e.email} sub={e.reference + '  ·  received ' + fmtWhen(e.createdAt)}
      pills={<Pill tone={STAGE_TONE[e.status]} dot>{e.status}</Pill>}
      actions={<a href={'mailto:' + e.email} style={{ ...btn('transparent', 'var(--text)'), textDecoration: 'none' }}>Reply by email</a>} />

    {flash && <div style={{ marginBottom: 14, padding: '10px 14px', borderRadius: 10, fontSize: 13, background: 'color-mix(in srgb,var(--blue) 12%,transparent)', border: '1px solid color-mix(in srgb,var(--blue) 30%,transparent)' }}>{flash}</div>}

    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.6fr) minmax(280px,1fr)', gap: 16, alignItems: 'start' }}>
      <div style={{ display: 'grid', gap: 16 }}>
        <Card title={isApp ? 'What they told us' : 'Their message'}>
          {kv('Email', <a href={'mailto:' + e.email} style={{ color: 'var(--blue)' }}>{e.email}</a>)}
          {Object.entries(e.details || {}).filter(([, v]) => v !== null && v !== '').map(([k, v]) => kv(DETAIL_LABELS[k] || k, String(v)))}
        </Card>

        <Card title="Your notes">
          <textarea value={note} onChange={ev => setNote(ev.target.value)} rows={6} placeholder="What you learned on the call, what you promised, anything the next person needs…"
            style={{ width: '100%', padding: 11, borderRadius: 9, border: '1px solid var(--line)', background: 'var(--sidebar)', color: 'var(--text)', fontSize: 13.5, lineHeight: 1.55, resize: 'vertical', outline: 'none', boxSizing: 'border-box' }} />
          <button disabled={busy || note === (e.notes || '')} onClick={() => save({ notes: note }, 'Note saved.')}
            style={{ marginTop: 9, padding: '9px 16px', borderRadius: 9, border: 'none', background: note === (e.notes || '') ? 'var(--line)' : 'var(--text)', color: note === (e.notes || '') ? 'var(--faint)' : '#111', fontWeight: 700, fontSize: 13, cursor: busy || note === (e.notes || '') ? 'default' : 'pointer' }}>Save note</button>
        </Card>
      </div>

      <div style={{ display: 'grid', gap: 16 }}>
        <Card title="Move this along">
          {e.status === 'accepted'
            ? <div style={{ fontSize: 13, color: 'var(--mute)', lineHeight: 1.55 }}>They built their desk — this one is done.</div>
            : (<div>
                <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap' }}>
                  {SETTABLE.filter(s => s !== e.status).map(s => (
                    <button key={s} disabled={busy} onClick={() => save({ status: s }, 'Moved to ' + s + '.')} style={btn(s === 'invited' ? 'color-mix(in srgb,var(--purple) 16%,transparent)' : 'transparent', s === 'invited' ? 'var(--purple)' : 'var(--text)', { textTransform: 'capitalize', fontSize: 12.5 })}>{s}</button>))}
                </div>
                {isApp && <div style={{ fontSize: 12, color: 'var(--faint)', marginTop: 10, lineHeight: 1.5 }}>Inviting emails them their reference and the link to set the desk up. Accepted happens on its own when they finish.</div>}
              </div>)}
        </Card>

        <Card title="History">
          {kv('Received', fmtWhen(e.createdAt))}
          {kv('First answered', e.handledAt ? fmtWhen(e.handledAt) : null)}
          {kv('Last moved', e.decidedAt ? fmtWhen(e.decidedAt) : null)}
          {kv('By', e.decidedBy)}
        </Card>

        {e.tenantName && (<Card title="Became">
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
            <span style={{ fontWeight: 700 }}>{e.tenantName}</span>
            <button onClick={() => goto('#/desks/' + e.tenantId)} style={btn('transparent', 'var(--text)', { fontSize: 12 })}>Open desk</button>
          </div>
        </Card>)}

        {d.alsoFrom.length > 0 && (<Card title={'Also from this address (' + d.alsoFrom.length + ')'}>
          {d.alsoFrom.map(o => (<button key={o.id} onClick={() => goto('#/applications/' + o.id)} style={{ display: 'flex', width: '100%', alignItems: 'center', justifyContent: 'space-between', gap: 10, padding: '8px 0', background: 'none', border: 'none', borderBottom: '1px solid var(--line2)', color: 'var(--text)', cursor: 'pointer', textAlign: 'left' }}>
            <span><span style={{ display: 'block', fontFamily: MONO, fontSize: 12 }}>{o.reference}</span>
              <span style={{ display: 'block', fontSize: 11.5, color: 'var(--faint)' }}>{o.kind === 'early_access' ? 'application' : 'message'} · {fmtDay(o.createdAt)}</span></span>
            <Pill tone={STAGE_TONE[o.status]}>{o.status}</Pill>
          </button>))}
        </Card>)}
      </div>
    </div>
  </div>);
}

// ===================== APP =====================
function App() {
  const [phase, setPhase] = useState('loading'); // loading | login | ready
  const [tenants, setTenants] = useState([]);
  const [ov, setOv] = useState(null);
  const [audit, setAudit] = useState(null);
  const [route, setRoute] = useState(() => parseHash(window.location.hash));
  useEffect(() => {
    const on = () => setRoute(parseHash(window.location.hash));
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const tab = route.tab;
  const setTab = (t) => goto('#/' + t);
  const [statusFilter, setStatusFilter] = useState('all');
  const [planFilter, setPlanFilter] = useState('all');
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('joined');
  const [creating, setCreating] = useState(false);

  const loadAll = async () => {
    const [t, o] = await Promise.all([api('/api/admin/tenants'), api('/api/admin/overview').catch(() => null)]);
    setTenants(t.tenants); setOv(o);
  };
  const boot = async () => {
    try { const me = await api('/api/admin/me'); if (!me.isAdmin) { setPhase('login'); return; } await loadAll(); setPhase('ready'); }
    catch (x) { setPhase('login'); }
  };
  useEffect(() => { boot(); }, []);
  useEffect(() => { if (tab === 'activity' && !audit) api('/api/admin/audit?limit=150').then(r => setAudit(r.events)).catch(() => setAudit([])); }, [tab]);

  if (phase === 'loading') return <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>;
  if (phase === 'login') return <Login onIn={() => { setPhase('loading'); boot(); }} />;

  const counts = {
    desks: tenants.length,
    active: tenants.filter(t => t.status === 'active').length,
    trial: tenants.filter(t => t.status === 'trial').length,
    suspended: tenants.filter(t => t.status === 'suspended').length,
    // what is sitting on somebody — the number worth a badge in the nav
    waiting: ov && ov.funnel ? ov.funnel.waiting : 0,
    unread: ov && ov.funnel ? ov.funnel.unread : 0,
  };
  let rows = tenants.filter(t => (statusFilter === 'all' || t.status === statusFilter) && (planFilter === 'all' || t.plan === planFilter));
  const s = q.trim().toLowerCase();
  if (s) rows = rows.filter(t => [t.name, t.slug, t.owner && t.owner.name, t.owner && t.owner.staffId, t.country].some(v => (v || '').toLowerCase().includes(s)));
  rows = rows.slice().sort((a, b) => {
    if (sort === 'name') return (a.name || '').localeCompare(b.name || '');
    if (sort === 'plan') return (a.plan || '').localeCompare(b.plan || '');
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  const th = { textAlign: 'left', fontSize: 11, color: 'var(--faint)', textTransform: 'uppercase', letterSpacing: '0.04em', padding: '0 16px 10px', fontWeight: 600 };
  const td = { padding: '13px 16px', borderTop: '1px solid var(--line2)', fontSize: 14, verticalAlign: 'middle' };
  const ctrl = { display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 10, fontSize: 13, color: 'var(--mute)' };

  return (<div style={{ display: 'flex', minHeight: '100vh' }}>
    <Sidebar counts={counts} statusFilter={statusFilter} setStatusFilter={setStatusFilter} planFilter={planFilter} setPlanFilter={setPlanFilter} tab={tab} setTab={setTab} onCreate={() => setCreating(true)} />
    <div style={{ flex: 1, minWidth: 0, height: '100vh', overflow: 'auto', padding: '24px 30px' }}>
      {!route.id && <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, margin: 0 }}>{TAB_TITLE[tab] || 'Desks'}</h1>
        <Pill tone="green" dot>Live</Pill>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 9 }}>
          <button onClick={() => setCreating(true)} style={{ padding: '9px 15px', background: 'var(--text)', color: '#111', border: 'none', borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>＋ New desk</button>
        </div>
      </div>}

      {tab === 'onboarding' && <OnboardingPage reference={route.id} />}

      {route.id && tab !== 'onboarding' && (tab === 'desks'
        ? <DeskPage id={route.id} onChanged={loadAll} />
        : tab === 'people'
        ? <PersonPage id={route.id} onChanged={loadAll} />
        : <ApplicationPage id={route.id} onChanged={loadAll} />)}

      {!route.id && tab === 'desks' && (<div>
        <StatRow ov={ov} />
        <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search desks, owners, email…" style={{ flex: 1, minWidth: 220, padding: '9px 14px', background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 10, color: 'var(--text)', fontSize: 13.5, outline: 'none' }} />
          <label style={ctrl}>Sort <select value={sort} onChange={e => setSort(e.target.value)} style={{ background: 'transparent', border: 'none', color: 'var(--text)', fontSize: 13, outline: 'none', cursor: 'pointer' }}><option value="joined">Newest</option><option value="name">Name</option><option value="plan">Plan</option></select></label>
        </div>
        <div style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14, overflow: 'hidden' }}>
          <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 720 }}>
            <thead><tr>
              <th style={{ ...th, paddingTop: 14 }}>Desk</th><th style={th}>Status</th><th style={th}>Plan</th><th style={th}>Owner</th><th style={th}>People</th><th style={th}>Country</th><th style={th}>Joined</th>
            </tr></thead>
            <tbody>
              {rows.map(t => (<tr key={t.id} onClick={() => goto('#/desks/' + t.id)} style={{ cursor: 'pointer' }} onMouseEnter={e => e.currentTarget.style.background = 'var(--hover)'} onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <td style={td}><div style={{ fontWeight: 600 }}>{t.name}</div><div style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)' }}>{t.slug}</div></td>
                <td style={td}><Pill tone={STATUS_TONE[t.status]} dot>{t.status}</Pill></td>
                <td style={td}><Pill tone={PLAN_TONE[t.plan]}>{t.plan}</Pill></td>
                <td style={td}>{t.owner ? <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Avatar name={t.owner.name} /><span><span style={{ display: 'block' }}>{t.owner.name}</span><span style={{ display: 'block', fontFamily: MONO, fontSize: 11, color: 'var(--faint)' }}>{t.owner.staffId}</span></span></span> : <span style={{ color: 'var(--faint)' }}>—</span>}</td>
                <td style={{ ...td, fontFamily: MONO, color: 'var(--mute)' }}>{t.staffCount}</td>
                <td style={{ ...td, color: 'var(--mute)' }}>{t.country || '—'}</td>
                <td style={{ ...td, fontFamily: MONO, fontSize: 12.5, color: 'var(--mute)' }}>{fmtDay(t.createdAt)}</td>
              </tr>))}
              {rows.length === 0 && <tr><td colSpan={7} style={{ ...td, textAlign: 'center', color: 'var(--faint)', padding: 40 }}>No desks match.</td></tr>}
            </tbody>
          </table>
          </div>
        </div>
      </div>)}

      {!route.id && tab === 'applications' && <Pipeline kind="early_access" onCounts={() => loadAll()}
        blurb="Every application from the site, and where you have got to with it. An application becomes accepted when that person creates their desk — not by hand — so this list and the desk list always agree." />}

      {!route.id && tab === 'messages' && <Pipeline kind="contact" onCounts={() => loadAll()}
        blurb="Notes sent from the contact page. Each one was promised a reply within a business day." />}

      {!route.id && tab === 'activity' && (<div style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 14, padding: '4px 16px' }}>
        {!audit && <div style={{ padding: 20, color: 'var(--mute)', fontFamily: MONO }}>Loading…</div>}
        {audit && audit.map(e => (<div key={e.id} style={{ display: 'flex', gap: 14, alignItems: 'baseline', padding: '11px 0', borderBottom: '1px solid var(--line2)' }}>
          <span style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--faint)', width: 130, flex: 'none' }}>{fmtWhen(e.at)}</span>
          <span style={{ fontFamily: MONO, fontSize: 12.5, fontWeight: 700, width: 190, flex: 'none', color: e.action.indexOf('deleted') >= 0 || e.action.indexOf('suspend') >= 0 ? 'var(--amber)' : 'var(--text)' }}>{e.action}</span>
          <span style={{ fontSize: 13, flex: 1 }}>{e.tenantName}{e.actorId && <span style={{ color: 'var(--faint)' }}> · {e.actorId}</span>}</span>
        </div>))}
        {audit && audit.length === 0 && <div style={{ padding: 20, color: 'var(--faint)' }}>No activity yet.</div>}
      </div>)}
    </div>
    {creating && <CreateModal onClose={() => setCreating(false)} onCreated={loadAll} />}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
